<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extella Plugins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Lora:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --a:#D4944A;--ar:212,148,74;--amber:#E0A85E;--petrol:#5FA8A0;--petrol-r:95,168,160;
  --bg:#0A0A0A;--s1:#141414;--s2:#181818;--s3:#1E1E1E;--s4:#262626;
  --bd:rgba(243,238,229,.09);--bd2:rgba(243,238,229,.18);
  --tx:#F5F3EE;--tx2:#C9C3B8;--tx3:#8C8C8C;--r:5px;
  --shadow:none;
  --serif:'Source Serif 4','Lora',Georgia,serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
[data-lm]{
  --amber:#A96617;
  --a:#C57E33;--ar:197,126,51;--petrol:#2F6B66;--petrol-r:47,107,102;--bg:#FAF9F5;--s1:#FFFFFF;--s2:#F5F3EC;--s3:#EFECE2;--s4:#E5E1D4;
  --bd:#D7E0DC;--bd2:#B7CEC9;
  --tx:#0A0A0A;--tx2:#2A2A2A;--tx3:#8C8C8C;
  --shadow:none}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── Header ─────────────────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 18px;
  background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--a);
  box-shadow:none;flex-shrink:0}
.lnm{font-size:14px;font-weight:700;letter-spacing:-.02em}
.sp{flex:1}
.bclose{background:none;border:none;color:var(--tx2);cursor:pointer;
  font-size:16px;padding:4px 8px;border-radius:5px;transition:all .15s;flex-shrink:0}
.bclose:hover{color:var(--tx);background:var(--s3)}

/* ── Tabs ────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:1px;padding:6px 18px;background:var(--s1);
  border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;
  color:var(--tx2);background:transparent;border:none;white-space:nowrap;transition:all .15s;
  display:flex;align-items:center;gap:4px}
.tab:hover{color:var(--tx);background:var(--s3)}
.tab.on{color:var(--a);background:rgba(var(--ar),.1);font-weight:600}
.tab_sep{margin-left:6px;border-left:1px solid var(--bd2);border-radius:0 5px 5px 0;padding-left:14px;color:var(--petrol);font-weight:600}
.tab_sep.on{color:var(--petrol);background:color-mix(in srgb,var(--petrol) 12%,transparent)}
.adm_bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 0 10px;
  border:1px dashed var(--bd2);border-radius:5px;background:var(--s2)}
.adm_note{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-right:auto}
.steps{grid-column:1/-1;display:flex;gap:20px;flex-wrap:wrap;margin:2px 0 12px}
.step{display:flex;gap:10px;align-items:flex-start;max-width:270px;font-size:13px;color:var(--tx2);line-height:1.45}
.step b{color:var(--tx)}
.step code{font-family:var(--mono);font-size:11.5px;background:var(--s3);border:1px solid var(--bd);border-radius:4px;padding:0 4px}
.step_n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--petrol);border:1px solid var(--petrol);
  border-radius:5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.tab_skills{margin-left:6px;color:#fff;background:var(--a);font-weight:600}
.tab_skills:hover{color:#fff;background:var(--a);opacity:.9}
.tn{font-size:9.5px;opacity:.5}

/* ── Filter bar ──────────────────────────────────────────────────────── */
#filter_bar{background:var(--s1);border-bottom:1px solid var(--bd);
  padding:10px 18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.fb_row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb_srch{flex:1;min-width:160px;position:relative}
.fb_sinp{width:100%;background:var(--s3);border:1px solid var(--bd2);border-radius:5px;
  color:var(--tx);font-size:12px;padding:7px 32px 7px 11px;outline:none;
  transition:border-color .15s,box-shadow .15s;font-family:inherit}
.fb_sinp:focus{border-color:rgba(var(--ar),.4);box-shadow:none}
.fb_sinp::placeholder{color:var(--tx3)}
.fb_sico{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--tx3);pointer-events:none}
.fb_sel{background:var(--s3);border:1px solid var(--bd2);border-radius:5px;
  color:var(--tx);font-size:11.5px;padding:6px 9px;outline:none;cursor:pointer;
  font-family:inherit;transition:border-color .15s}
.fb_sel:focus{border-color:rgba(var(--ar),.4)}

/* ── Topic chips ─────────────────────────────────────────────────────── */
.fb_topics{display:flex;gap:5px;flex-wrap:wrap}
.tpchip{background:var(--s3);border:1px solid var(--bd2);border-radius:5px;
  color:var(--tx2);font-size:11px;font-weight:500;padding:4px 10px;cursor:pointer;
  transition:all .14s;white-space:nowrap}
.tpchip:hover{color:var(--tx)}
.tpchip.on{background:rgba(var(--ar),.12);color:var(--a);
  border-color:rgba(var(--ar),.3)!important;font-weight:600}

/* ── Scroll area ─────────────────────────────────────────────────────── */
.scr{flex:1;overflow-y:auto;padding:14px 18px 28px;
  scrollbar-width:thin;scrollbar-color:var(--s4) transparent}
.scr::-webkit-scrollbar{width:3px}
.scr::-webkit-scrollbar-thumb{background:var(--s4);border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

/* ── Command bar: the store's main entry, paste a link, get a plugin ── */
/* segmented toggle + theme button (from the storefront concept) */
.seg{display:flex;gap:2px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:3px}
.seg button{border:none;background:transparent;color:var(--tx3);font:600 12.5px var(--sans);padding:6px 15px;border-radius:5px;cursor:pointer}
.seg button.on{background:rgba(var(--ar),.16);color:var(--amber)}
.iconbtn{border:1px solid var(--bd);background:var(--s2);color:var(--tx);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn:hover{border-color:var(--bd2)}

.cmdbar{display:flex;gap:10px;padding:18px 18px 6px;background:var(--s1);flex-shrink:0}
.cmdbar input{flex:1;background:var(--s2);border:1px solid var(--bd2);border-radius:5px;
  padding:16px 18px;font:500 14.5px var(--sans);color:var(--tx);outline:none;min-width:0;box-shadow:none}
.cmdbar input::placeholder{color:var(--tx3)}
.cmdbar input:focus{border-color:rgba(var(--ar),.55)}
.cmdgo{border:none;border-radius:5px;background:var(--a);color:#fff;font:800 14px var(--sans);padding:0 26px;cursor:pointer;flex-shrink:0}
.cmdgo:hover{filter:brightness(1.1)}

/* ── Card: accent-tinted gradient fill + accent top spine ─────────────── */
.rcard{position:relative;border:1px solid var(--bd);border-radius:var(--r);
  background:linear-gradient(157deg,
    color-mix(in srgb, var(--acc,var(--a)) 6%, var(--s2)) 0%,
    var(--s2) 40%);
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  transition:border-color .14s,box-shadow .14s,transform .14s;animation:fiu .18s ease both}
.rcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:2;
  background:var(--acc,var(--a))}
/* composed cover: avatar + owner + name, quiet panel + spine (the concept's price-tag) */
.rcv{display:flex;align-items:center;gap:11px;margin:-14px -16px 0;padding:14px 16px 12px;
  background:var(--s3);border-bottom:1px solid var(--bd);position:relative}
.rcv_av{width:40px;height:40px;border-radius:5px;object-fit:cover;flex-shrink:0;
  box-shadow:none}
.rcv_t{min-width:0}
.rcv_org{font:700 9.5px var(--mono);letter-spacing:.01em;color:var(--tx2);
  text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcv_nm{font-size:15px;font-weight:750;color:var(--tx);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc_type{position:absolute;top:11px;right:10px;font:700 8.5px var(--mono);
  letter-spacing:.02em;text-transform:none;color:var(--a);
  border:1px solid rgba(var(--ar),.4);border-radius:5px;padding:2px 6px}

/* ── Merch hero: the story slot, fed from the cloud (_mkt_merch) ──────── */
.mhero{grid-column:1/-1;position:relative;overflow:hidden;border:1px solid var(--bd);
  border-radius:var(--r);padding:16px 22px;
  background:linear-gradient(157deg,
    color-mix(in srgb, var(--acc,var(--a)) 12%, var(--s2)) 0%,
    var(--s2) 62%);
  display:flex;flex-direction:column;gap:9px;animation:fiu .18s ease both}
.mhero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--acc,var(--a))}
.mh_promo{align-self:flex-start;font:700 9.5px var(--mono);letter-spacing:.01em;
  color:#fff;background:var(--a);border-radius:5px;padding:3px 9px;text-transform:none}
.mh_src{font:600 10.5px var(--mono);letter-spacing:.01em;color:var(--tx2);text-transform:none}
.mh_title{font:600 20px/1.22 var(--serif);color:var(--tx);max-width:34ch;letter-spacing:0}
.mh_title i{font-style:normal;color:inherit}
.mh_facts{list-style:none;display:flex;flex-direction:column;gap:4px;margin:2px 0;padding:0}
.mh_facts li{font-size:13.5px;font-weight:500;color:var(--tx);opacity:.85;line-height:1.45;
  padding-left:20px;position:relative}
.mh_facts li::before{content:"→";position:absolute;left:0;color:var(--a);font-weight:700}
.mh_row{display:flex;align-items:center;gap:14px;margin-top:4px}

/* ── Hero carousel: rotating banners (heroes[]) ───────────────────────── */
.mhero-car{grid-column:1/-1;position:relative}
.mhero-car .mhslide{display:none}
.mhero-car .mhslide.on{display:block}
.mhdots{display:flex;gap:6px;justify-content:center;margin-top:11px}
.mhdot{width:7px;height:7px;padding:0;border:none;border-radius:50%;background:var(--bd2);
  cursor:pointer;transition:width .2s,background .2s}
.mhdot.on{background:var(--a);width:18px;border-radius:5px}

/* ── "Выбор Extella": the living tile shelf (shelf[]) ───────────────── */
.mshelf{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.mshelf_capped .stile:nth-child(n+49){display:none}
.stile{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:var(--r);
  padding:15px 16px 14px;display:flex;flex-direction:column;gap:7px;
  background:var(--s1);
  transition:border-color .14s,box-shadow .14s,transform .14s;animation:fiu .18s ease both}
.stile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--acc,var(--a))}
.stile:hover{border-color:var(--bd2);box-shadow:none;transform:translateY(-2px)}
[data-lm] .stile:hover{box-shadow:none}
.st_chip{align-self:flex-start;font:600 8px var(--mono);letter-spacing:.01em;color:var(--tx3);text-transform:none}
.st_top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.home_intro{grid-column:1/-1;text-align:center;max-width:640px;margin:0 auto;padding:6px 0 16px}
.hi_eye{font:700 10px var(--mono);letter-spacing:.01em;color:var(--a);text-transform:none;margin-bottom:12px}
.hi_h{font:600 27px/1.04 var(--serif);color:var(--tx);letter-spacing:-.01em;margin:0 0 7px;text-wrap:balance}
.hi_sub{font-size:13.5px;line-height:1.5;color:var(--tx2);margin:0 auto 14px;max-width:560px}
.hi_prompt{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;margin:0 auto;
  background:var(--s2);border:1px solid var(--bd2);border-radius:5px;padding:8px 8px 8px 18px;
  transition:border-color .14s,box-shadow .14s}
.hi_prompt:focus-within{border-color:var(--a);box-shadow:none}
.hi_prompt_ic{font-size:14px;opacity:.75;flex-shrink:0}
.hi_inp{flex:1;min-width:0;background:transparent;border:none;outline:none;font-size:14px;color:var(--tx)}
.hi_inp::placeholder{color:var(--tx3)}
.hi_go{background:var(--a);color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:700;
  padding:10px 18px;cursor:pointer;flex-shrink:0}
.hi_go:hover{opacity:.9}
.hi_chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.hi_chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);border-radius:5px;
  --lico-sz:15px;
  padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .14s,color .14s,transform .14s}
.hi_chip:hover{border-color:var(--a);color:var(--a);transform:translateY(-1px)}
.hi_chip .lico{width:15px;height:15px}
.hi_exlbl{font:600 12px var(--sans);color:var(--tx3);margin:14px 0 8px}
.hi_ex{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.hi_ex_card{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);
  border-radius:var(--r);padding:7px 10px;cursor:pointer;font:600 12px var(--sans);white-space:nowrap;
  transition:border-color .12s,color .12s,transform .12s}
.hi_ex_card:hover{border-color:var(--a);color:var(--a);transform:translateY(-1px)}
.hi_ex_card .lico{width:16px;height:16px;color:var(--tx3);flex-shrink:0}
.hi_ex_card:hover .lico{color:var(--a)}
.catbar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;padding:0 0 14px}
.cat_chip{display:inline-flex;align-items:center;white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--bd2);background:transparent;color:var(--tx2);border-radius:5px;
  padding:8px 15px;font-size:13px;font-weight:600;line-height:1;cursor:pointer;transition:all .14s}
.cat_chip:hover{border-color:var(--a);color:var(--a)}
.cat_chip.on{background:var(--a);border-color:var(--a);color:#fff}
.cat_n{opacity:.55;font-size:11px;font-family:var(--mono);margin-left:5px}
.ch_ico{position:absolute;top:34px;right:34px;color:var(--acc,var(--a));opacity:.9;pointer-events:none}
.ch_ico .lico{width:76px;height:76px;stroke-width:1.2}
.mini_ico{position:absolute;top:12px;right:14px;color:var(--acc,var(--a));opacity:.92;pointer-events:none}
.mini_ico .lico{width:20px;height:20px}
.ccard .mini_h{padding-right:26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.st_ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--acc,var(--a))}
.st_ico .lico{width:22px;height:22px}
.st_title{font:600 13.5px/1.4 var(--sans);color:var(--tx);letter-spacing:0;margin-top:1px}
.st_name{font-size:11px;font-weight:600;color:var(--acc,var(--a));margin-top:-2px;margin-bottom:2px}
.st_title i{font-style:normal;color:inherit}
.acc_sub{display:block;font-style:normal;font-weight:500;color:var(--tx2);margin-top:2px}
.st_fact{font-size:12px;color:var(--tx);opacity:.78;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st_src{font:600 9.5px var(--mono);letter-spacing:.01em;color:var(--tx2);
  text-transform:none;margin-top:auto}
.st_foot{display:flex;margin-top:auto;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px}
.st_head{display:flex;align-items:center;gap:10px;min-width:0}
.st_head .st_ico{width:30px;height:30px;border:1px solid var(--bd);border-radius:var(--r);background:var(--s2)}
.st_head .st_ico .lico{width:17px;height:17px}
.st_head .st_title{margin-top:0;min-width:0}
.st_sig{font:600 9px var(--mono);letter-spacing:.02em;color:var(--tx3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st_foot.fsig{justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--bd)}
.st_btn{background:var(--acc,var(--a));color:#fff;border:none;border-radius:5px;
  font-size:11px;font-weight:700;padding:6px 14px;cursor:pointer}
.st_btn:hover{transform:translateY(-1px)}
.st_btn,.cbtn,.cget,.hi_go,.mci_btn{border-radius:5px}
.st_btn:hover,.cbtn:hover,.cget:hover,.hi_go:hover{background:var(--petrol);opacity:1}
.mci_btn:hover{background:var(--petrol);border-color:var(--petrol);color:#fff}
.cat_back{grid-column:1/-1;padding:0 0 2px}
.cb_btn{border:none;background:transparent;color:var(--tx2);font:600 13px var(--sans);cursor:pointer;padding:4px 0}
.cb_btn:hover{color:var(--a)}
.cat_chip .ci{display:inline-flex;margin-right:5px}
.cat_chip .ci .lico{width:15px;height:15px}
.cat_chip.off{opacity:.45}

/* ══ Bento hero (from the approved storefront concept) ══════════════════ */
.bento{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:182px;gap:12px}
.ccard{position:relative;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
.ccard:hover{transform:translateY(-3px);border-color:var(--bd2);box-shadow:none}
.ccard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:3;
  background:linear-gradient(90deg,var(--acc,var(--a)) 0%,color-mix(in srgb,var(--acc,var(--a)) 30%,transparent) 85%)}
.chero{grid-column:span 2;grid-row:span 2;
  background:radial-gradient(340px 200px at 85% 8%,color-mix(in srgb,var(--acc,#2F6B66) 13%,transparent),transparent 70%),var(--s2)}
.splats{position:absolute;inset:0;pointer-events:none;opacity:.32;background:
  radial-gradient(4px 4px at 78% 16%,var(--acc,#2F6B66) 50%,transparent 51%),
  radial-gradient(3px 3px at 86% 30%,#D65CA8 50%,transparent 51%),
  radial-gradient(5px 5px at 68% 22%,#E8A85C 50%,transparent 51%),
  radial-gradient(3px 3px at 90% 52%,#3D8078 50%,transparent 51%),
  radial-gradient(4px 4px at 74% 40%,#5B8DEF 50%,transparent 51%),
  radial-gradient(2px 2px at 82% 62%,#E8A85C 50%,transparent 51%)}
.hbody{position:relative;margin-top:auto;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.hsrc{font:600 10.5px var(--mono);letter-spacing:.01em;color:var(--tx3);text-transform:none}
.chero h3{font:600 22px/1.18 var(--serif);color:var(--tx);text-wrap:balance;max-width:26ch;letter-spacing:0}
.chero h3 i{font-style:normal;color:inherit}
.cfacts{list-style:none;display:flex;flex-direction:column;gap:5px;margin:0;padding:0}
.cfacts li{font-size:14px;font-weight:500;color:var(--tx2);line-height:1.45;padding-left:22px;position:relative}
.cfacts li::before{content:"→";position:absolute;left:0;color:var(--amber);font-weight:700}
.hrow{display:flex;align-items:center;gap:14px;margin-top:8px}
.cbtn{border:none;border-radius:5px;background:var(--a);color:#fff;font:800 13.5px var(--sans);padding:11px 24px;cursor:pointer}
.cbtn:hover{filter:brightness(1.1)}
.cget{border:1.5px solid var(--a);border-radius:5px;background:transparent;color:var(--amber);font:700 12.5px var(--sans);padding:7px 16px;cursor:pointer}
.cget:hover{background:var(--a);color:#fff}
.cstat{font:12px var(--mono);color:var(--tx3);font-variant-numeric:tabular-nums}
.cpromo{position:absolute;top:12px;left:12px;font:700 9px var(--mono);letter-spacing:.01em;
  color:#fff;background:var(--a);border-radius:5px;padding:3px 8px;text-transform:none;z-index:2}
.mini_body{padding:12px 16px;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.mini_h{font:600 17px/1.24 var(--serif);color:var(--tx);letter-spacing:0}
.mini_h i{font-style:normal;color:inherit}
.mini_desc{font-size:12.5px;font-weight:500;color:var(--tx2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini_foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;flex-shrink:0}
@media(max-width:900px){.bento{grid-template-columns:1fr 1fr}.chero{grid-column:span 2}}

/* ── Skills shelf (Навыки as an in-store category) ─────────────────────── */
.sk_lead{grid-column:1/-1;font-size:13px;color:var(--tx2);line-height:1.5;margin:-2px 0 8px}
.sk_howto{font-size:11.5px;color:var(--tx);opacity:.9;background:rgba(var(--ar),.07);
  border:1px solid rgba(var(--ar),.15);border-radius:5px;padding:8px 10px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk_howto b{color:var(--a)}
.sk_active{font:700 10px var(--mono);color:#2f9e56;letter-spacing:.02em}
.sk_del{background:transparent;color:var(--tx2);border:1px solid var(--bd2);border-radius:5px;
  font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer}
.sk_del:hover{color:#e0533d;border-color:#e0533d}
/* agent picker modal */
.apick{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.apick.on{display:flex}
.apick_box{background:var(--s1);border:1px solid var(--bd);border-radius:5px;width:100%;max-width:460px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:none}
.apick_h{padding:18px 20px 14px;font-size:16px;font-weight:700;border-bottom:1px solid var(--bd)}
.apick_h b{color:var(--a)}
.apick_list{padding:8px;overflow-y:auto}
.apick_row{padding:11px 13px;border-radius:5px;cursor:pointer;transition:background .12s}
.apick_row:hover{background:var(--s3)}
.ap_nm{font-size:14px;font-weight:600;color:var(--tx)}
.ap_sub{font-size:12px;color:var(--tx3);margin-top:2px}
.ap_sec{font:700 10px var(--mono);letter-spacing:.02em;text-transform:none;color:var(--tx3);padding:14px 13px 6px}
.ap_load{padding:14px 13px;font-size:13px;color:var(--tx3)}
.apick_foot{padding:10px 16px 14px;display:flex;justify-content:flex-end;border-top:1px solid var(--bd)}

/* ── Merch collections: editorial banner cards, cloud-managed ─────────── */
.mcoll{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--s2);padding:16px;display:flex;flex-direction:column;gap:8px;animation:fiu .18s ease both}
.mcoll::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--acc,var(--a))}
.mc_eye{font:600 8.5px var(--mono);letter-spacing:.02em;color:var(--a);text-transform:none;opacity:.9}
.mc_title{font:600 19px/1.25 var(--serif);color:var(--tx)}
.mc_desc{font-size:12.5px;font-weight:500;color:var(--tx);opacity:.75;line-height:1.45}
.mc_items{display:flex;flex-direction:column;margin-top:2px}
.mci{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd)}
.mci_nm{flex:1;font-size:12.5px;font-weight:650;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mci_ic{display:inline-flex;vertical-align:-3px;margin-right:7px;color:var(--acc,var(--a))}
.mci_ic .lico{width:14px;height:14px}
.mci_btn{border:1px solid rgba(var(--ar),.5);border-radius:5px;background:transparent;color:var(--a);
  font:700 11px -apple-system,sans-serif;padding:4px 12px;cursor:pointer;flex-shrink:0}
.mci_btn:hover{background:var(--a);color:#fff}
/* промо-ярлык на карточке каталога (слот из облачной выкладки) */
.rc_promochip{font:700 8.5px var(--mono);letter-spacing:.02em;color:#fff;
  background:var(--a);border-radius:5px;padding:2.5px 7px;text-transform:none;flex-shrink:0}
.rcard:hover{border-color:var(--bd2);box-shadow:none;transform:translateY(-2px)}
[data-lm] .rcard:hover{box-shadow:none}
.rcard.inst{border-color:rgba(var(--ar),.3)}
.rc_top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rc_repo{min-width:0}
.rc_owner{font-size:10.5px;color:var(--tx2);margin-bottom:2px}
.rc_name{font-size:13px;font-weight:700;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.rc_stars{display:flex;align-items:center;gap:3px;flex-shrink:0;
  font-size:11.5px;font-weight:700;color:#f59e0b;white-space:nowrap}
.rc_desc{font-size:13.5px;font-weight:500;color:var(--tx);opacity:.82;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc_meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:18px}
.rc_pill{background:rgba(var(--ar),.08);color:var(--a);border:1px solid rgba(var(--ar),.14);
  border-radius:5px;font-size:9.5px;font-weight:600;padding:2px 7px;white-space:nowrap}
.rc_dot{color:var(--tx3);font-size:10px}
.rc_info{font-size:10.5px;color:var(--tx2)}
.rc_foot{display:flex;align-items:center;justify-content:flex-end;margin-top:2px}
.rc_btn{background:var(--a);color:#000;border:none;border-radius:5px;
  font-size:11.5px;font-weight:800;padding:7px 18px;cursor:pointer;
  transition:opacity .12s,transform .1s;white-space:nowrap}
.rc_btn:hover{opacity:.85;transform:translateY(-1px)}
.rc_btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.rc_btn.done{background:rgba(var(--ar),.1);color:var(--a);
  border:1px solid rgba(var(--ar),.25);cursor:default}
.rc_btn.done:hover{opacity:1;transform:none}

/* ── Skeleton ────────────────────────────────────────────────────────── */
.skel{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);
  height:140px;overflow:hidden;position:relative}
.skel::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);
  background-size:200% 100%;animation:sh 1.4s linear infinite}
[data-lm] .skel::after{
  background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.04) 50%,transparent 100%);
  background-size:200% 100%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Banners ─────────────────────────────────────────────────────────── */
.banner{grid-column:1/-1;padding:14px 18px;border-radius:var(--r);
  font-size:12px;line-height:1.6;display:flex;align-items:flex-start;gap:10px}
.banner.warn{background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2);color:#fb923c}
.banner.err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);color:#f87171}
.total_hint{grid-column:1/-1;font-size:11px;color:var(--tx3);padding:2px 0 4px}
.load_more{grid-column:1/-1;display:flex;justify-content:center;padding:10px 0 4px}
.load_more_btn{background:var(--s3);border:1px solid var(--bd2);border-radius:5px;
  color:var(--tx2);font-size:12px;font-weight:600;padding:9px 28px;cursor:pointer;
  transition:all .14s;font-family:inherit}
.load_more_btn:hover{color:var(--tx);background:var(--s4)}

/* ── Installed plugin cards ──────────────────────────────────────────── */
.icard{grid-column:1/-1;background:var(--s2);border:1px solid rgba(var(--ar),.2);border-radius:var(--r);
  padding:13px 16px;display:flex;align-items:center;gap:12px;
  animation:fiu .18s ease both;transition:border-color .14s}
.icard:hover{border-color:rgba(var(--ar),.38)}
.idot{width:8px;height:8px;border-radius:50%;background:var(--a);
  box-shadow:none;flex-shrink:0}
.iinfo{flex:1;min-width:0}
.iname{font-size:13px;font-weight:700;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isub{font-size:11px;color:var(--tx2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iacts{display:flex;gap:6px;flex-shrink:0}
.ibtn_open{background:rgba(var(--ar),.1);color:var(--a);border:1px solid rgba(var(--ar),.2);
  border-radius:5px;font-size:11px;font-weight:700;padding:5px 12px;cursor:pointer;
  transition:background .12s;white-space:nowrap}
.ibtn_open:hover{background:rgba(var(--ar),.2)}
.ibtn_rm{background:none;border:1px solid var(--bd2);color:var(--tx2);
  border-radius:5px;font-size:11px;padding:5px 10px;cursor:pointer;
  transition:all .12s;white-space:nowrap}
.ibtn_rm:hover{border-color:#f87171;color:#f87171}

/* ── Section headers (Featured / Other) ──────────────────────────────── */
.sect_hdr{grid-column:1/-1;display:flex;align-items:center;gap:8px;
  padding:4px 0 2px;margin-top:4px}
.sect_hdr:first-child{margin-top:0}
.sect_title{font:600 9.5px var(--mono);color:var(--tx3);text-transform:none;letter-spacing:.02em}
.sect_jump{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;padding:0;
  font:600 12.5px var(--sans);color:var(--tx);letter-spacing:0}
.sect_jump:hover{color:var(--a)}
.sect_jump .ci{display:inline-flex;width:15px;height:15px;color:var(--tx3)}
.sect_jump:hover .ci{color:var(--a)}
.sect_jump .cat_n{font:600 11px var(--mono);color:var(--tx3)}
.seeall{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;
  border:1px dashed var(--bd2);border-radius:var(--r);padding:14px 16px;cursor:pointer;
  color:var(--tx2);font:600 13px var(--sans);background:transparent;min-height:96px}
.seeall:hover{border-color:var(--a);color:var(--a)}
.seeall b{font:700 20px var(--serif);line-height:1}
.sect_line{flex:1;height:1px;background:var(--bd)}
.sect_badge{background:rgba(var(--ar),.12);color:var(--a);
  border:1px solid rgba(var(--ar),.25);border-radius:5px;
  font-size:9px;font-weight:700;padding:1px 7px;letter-spacing:.02em}

/* ── Featured card accent ────────────────────────────────────────────── */
.rcard.feat{border-color:rgba(var(--ar),.22);
  background:color-mix(in srgb,var(--a) 3%,var(--s2))}
.rcard.feat:hover{border-color:rgba(var(--ar),.4)}
.rc_btn.installing{opacity:.6;cursor:wait}

/* ── Category chips (business aisles, concept .tchip pill) ───────────── */
.cat_tabs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 10px}
.cat_tab{background:transparent;border:1px solid var(--bd2);border-radius:5px;
  color:var(--tx2);font:600 12.5px var(--sans);padding:8px 16px;cursor:pointer;
  transition:all .14s;white-space:nowrap}
.cat_tab:hover{color:var(--amber);border-color:var(--amber)}
.cat_tab.active{background:var(--a);color:#fff;border-color:var(--a)!important}

/* ── Section headers: eyebrow + serif title (concept .sect) ─────────── */
.sect{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin:40px 0 16px;flex-wrap:wrap}
.sect .eyebrow{font:600 9px var(--mono);letter-spacing:.01em;color:var(--amber);text-transform:none;white-space:nowrap}
.sect h2{font:600 22px/1.2 var(--serif);color:var(--tx);letter-spacing:0;margin:0}
.sect h2 i{font-style:normal;color:inherit}
.sect .sp{flex:1}
.sect a{font:600 12.5px var(--sans);color:var(--tx3);text-decoration:none;white-space:nowrap}
.sect a:hover{color:var(--amber)}

/* ── Collapsible Other toggle ───────────────────────────────────────── */
.sect_toggle{background:none;border:none;cursor:pointer;
  color:var(--tx2);font-size:11px;padding:2px 6px;border-radius:5px;
  transition:all .14s;display:flex;align-items:center;gap:4px;font-family:inherit}
.sect_toggle:hover{color:var(--tx);background:var(--s3)}
.other_body_wrap{grid-column:1/-1;display:contents}
.other_filters{grid-column:1/-1}
#filter_stash{display:none}

/* ── Empty states ────────────────────────────────────────────────────── */
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--tx2)}
.eico{font-size:36px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px;margin-top:6px;line-height:1.6}

/* ── HuggingFace kind toggle ─────────────────────────────────────────── */
.hf_kind_toggle{display:flex;gap:2px;background:var(--s3);border:1px solid var(--bd2);
  border-radius:5px;padding:2px;flex-shrink:0}
.hf_kind_btn{background:none;border:none;color:var(--tx2);font-size:11.5px;font-weight:500;
  padding:4px 11px;border-radius:5px;cursor:pointer;transition:all .14s;white-space:nowrap;
  font-family:inherit}
.hf_kind_btn:hover{color:var(--tx)}
.hf_kind_btn.on{background:var(--s1);color:var(--tx);font-weight:700;
  box-shadow:none}
#hf_filter_stash{display:none}
.hf_badge{background:rgba(255,176,47,.12);color:#f59e0b;border:1px solid rgba(255,176,47,.25);
  border-radius:5px;font-size:9px;font-weight:700;padding:1px 6px}
.hf_tab_icon{opacity:.8;margin-right:1px}
.hf_res_block{background:var(--s3);border:1px solid var(--bd);border-radius:5px;
  padding:8px 12px;margin-top:6px;font-size:10.5px;color:var(--tx2);line-height:1.7}
.hf_res_block b{color:var(--tx);font-weight:600}
.rc_hf_kind{background:rgba(255,176,47,.1);color:#d97706;border:1px solid rgba(255,176,47,.2);
  border-radius:5px;font-size:9px;font-weight:700;padding:2px 7px;white-space:nowrap}


/* ══ Плавающие окна плагинов ══ */
#etb_windows{position:fixed;inset:0;z-index:9998;pointer-events:none}
.pwin{position:absolute;width:460px;height:560px;min-width:320px;min-height:220px;display:flex;flex-direction:column;
  background:var(--s1);border:1px solid var(--bd2);border-radius:5px;box-shadow:none;overflow:hidden;pointer-events:auto}
.pwin_bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 13px;background:var(--s2);border-bottom:1px solid var(--bd);cursor:move;user-select:none}
.pwin_ic{font-size:15px;line-height:1}
.pwin_ttl{font:600 13px var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.pwin_sp{flex:1}
.pwin_btn{width:27px;height:27px;border:none;background:transparent;color:var(--tx2);border-radius:5px;cursor:pointer;font-size:13px;line-height:1;transition:background .12s,color .12s}
.pwin_btn:hover{background:var(--s4);color:var(--tx)}
.pwin_x:hover{background:#e5484d;color:#fff}
.pwin_body{flex:1;position:relative;background:var(--bg)}
.pwin_if{width:100%;height:100%;border:none;display:block}
.pwin_rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3}
.pwin_rs::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);border-bottom-right-radius:2px}
.pw_dragging .pwin_if{pointer-events:none}
#etb_dock{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;pointer-events:none;justify-content:center}
.dock_chip{pointer-events:auto;background:var(--s1);border:1px solid var(--bd2);border-radius:5px;padding:8px 15px;font:600 12.5px var(--sans);color:var(--tx);cursor:pointer;box-shadow:none}
.dock_chip:hover{border-color:var(--a);color:var(--a)}

@keyframes fiu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* ===== Workspace (кокпит) ===== */
.ws_lead{font-size:13.5px;color:var(--tx2);margin:2px 0 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ws_priv{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--sans);color:#2F6B66;background:rgba(47,107,102,.1);border:1px solid rgba(47,107,102,.25);border-radius:20px;padding:2px 9px;white-space:nowrap}
.ws_bl{font:600 11px var(--sans);border-radius:20px;padding:2px 9px}
.ws_bl.crit{color:#B23A2E;background:rgba(178,58,46,.1)}
.ws_bl.ok{color:#2E7D5B;background:rgba(46,125,91,.1)}
.ws_new{cursor:pointer}
.ws_wrap{animation:fiu .25s ease;max-width:100%}
.ws_hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ws_bkbtn,.ws_ghost{background:transparent;border:1px solid var(--bd2);color:var(--tx2);border-radius:6px;padding:5px 11px;font:600 12px var(--sans);cursor:pointer}
.ws_bkbtn:hover,.ws_ghost:hover{border-color:var(--a);color:var(--a)}
.ws_h1{font-family:var(--serif);font-size:clamp(22px,3vw,30px);letter-spacing:-.01em;margin:0 0 4px;color:var(--tx)}
.ws_understood{font-size:15px;color:var(--tx2);max-width:66ch;line-height:1.5}
.ws_pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.ws_pill{font:600 12px var(--sans);border:1px solid var(--bd2);color:var(--tx2);border-radius:20px;padding:3px 11px}
.ws_pill.crit{color:#B23A2E;border-color:rgba(178,58,46,.4);background:rgba(178,58,46,.08)}
.ws_pill.ok{color:#2E7D5B;border-color:rgba(46,125,91,.4);background:rgba(46,125,91,.08)}
.ws_ambient{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(192,130,14,.08);border:1px solid var(--bd2);border-left:3px solid #C0820E;border-radius:10px;padding:13px 16px;margin:16px 0 6px;flex-wrap:wrap}
.ws_amb_k{font:600 12px var(--sans);color:#C0820E;letter-spacing:.02em}
.ws_cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:720px){.ws_cols{grid-template-columns:1fr}}
.ws_card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;min-width:0}
.ws_card_h{font:700 12px var(--mono);letter-spacing:.02em;color:var(--tx3);margin-bottom:12px}
.ws_dim{font-weight:400;text-transform:none;letter-spacing:0}
.ws_gap{border:1px solid var(--bd2);border-left:3px solid var(--bd2);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.ws_gap.crit{border-left-color:#B23A2E}.ws_gap.warn{border-left-color:#B8791C}
.ws_gap_t{font-weight:650;font-size:14px}
.ws_gap_w{font-size:12.5px;color:var(--tx2);margin:3px 0 8px;line-height:1.45}
.ws_act,.ws_undo{font:600 12px var(--sans);border:1px solid var(--bd2);background:transparent;color:var(--tx3);border-radius:6px;padding:4px 10px;cursor:not-allowed;opacity:.7}
.ws_empty{font-size:13px;color:var(--tx3);padding:6px 0}
.ws_pack_n{font-family:var(--serif);font-size:18px;color:var(--tx);margin-bottom:8px}
.ws_soon{font:600 10px var(--sans);color:#B8791C;background:rgba(184,121,28,.12);border-radius:10px;padding:1px 7px;vertical-align:middle}
.ws_caps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ws_cap{font:500 12px var(--sans);background:rgba(47,107,102,.1);color:#2F6B66;border-radius:6px;padding:3px 9px}
.ws_apilot{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--bd2);padding-top:12px}
.ws_rules{font-size:11.5px;color:var(--tx3);margin-top:4px;line-height:1.5}
.ws_tgl{position:relative;display:inline-block;width:34px;height:20px;flex-shrink:0}
.ws_tgl input{opacity:0;width:0;height:0}
.ws_tgl span{position:absolute;inset:0;background:var(--bd2);border-radius:20px;transition:.2s}
.ws_tgl span::before{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.ws_tgl input:checked+span{background:#2F6B66}.ws_tgl input:checked+span::before{transform:translateX(14px)}
.ws_act.on{cursor:pointer;color:var(--a);border-color:color-mix(in srgb,var(--a) 45%,transparent);opacity:1}
.ws_act.on:hover{background:color-mix(in srgb,var(--a) 10%,transparent)}
.ws_on{font:600 11px var(--sans);color:#2E7D5B;background:rgba(46,125,91,.12);border-radius:10px;padding:1px 8px}
.ws_actions{display:flex;gap:8px;margin:14px 0 2px;flex-wrap:wrap}
.ws_abtn{font:600 13px var(--sans);border:1px solid var(--bd2);background:var(--s1);color:var(--tx);border-radius:9px;padding:7px 14px;cursor:pointer;transition:border-color .12s,transform .1s}
.ws_abtn:hover{border-color:#2F6B66;transform:translateY(-1px)}
.ws_abtn_undo{color:var(--tx2)}
.ws_org_list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.ws_org_grp{border:1px solid var(--bd2);border-radius:9px;padding:10px 12px}
.ws_org_to{font:600 13px var(--sans);color:#2F6B66;margin-bottom:6px}
.ws_org_f{font:500 12px var(--mono);color:var(--tx2);padding:2px 0}
.ws_toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100000;background:var(--tx);color:var(--paper);font:600 13px var(--sans);padding:10px 18px;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;transition:opacity .25s;max-width:80vw;text-align:center}
.ws_toast.ok{background:#2E7D5B;color:#fff}.ws_toast.err{background:#B23A2E;color:#fff}
/* Курируемый воркспейс — контуры */
.wsc_grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:18px}
.wsc_card{position:relative;background:var(--s1);border:1px solid var(--bd);border-radius:15px;padding:18px 18px 14px;overflow:hidden}
.wsc_bar{position:absolute;left:0;top:0;height:4px;width:100%;background:var(--wa)}
.wsc_nm{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--tx);margin-top:4px}
.wsc_und{font-size:12.5px;color:var(--tx2);line-height:1.45;margin:3px 0 6px}
.wsc_sec{margin-top:11px}
.wsc_lab{font:700 11px var(--mono);letter-spacing:.02em;color:var(--tx3);display:flex;align-items:center;gap:6px}
.wsc_sec.ok .wsc_lab{color:#2E7D5B}.wsc_sec.crit .wsc_lab{color:#B23A2E}.wsc_sec.next .wsc_lab{color:var(--a)}.wsc_sec.wait .wsc_lab{color:var(--tx2)}
.wsc_n{font:700 10px var(--mono);background:var(--bg);border:1px solid var(--bd2);border-radius:9px;padding:0 6px;color:var(--tx3)}
.wsc_list{margin:5px 0 0;padding:0 0 0 4px;list-style:none;display:flex;flex-direction:column;gap:4px}
.wsc_list li{font-size:13px;line-height:1.4;color:var(--tx);padding-left:14px;position:relative}
.wsc_list li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--wa) 65%,transparent)}
.wsc_sec.crit .wsc_list li::before{background:#B23A2E}.wsc_sec.ok .wsc_list li::before{background:#2E7D5B}
.wsc_recent{margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd2);font-size:11.5px;color:var(--tx3);line-height:1.5}
.wsc_rlab{font:700 10px var(--mono);letter-spacing:.02em;color:var(--tx3);margin-right:4px}
.wsc_ref{margin-top:8px;font-size:11px;color:var(--tx3);text-align:right}
.ws_srcs{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.ws_src{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0}
.ws_ext{font:700 10px var(--mono);color:var(--tx3);background:var(--bg);border:1px solid var(--bd2);border-radius:4px;padding:2px 5px;min-width:38px;text-align:center;flex-shrink:0}
.ws_src_n{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws_ver{font:600 10px var(--sans);color:#C0820E;background:rgba(192,130,14,.12);border-radius:10px;padding:1px 7px;flex-shrink:0}
.ws_ledger{display:flex;flex-direction:column;gap:2px}
.ws_lrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--bd2)}
.ws_lrow:first-child{border-top:none}
.ws_ln{font:700 11px var(--mono);color:var(--tx3);min-width:18px}
.ws_lbody{flex:1;min-width:0}
.ws_la{font-weight:600;font-size:13.5px}
.ws_ld{font-size:12px;color:var(--tx2);margin-top:2px}
.ws_sk{background:linear-gradient(90deg,var(--bd2),var(--bd),var(--bd2));background-size:200% 100%;animation:wssh 1.2s infinite;border-radius:6px;height:14px}
.ws_skbox{height:150px;border-radius:14px}
@keyframes wssh{from{background-position:200% 0}to{background-position:-200% 0}}
/* Workspace — «вкусный» список воркспейсов */
.wsl_wrap{grid-column:1/-1;animation:fiu .25s ease}
.wsl_head{margin:2px 0 20px}
.wsl_h1{font-family:var(--serif);font-size:clamp(24px,3.4vw,32px);letter-spacing:-.01em;margin:0 0 6px;color:var(--tx)}
.wsl_intro{font-size:14.5px;color:var(--tx2);max-width:70ch;line-height:1.55;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wsl_grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
.wsl_err{grid-column:1/-1;background:rgba(178,58,46,.08);border:1px solid rgba(178,58,46,.35);color:#B23A2E;border-radius:11px;padding:11px 15px;font-size:13.5px;margin-bottom:14px}
.wsl_card{position:relative;display:flex;flex-direction:column;text-align:left;gap:0;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px 18px 16px;cursor:pointer;overflow:hidden;transition:transform .13s ease,box-shadow .16s ease,border-color .13s ease;font-family:var(--sans)}
.wsl_card:hover{transform:translateY(-3px);border-color:var(--wa);box-shadow:0 14px 34px color-mix(in srgb,var(--wa) 22%,transparent)}
.wsl_head_bar{position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--wa),color-mix(in srgb,var(--wa) 45%,transparent))}
.wsl_row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.wsl_ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--wa) 13%,transparent);border:1px solid color-mix(in srgb,var(--wa) 30%,transparent)}
.wsl_ic .lico{width:21px;height:21px;color:var(--wa);stroke-width:1.7}
.wsl_ago{font-size:11px;color:var(--tx3)}
.wsl_nm{font-family:var(--serif);font-size:18px;line-height:1.25;color:var(--tx);margin:13px 0 3px;font-weight:600}
.wsl_fold{font:500 11.5px var(--mono);color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsl_foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.wsl_st{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--sans)}
.wsl_st.ok{color:#2E7D5B}.wsl_st.crit{color:#B23A2E}
.wsl_dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 16%,transparent)}
.wsl_go{font:600 12.5px var(--sans);color:var(--wa);opacity:0;transform:translateX(-4px);transition:opacity .14s,transform .14s}
.wsl_card:hover .wsl_go{opacity:1;transform:translateX(0)}
.wsl_new{align-items:flex-start;justify-content:center;border-style:dashed;border-color:var(--bd2);background:transparent;gap:6px}
.wsl_new:hover{border-color:#2F6B66;transform:translateY(-3px);box-shadow:0 12px 28px rgba(47,107,102,.16)}
.wsl_new_plus{font-size:26px;font-weight:300;color:#2F6B66;line-height:1}
.wsl_new_t{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--tx);margin-top:6px}
.wsl_new_s{font-size:13px;color:var(--tx2);line-height:1.5}
.wsl_new_m{font:500 11px var(--mono);color:var(--tx3);margin-top:6px}
/* Workspace-раздел на Рабочем столе */
.dt_hero_ws{margin-bottom:12px !important;box-shadow:none !important}
.dt_ws_strip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.dt_ws_card{display:inline-flex;align-items:center;gap:7px;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:8px 13px;font:600 13px var(--sans);color:var(--tx);cursor:pointer;transition:border-color .12s,transform .1s}
.dt_ws_card:hover{border-color:#2F6B66;transform:translateY(-1px)}
.dt_ws_dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dt_ws_dot.crit{background:#B23A2E}.dt_ws_dot.ok{background:#2E7D5B}
.dt_ws_nm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt_ws_add{color:#2F6B66;border-style:dashed}
.dt_ws_more{color:var(--tx3)}
.dt_ws_empty{background:var(--s1);border:1px dashed var(--bd2);border-radius:10px;padding:12px 15px;margin:0 0 22px;font-size:13px;color:var(--tx2);cursor:pointer;line-height:1.5}
.dt_ws_empty:hover{border-color:#2F6B66;color:var(--tx)}
</style>
</head>

// ── Theme ─────────────────────────────────────────────────────────────────
function _resolveHostTheme() {
  var t;
  try { t = localStorage.getItem('color-theme'); } catch (_) {}
  if (t === 'light' || t === 'dark') return t;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  } catch (_) {}
  return 'dark';
}
function ith(forced) {
  var t = forced || _resolveHostTheme();
  if (t === 'light') document.documentElement.setAttribute('data-lm','1');
  else document.documentElement.removeAttribute('data-lm');
}
ith();
window.addEventListener('storage', function(e) {
  if (e.key === 'color-theme' || e.key === 'ext_theme' || e.key === 'eth6') ith();
});
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'etb_theme') ith(e.data.theme);
  // Сессия пользователя от тулбара: токен + личный агент. Храним и раздаём
  // окнам плагинов (они ходят в API сами). Дошлём и уже открытым окнам.
  if (e.data && e.data.type === 'etb_session') {
    window._etbSess = { token: e.data.token || '', agentId: e.data.agentId || '' };
    try {
      Object.keys(window._pwins || {}).forEach(function (pid) {
        var w = window._pwins[pid]; var fr = w && w.querySelector && w.querySelector('.pwin_if');
        if (fr && fr.contentWindow) fr.contentWindow.postMessage(
          { type: 'etb_session', token: window._etbSess.token, agentId: window._etbSess.agentId }, '*');
      });
    } catch (_) {}
  }
});

// ── Cache helpers ─────────────────────────────────────────────────────────
function mkCacheKey(s) {
  return [
    s.query  || '_',
    s.topic  ? 't:'+s.topic    : '',
    s.language ? 'l:'+s.language : '',
    'st:'+s.minStars,
    s.updatedAfter ? 'u:'+s.updatedAfter : '',
    s.license ? 'li:'+s.license : '',
    'so:'+s.sort,
    'p:'+s.page
  ].filter(Boolean).join('|');
}

function getCached(key) {
  try {
    var store = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    var entry = store[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > CACHE_TTL) {
      delete store[key];
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(store)); } catch(_) {}
      return null;
    }
    return entry;
  } catch(_) { return null; }
}

function setCached(key, results, total) {
  try {
    var store = {};
    try { store = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(_) {}
    store[key] = { ts: Date.now(), results: results, total: total };
    var keys = Object.keys(store);
    if (keys.length > CACHE_MAX) {
      keys.sort(function(a,b){ return (store[a].ts||0) - (store[b].ts||0); });
      keys.slice(0, keys.length - (CACHE_MAX - 10)).forEach(function(k){ delete store[k]; });
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(store));
  } catch(_) {}
}

// ── HF cache helpers ──────────────────────────────────────────────────────
function mkHFCacheKey(s) {
  return [
    s.kind || 'space',
    s.query || '_',
    's:' + s.sort,
    s.sdk ? 'sdk:' + s.sdk : '',
    s.pipeline ? 'pip:' + s.pipeline : '',
    'p:' + s.page
  ].filter(Boolean).join('|');
}

function getHFCached(key) {
  try {
    var store = JSON.parse(localStorage.getItem(HF_CACHE_KEY) || '{}');
    var entry = store[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > CACHE_TTL) {
      delete store[key];
      try { localStorage.setItem(HF_CACHE_KEY, JSON.stringify(store)); } catch(_) {}
      return null;
    }
    return entry;
  } catch(_) { return null; }
}

function setHFCached(key, results, total) {
  try {
    var store = {};
    try { store = JSON.parse(localStorage.getItem(HF_CACHE_KEY) || '{}'); } catch(_) {}
    store[key] = { ts: Date.now(), results: results, total: total };
    var keys = Object.keys(store);
    if (keys.length > CACHE_MAX) {
      keys.sort(function(a,b){ return (store[a].ts||0) - (store[b].ts||0); });
      keys.slice(0, keys.length - (CACHE_MAX - 10)).forEach(function(k){ delete store[k]; });
    }
    localStorage.setItem(HF_CACHE_KEY, JSON.stringify(store));
  } catch(_) {}
}

// ── Date helpers ──────────────────────────────────────────────────────────
function updAfterFromKey(key) {
  if (!key) return '';
  var d = new Date();
  switch(key) {
    case '1mo':  d.setMonth(d.getMonth()-1);          break;
    case '3mo':  d.setMonth(d.getMonth()-3);          break;
    case '6mo':  d.setMonth(d.getMonth()-6);          break;
    case '1yr':  d.setFullYear(d.getFullYear()-1);    break;
    default:     return '';
  }
  return d.toISOString().slice(0,10);
}

function timeSince(ds) {
  try {
    var d = Math.floor((Date.now() - new Date(ds).getTime()) / 86400000);
    if (d < 1)   return 'today';
    if (d < 7)   return d+'d ago';
    if (d < 30)  return Math.floor(d/7)+'w ago';
    if (d < 365) return Math.floor(d/30)+'mo ago';
    return Math.floor(d/365)+'yr ago';
  } catch(_) { return ''; }
}

function fmtN(n) {
  n = n || 0;
  if (n >= 1000) return (n/1000).toFixed(1).replace('.0','')+'k';
  return String(n);
}

// ── GitHub search ─────────────────────────────────────────────────────────
function buildGHQuery(s) {
  var p = [];
  if (s.query) p.push(s.query);
  // Hard quality filters (always applied)
  p.push('archived:false');
  p.push('is:public');
  // User-configurable filters (with hard minimums)
  p.push('stars:>=' + (parseInt(s.minStars) || 10));
  p.push('pushed:>' + (s.updatedAfter || '2022-01-01'));
  if (s.language) p.push('language:' + s.language);
  if (s.topic)    p.push('topic:' + s.topic);
  if (s.license)  p.push('license:' + s.license);
  return p.join(' ');
}

function cancelDebounce() {
  if (ghState.debTimer) { clearTimeout(ghState.debTimer); ghState.debTimer = null; }
}

function doSearch() {
  ghState.query        = (document.getElementById('gh_q')       || {}).value || '';
  ghState.sort         = (document.getElementById('gh_sort')    || {}).value || 'stars';
  ghState.language     = (document.getElementById('gh_lang')    || {}).value || '';
  ghState.minStars     = (document.getElementById('gh_stars')   || {}).value || '100';
  ghState.license      = (document.getElementById('gh_license') || {}).value || '';
  var updKey           = (document.getElementById('gh_updated') || {}).value || '';
  ghState.updatedAfter = updAfterFromKey(updKey);
  // Skip API call if user typed only 1 character, too few to be useful and
  // the immediate re-render causes focus loss before they finish typing.
  if (ghState.query.length === 1) return;
  searchGitHub(false);
}

function onFChange(immediate) {
  cancelDebounce();
  ghState.debTimer = setTimeout(doSearch, immediate ? 0 : 800);
}

function searchGitHub(loadMore) {
  if (ghState.loading) return;
  cancelDebounce();

  if (!loadMore) {
    ghState.page    = 1;
    ghState.results = [];
    ghState.total   = 0;
    ghState.error   = null;
  }

  // Wrap renderGrid() so that #gh_q retains focus and cursor position after
  // each DOM rebuild. _rescueFilterBar + syncFilterBar move the filter_bar
  // element in the DOM which causes browsers to drop focus; we restore it here.
  function _renderKeepFocus() {
    var inp = document.getElementById('gh_q');
    var hadFocus = inp && document.activeElement === inp;
    var sel0 = hadFocus ? inp.selectionStart : null;
    var sel1 = hadFocus ? inp.selectionEnd   : null;
    renderGrid();
    if (hadFocus) {
      inp = document.getElementById('gh_q');
      if (inp) {
        inp.focus();
        if (sel0 !== null) { try { inp.setSelectionRange(sel0, sel1); } catch(_) {} }
      }
    }
  }

  var ckey   = mkCacheKey(ghState);
  var cached = getCached(ckey);
  if (cached) {
    if (loadMore) {
      ghState.results = ghState.results.concat(cached.results);
    } else {
      ghState.results = cached.results;
      ghState.total   = cached.total || 0;
    }
    _renderKeepFocus();
    return;
  }

  ghState.loading = true;
  _renderKeepFocus(); // show skeletons

  var q    = buildGHQuery(ghState);
  var url  = GH_API + '?q=' + encodeURIComponent(q) +
             '&sort=' + ghState.sort + '&order=desc&per_page=30&page=' + ghState.page;
  var hdrs = { 'Accept': 'application/vnd.github.v3+json' };
  try {
    var tok = localStorage.getItem('etb_github_token');
    if (tok) hdrs['Authorization'] = 'token ' + tok;
  } catch(_) {}

  fetch(url, { headers: hdrs })
    .then(function(r) {
      if (r.status === 403 || r.status === 429) {
        ghState.error = 'rate_limit';
        return null;
      }
      if (!r.ok) { ghState.error = 'network'; return null; }
      return r.json();
    })
    .then(function(data) {
      ghState.loading = false;
      if (!data) { _renderKeepFocus(); return; }
      var items = data.items || [];
      setCached(ckey, items, data.total_count || 0);
      if (loadMore) {
        ghState.results = ghState.results.concat(items);
      } else {
        ghState.results = items;
        ghState.total   = data.total_count || 0;
      }
      _renderKeepFocus();
    })
    .catch(function() {
      ghState.loading = false;
      ghState.error   = 'network';
      _renderKeepFocus();
    });
}

// ── Topic chips ───────────────────────────────────────────────────────────
function renderTopics() {
  var el = document.getElementById('fb_topics');
  if (!el) return;

    return '<button class="tpchip' + (ghState.topic === t.id ? ' on' : '') +
      '" onclick="selTopic(\'' + t.id + '\')">' + esc(t.l) + '</button>';
  }).join('');
}

function selTopic(id) {

var _pwz=40,_pwn=0,_pwins={};

  win.querySelector('.pwin_ic').textContent=icon;
  win.querySelector('.pwin_ttl').textContent=name;
  var _ifr=win.querySelector('.pwin_if');
  var _html=chat?_PLUGIN_CHAT_HTML:_PLUGIN_FORM_HTML;

    var _url=URL.createObjectURL(new Blob([_html],{type:'text/html'}));

function _pwFocus(w){w.style.zIndex=(++_pwz);}

// действия из окна плагина пробрасываем в десктоп (реальный запуск эксперта)
window.addEventListener('message',function(e){
  var d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='etb_plugin_action'&&d.action==='close'){var w=_pwins[d.pluginId];if(w){_pwClose(w);return;}}
  // Окно плагина приложило документ (base64): извлекаем текст на устройстве → назад в окно.
  if(d.type==='etb_extract_b64'){ _pluginExtractDoc(e.source, d.b64, d.name); return; }
  if(d.type==='etb_plugin_action'||d.type==='etb_run'||d.type==='etb_expert_run'||d.type==='etb_agent_bad'){try{if(window.parent!==window)window.parent.postMessage(d,'*');}catch(_){}}
});
function _pluginExtractDoc(srcWin, b64, name){
  function reply(o){ try{ srcWin.postMessage(Object.assign({type:'etb_doc_text'},o), '*'); }catch(_){} }
  function unwrap(r){ var o=(r&&r.res!==undefined)?r.res:r; if(o&&typeof o==='object'&&(o.result||o.output))o=o.result||o.output; if(typeof o==='string'){try{o=JSON.parse(o);}catch(_){}} return o; }
  skBridge('etb_run_expert','etb_expert_result',{name:'wz_extract_doc_b64',params:{b64:b64||'',name:name||'doc'}},180000).then(function(r){
    var x=unwrap(r);
    if(x&&x.status==='success') reply({text:x.text||'', name:x.name||name||''});
    else reply({error:(x&&x.message)||'не удалось прочитать документ'});
  }).catch(function(err){ reply({error:String((err&&err.message)||err)}); });
}
function notify(action, pluginId, url) {
  if(action==='open'&&pluginId){
    var _bp=null,_i;for(_i=0;_i<BUILTIN_PLUGINS_DATA.length;_i++){if(BUILTIN_PLUGINS_DATA[_i].id===pluginId){_bp=BUILTIN_PLUGINS_DATA[_i];break;}}
    // окно рисуем только для встроенных form/llm инструментов; внешние приложения/серверы/агенты (n8n, hermes, agent-course) отдаём опенеру десктопа
    if(_bp&&(_bp.mode==='form_driven'||_bp.mode==='llm_driven')){openPluginWindow(pluginId);return;}
  }
  try {
    window.parent.postMessage({
      type: 'etb_plugin_action',
      action: action,
      pluginId: pluginId || '',
      url: url || ''
    }, '*');
  } catch(_) {}
}

// ── Category helpers (shared by Featured + Installed) ─────────────────────
// Map a plugin onto a business aisle. Keyword-first (name/tagline/description/
// pills/category), then a fallback from the old tech category. Fuzzy on purpose
//, the goal is a shop a non-technical buyer can browse, not perfect taxonomy.
function normalizeCategory(p) {
  var hay = ((p.name || '') + ' ' + (p.tagline || '') + ' ' + (p.description || '') +
    ' ' + ((p.pills || []).join(' ')) + ' ' + (p.category || '')).toLowerCase();
  if (/\bpdf\b|docx|\bdoc\b|word|excel|xlsx|\bocr\b|\bfile\b|документ|скан|расшифров|транскрип/.test(hay)) return 'docs';
  if (/\bcrm\b|sales|lead|proposal|invoice|\bclient|customer|продаж|клиент|счёт-фактур|коммерческ|заявк/.test(hay)) return 'sales';
  if (/chart|\bdata\b|analytic|report|dashboard|\btable\b|график|отчёт|данн|аналит|метрик|калькул|расчёт/.test(hay)) return 'data';
  if (/writ|content|blog|social|\bpost\b|caption|\bseo\b|design|\bimage\b|контент|текст|соцсет|дизайн|перевод|письм|рассылк/.test(hay)) return 'content';
  if (/\bapi\b|webhook|automat|workflow|script|integrat|\bcli\b|devops|автоматиз|интеграц|скрипт|пайплайн/.test(hay)) return 'automation';
  var t = (p.category || 'other');
  if (t === 'utilities' || t === 'developer' || t === 'web') return 'automation';
  if (t === 'data' || t === 'calculators') return 'data';
  if (t === 'text' || t === 'ai-life' || t === 'ai-work') return 'content';
  return 'automation';
}

function buildCatCounts(plugins) {
  var counts = {};
  plugins.forEach(function(p) {
    var c = normalizeCategory(p);
    counts[c] = (counts[c] || 0) + 1;
  });
  return counts;
}

function buildCatTabs(countsMap, activeCat, setterName) {
  return '<div class="cat_tabs">' +
    CAT_TABS.filter(function(ct) {
      return ct.id === 'all' || countsMap[ct.id];
    }).map(function(ct) {
      return '<button class="cat_tab' + (activeCat === ct.id ? ' active' : '') +
        '" onclick="' + setterName + '(\'' + ct.id + '\')">' + esc(ct.l) + '</button>';
    }).join('') +
  '</div>';
}

function filterByCategory(plugins, catId) {
  if (catId === 'all') return plugins;
  return plugins.filter(function(p) { return normalizeCategory(p) === catId; });
}

function _rescueFilterBar() {
  var fb = document.getElementById('filter_bar');

}

function syncFilterBar() {
  var fb = document.getElementById('filter_bar');
  var stash = document.getElementById('filter_stash');
  var slot = document.getElementById('other_filter_slot');
  if (!fb || !stash) return;
  var show = cur === 'programs' && !_otherCollapsed;

    fb.style.display = '';

  }
}

function _trStr(s){
  var k=String(s).trim(); if(!k) return s;
  if(I18N_EN[k]) return s.replace(k, I18N_EN[k]);
  for(var i=0;i<I18N_RX.length;i++){ if(I18N_RX[i][0].test(k)) return s.replace(I18N_RX[i][0], I18N_RX[i][1]); }
  return s;
}
function _walkTranslate(root){
  if(LANG!=='en'||!root) return;
  try{
    var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), nodes=[], n;
    while(n=w.nextNode()) nodes.push(n);
    nodes.forEach(function(t){ var v=t.nodeValue; if(v&&v.trim()){ var nv=_trStr(v); if(nv!==v) t.nodeValue=nv; } });
    ['placeholder','title'].forEach(function(a){
      [].forEach.call(root.querySelectorAll('['+a+']'),function(el){ var val=el.getAttribute(a); var nv=_trStr(val); if(nv!==val) el.setAttribute(a,nv); });
    });
  }catch(_){}
}

    if(btn)btn.disabled=false;

// Catalogue, grouped by business aisle into coloured sections (same schema as
// Навыки). No filter chips: the aisles ARE the sections you scroll.
function renderFeaturedSection() {
  var featured = getFeatured();
  var promos = (window._merch && window._merch.promos) || [];
  if (promos.length) {
    featured = featured.slice().sort(function (a, b) {
      return (promos.indexOf(b.id) >= 0 ? 1 : 0) - (promos.indexOf(a.id) >= 0 ? 1 : 0);
    });
  }
  var _pro = document.body.getAttribute('data-mode') === 'pro';
  var html = '<div class="sect"><h2>' + (_pro ? 'Все программы' : 'Каталог') + '</h2></div>';

  if (featuredError) html += '<div class="banner err">⚠ Установка не удалась: ' + esc(featuredError) + '</div>';
  if (!featured.length) {
    var _q = (_featSearch || '').trim();
    html += '<div class="empty" style="grid-column:1/-1;padding:26px 20px;text-align:center">' +
      '<p style="margin:0 0 4px;font-weight:600">' + (_q ? 'Такого в каталоге пока нет' : 'В этой полке пока пусто') + '</p>' +
      '<p style="margin:0 0 14px;color:var(--tx2);font-size:13px">Опиши задачу, Строитель найдёт подходящее и добавит.</p>' +
      '<button class="st_btn" data-q="' + esc(_q) + '" onclick="etbFindInstall(this)">Найти и установить</button>' +
    '</div>';
    return html;
  }
  // В «Профи» на общем виде («Все») режем каждую полку до CAP карточек и
  // добавляем плитку «Показать все N →» — иначе 5 категорий по ~20 карточек
  // сливаются в бесконечную прокрутку. Внутри категории показываем всё.
  var _proAll = _pro && _featCat === 'all';
  var CAP = 8;
  (_pro ? BIZ_ORDER : BIZ_ORDER_ALL).forEach(function (cat) {
    var items = featured.filter(function (p) { return catOf(p) === cat; });
    if (!items.length) return;
    var total = items.length;
    var shown = _proAll && total > CAP ? items.slice(0, CAP) : items;
    var hdr = _pro
      ? '<div class="sect_hdr"><button class="sect_jump" onclick="_setFeatCat(\'' + cat + '\')"><span class="ci">' + _ico(cat) + '</span>' + esc(BIZ_LABEL[cat]) + ' <span class="cat_n">' + total + '</span></button><span class="sect_line"></span></div>'
      : '<div class="sect_hdr"><span class="sect_title">' + esc(BIZ_LABEL[cat]) + '</span><span class="sect_line"></span></div>';
    var seeAll = (_proAll && total > CAP)
      ? '<div class="seeall" onclick="_setFeatCat(\'' + cat + '\')">Показать все<br><b>' + total + '</b> в категории →</div>'
      : '';
    html += hdr + '<div class="mshelf">' + shown.map(programCard).join('') + seeAll + '</div>';
  });
  return html;
}

// One install button for any editorial card, routes by kind: skill → agent
// picker, HF model → HF installer, else a repo URL.
function _cardBtn(h, cls) {
  cls = cls || 'cbtn';
  if (h.skillId) return '<button class="' + cls + '" onclick="openSkPick(\'' + esc(h.skillId) + '\')">Установить</button>';
  if (h.hfId)    return '<button class="' + cls + '" onclick="installHF(\'' + esc(h.hfId) + '\',\'space\',this)">Установить</button>';
  if (h.repoUrl) return '<button class="' + cls + '" onclick="installRepo(\'' + esc(h.repoUrl) + '\',this)">Установить</button>';
  if (h.cliTool) return '<button class="' + cls + '" onclick="installCLI(\'' + esc(h.cliTool) + '\',this)">Установить</button>';
  if (h.pluginId) {
    var _in = gi().indexOf(h.pluginId) !== -1;
    return _in
      ? '<button class="' + cls + '" onclick="notify(\'open\',\'' + esc(h.pluginId) + '\')">Открыть</button>'
      : '<button class="' + cls + '" onclick="installFeatured(\'' + esc(h.pluginId) + '\',this)">Установить</button>';
  }
  if (h.soon)    return '<button class="' + cls + '" disabled style="opacity:.5;cursor:default">Скоро</button>';
  return '';
}

// ── Универсальный поиск + чипы-категории (единый для всех каталожных вкладок) ──
// Тот же визуал, что на «Программах» (классы .fb_srch и .catbar/.cat_chip со счётчиком),
// но поверх уже отрисованных полок (.mshelf с заголовком .sect/.sect_hdr) — не требует
// переписывать данные вкладок. Фильтрует плитки по тексту и категории.
function _tfShelfHead(shelf){
  var p=shelf.previousElementSibling;
  if(p&&(p.classList.contains('sect')||p.classList.contains('sect_hdr'))) return p;
  return null;
}
function _tfShelfCat(shelf){
  var h=_tfShelfHead(shelf); if(!h) return '';
  var t=h.querySelector('.sect_title')||h.querySelector('h2');
  return t?t.textContent.trim():'';
}
function _mountTabFilter(placeholder){
  var g=document.getElementById('grid'); if(!g) return;
  var shelves=[].slice.call(g.querySelectorAll('.mshelf'));
  if(shelves.length<2) return;  // нечего фильтровать
  var cats=[], cnt={}, total=0;
  shelves.forEach(function(s){
    var c=_tfShelfCat(s); if(!c) return;
    var n=s.querySelectorAll('.stile').length;
    if(cats.indexOf(c)<0){ cats.push(c); cnt[c]=0; }
    cnt[c]+=n; total+=n;
  });
  if(cats.length<2) return;
  var bar=document.createElement('div'); bar.className='tabfilter'; bar.style.gridColumn='1/-1';
  var search='<div style="grid-column:1/-1;padding:2px 0 10px"><div class="fb_srch" style="max-width:440px">'+
    '<input class="fb_sinp tf_inp" placeholder="'+esc(placeholder||'Поиск…')+'" autocomplete="off" oninput="_tabFilterApply()">'+
    '<span class="fb_sico">&#128269;</span></div></div>';
  var chips='<div class="catbar"><button class="cat_chip on" data-cat="__all" onclick="_tabFilterCat(this)">Все <span class="cat_n">'+total+'</span></button>'+
    cats.map(function(c){ return '<button class="cat_chip" data-cat="'+esc(c)+'" onclick="_tabFilterCat(this)">'+esc(c)+' <span class="cat_n">'+(cnt[c]||0)+'</span></button>'; }).join('')+'</div>';
  bar.innerHTML=search+chips;
  var anchor=g.querySelector('.sect, .sect_hdr');
  if(anchor) g.insertBefore(bar, anchor); else g.appendChild(bar);
}
function _tabFilterCat(btn){
  var bar=btn.closest('.tabfilter'); if(!bar) return;
  [].forEach.call(bar.querySelectorAll('.cat_chip'),function(b){ b.classList.toggle('on', b===btn); });
  _tabFilterApply();
}
function _tabFilterApply(){
  var g=document.getElementById('grid'); if(!g) return;
  var bar=g.querySelector('.tabfilter'); if(!bar) return;
  var inp=bar.querySelector('.tf_inp'); var q=(inp&&inp.value||'').trim().toLowerCase();
  var chip=bar.querySelector('.cat_chip.on'); var cat=chip?chip.getAttribute('data-cat'):'__all';
  [].slice.call(g.querySelectorAll('.mshelf')).forEach(function(shelf){
    var scat=_tfShelfCat(shelf);
    var catOk=(cat==='__all'||cat===scat);
    var anyVisible=false;
    [].forEach.call(shelf.querySelectorAll('.stile'),function(t){
      var show=catOk && (!q || t.textContent.toLowerCase().indexOf(q)>=0);
      t.style.display=show?'':'none'; if(show)anyVisible=true;
    });
    shelf.style.display=(catOk&&anyVisible)?'':'none';
    var head=_tfShelfHead(shelf); if(head) head.style.display=(catOk&&anyVisible)?'':'none';
  });
}

// Категоризированный каталог по секциям (как Навыки): группирует карточки функцией
// catFn в разделы order/labels, рисует полностью. chip, единая подпись карточек.
function catalogByCatHTML(cards, catFn, order, labels, acc, eyebrow, title, lead, chip) {
  if (!cards || !cards.length) return '';
  var groups = {};
  cards.forEach(function (c) { var k = catFn(c); (groups[k] = groups[k] || []).push(c); });
  var html = '<div class="sect"><h2>' + title + '</h2></div>';
  if (lead) html += '<div class="sk_lead" style="grid-column:1/-1">' + lead + '</div>';
  order.forEach(function (k) {
    var items = groups[k]; if (!items || !items.length) return;
    var tiles = items.map(function (c, i) { return _tileHTML(Object.assign({}, c, { acc: acc[k] || c.acc }), i, chip); }).join('');
    html += '<div class="sect_hdr"><span class="sect_title">' + esc(labels[k]) + '</span><span class="sect_line"></span></div>' +
      '<div class="mshelf">' + tiles + '</div>';
  });
  return html;
}
function _shelfHTML(shelf, eyebrow, title) {
  if (!shelf || !shelf.length) return '';
  var CAPV = 48;
  var capped = shelf.length > CAPV;
  var sid = 'sh_' + Math.random().toString(36).slice(2, 8);
  var tiles = shelf.map(function (h, i) { return _tileHTML(h, i); }).join('');
  var more = capped ? '<div class="showmore" style="grid-column:1/-1;text-align:center;margin:8px 0 4px">' +
      '<button onclick="var e=document.getElementById(\'' + sid + '\');if(e)e.classList.remove(\'mshelf_capped\');this.parentNode.style.display=\'none\'" ' +
      'style="border:1px solid var(--bd2);background:transparent;color:var(--tx2);border-radius:5px;padding:6px 18px;font-size:12px;cursor:pointer">Показать все ' + shelf.length + ' →</button></div>' : '';
  return '<div class="sect"><h2>' + title + '</h2></div>' +
    '<div class="mshelf' + (capped ? ' mshelf_capped' : '') + '" id="' + sid + '">' + tiles + '</div>' + more;
}
function renderTypeEd(type) {

  if(/браузер|browser|скрейп|scrap|crawl|chrome|сайт|html|парс/.test(s))return 'web';

  if(/поиск|search|документаци|знан|rag|память|memory|контекст|context|индекс|embedding|wiki/.test(s))return 'search';
  if(/чат|chat|сообщ|slack|discord|telegram|whatsapp|почт|mail|email|календар|calendar|голос|voice|звонк|созвон/.test(s))return 'comm';

// Раздел «Программы» = живой каталог с GitHub + встроенная секция «Приложения» (Pinokio-репо).
function renderPrograms(){ _renderProgramsCore(); _svcPrependBar(); }
function _renderProgramsCore() {
  // Always rescue filter_bar before any g.innerHTML wipe. The element lives
  // inside #grid when Other is expanded; innerHTML replacement destroys it.
  _rescueFilterBar();

  var g = document.getElementById('grid');
  if (!g) return;

  var _bk = _featCat === 'all' ? '' : '<div class="cat_back"><button class="cb_btn" onclick="_setFeatCat(\'all\')">← Все категории</button></div>';
  var _isPro = document.body.getAttribute('data-mode') === 'pro';
  var featuredHtml = _progSearchHTML() + _featCatBar() + _bk + ((_featCat === 'all' && !_isPro) ? programsSpotlight() + addTileHTML('programs','Добавить программу') : '') + renderFeaturedSection() + (_featCat === 'all' ? _appsSectionHTML() : '') + (_featCat !== 'all' ? addTileHTML('programs','Добавить программу') : (_isPro ? '' : progToolsHTML()));

  // «Для всех», curated only: no raw GitHub firehose.
  if (document.body.getAttribute('data-mode') !== 'pro') {
    g.innerHTML = featuredHtml;
    syncFilterBar();
    return;
  }

  var arrow = _otherCollapsed ? '▶' : '▼';
  var otherHdr = '<div class="sect_hdr">' +
    '<span class="sect_title">Сырые результаты GitHub</span>' +
    '<button class="sect_toggle" onclick="_toggleOther()" title="' + (_otherCollapsed ? 'Развернуть' : 'Свернуть') + ' результаты GitHub">' +
      arrow +
    '</button>' +
    '<span class="sect_line"></span></div>';

  if (_otherCollapsed) {
    g.innerHTML = featuredHtml + otherHdr;
    syncFilterBar();
    return;
  }

  var filterSlot = '<div id="other_filter_slot" class="other_filters"></div>';

  if (ghState.loading) {
    var sk = '';
    for (var i = 0; i < 6; i++) sk += '<div class="skel"></div>';
    g.innerHTML = featuredHtml + otherHdr + filterSlot + sk;
    syncFilterBar();
    return;
  }

  if (ghState.error) {
    var msg = ghState.error === 'rate_limit'
      ? '⏱ GitHub просит паузу: лимит запросов. Подожди минуту и попробуй снова.'
      : '⚡ GitHub недоступен. Проверь соединение и попробуй снова.';
    g.innerHTML = featuredHtml + otherHdr + filterSlot +
      '<div class="banner ' + (ghState.error === 'rate_limit' ? 'warn' : 'err') + '">' +
      esc(msg) + '</div>';
    syncFilterBar();
    return;
  }

  if (!ghState.results.length) {
    g.innerHTML = featuredHtml + otherHdr + filterSlot +
      _emptyHTML('🔍', 'Ничего не нашлось.<br>Попробуй другие слова или фильтры.');
    syncFilterBar();
    return;
  }

  var inst      = gi();
  var customMap = getCustom().reduce(function(m, p) {
    if (p.source) m[p.source] = true;
    return m;
  }, {});

  var html = featuredHtml + otherHdr + filterSlot;
  if (ghState.total > 0) {
    html += '<div class="total_hint">' + fmtN(ghState.total) + ' repositories found</div>';
  }

  ghState.results.forEach(function(r, i) {
    var isInst  = !!(customMap[r.html_url] || inst.indexOf('gh_' + r.full_name.replace('/', '_')) !== -1);
    var topics  = (r.topics || []).slice(0, 3);
    var pills   = topics.map(function(t){ return '<span class="rc_pill">' + esc(t) + '</span>'; }).join('');
    var lang    = r.language ? '<span class="rc_info">' + esc(r.language) + '</span>' : '';
    var lic     = r.license && r.license.spdx_id && r.license.spdx_id !== 'NOASSERTION'
      ? '<span class="rc_info">' + esc(r.license.spdx_id) + '</span>' : '';
    var upd     = r.pushed_at ? '<span class="rc_info">' + timeSince(r.pushed_at) + '</span>' : '';
    var dotSep  = pills ? '<span class="rc_dot">·</span>' : '';
    var metaFull = [lang, lic, upd].filter(Boolean).join('<span class="rc_dot">·</span>');

    var btn = isInst
      ? '<button class="rc_btn done" disabled>✓ Installed</button>'
      : '<button class="rc_btn" onclick="installRepo(\'' + esc(r.html_url) + '\',this)">+ Install</button>';

    var acc = accFor(r.full_name, r.language);
    var av = (r.owner && r.owner.avatar_url) ? r.owner.avatar_url + '&s=96' : '';
    html += '<div class="rcard' + (isInst ? ' inst' : '') +
      '" style="--acc:' + acc + ';animation-delay:' + Math.min(i * 12, 180) + 'ms">' +
      rcCover({ badge: 'Plugin', avatar: av, org: r.full_name.split('/')[0], name: r.name }) +
      (r.description ? '<div class="rc_desc">' + esc(r.description) + '</div>' : '') +
      '<div class="rc_meta"><span class="rc_stars">★ ' + fmtN(r.stargazers_count) + '</span>' +
        ((pills || metaFull) ? dotSep : '') + pills + (pills && metaFull ? dotSep : '') + metaFull + '</div>' +
      '<div class="rc_foot">' + btn + '</div>' +
    '</div>';
  });

  if (ghState.results.length > 0 && ghState.results.length < ghState.total) {
    html += '<div class="load_more"><button class="load_more_btn" onclick="loadMore()">Load more</button></div>';
  }

  g.innerHTML = html;
  syncFilterBar();
}

  var isLink = /^https?:\/\//i.test(v) || /^[\w.-]+\.[a-z]{2,}\//i.test(v) || v.indexOf('github.com') >= 0 || v.indexOf('huggingface.co') >= 0;
  if (isLink) { notify('github_add_url', '', v); if (inp) inp.value = ''; return; }
  _gsearch(v);   // текст (не ссылка) → сквозной поиск по всем каталогам

// Сквозной поиск по всем каталогам (bundled: сервисы/CLI/навыки/модели; KV: программы/приложения/MCP).
function _gsearch(query){
  var q=(query||'').toLowerCase().trim(); if(!q)return;
  // подтянуть KV-каталоги, если ещё не загружены (результат улучшится при повторе)
  if(!_appReg)_ensureApps();
  if(!_progReg&&!_progFetched){_progFetched=true;_loadSharded('_mkt_programs').then(function(r){if(r&&r.shelf){_progReg=r;}}).catch(function(){});}
  if(!_mcpReg){try{_loadSharded('_mkt_mcp','items').then(function(r){_mcpReg=r;}).catch(function(){});}catch(e){}}
  var res=[];
  function add(items,type,tab,gn,gd,gc){ (items||[]).forEach(function(it){ var nm=(gn(it)||''); var ds=(gd(it)||''); if((nm+' '+ds).toLowerCase().indexOf(q)>=0) res.push({nm:nm,ds:ds,type:type,tab:tab,cat:gc?(gc(it)||''):''}); }); }
  add(typeof CATALOG_SERVICES!=='undefined'?CATALOG_SERVICES:[],'Сервис','services',function(x){return x.name;},function(x){return x.desc;},function(x){return x.cat;});
  add(typeof cliCatalog==='function'?cliCatalog():[],'Инструмент','cli',function(x){return x.name;},function(x){return x.howto||x.desc;},function(x){return x.cat;});
  add(typeof skCatalog==='function'?skCatalog():[],'Навык','skills',function(x){return x.name;},function(x){return x.desc||x.rule;},function(x){return x.cat;});
  add(typeof LOCAL_MODELS!=='undefined'?LOCAL_MODELS:[],'Модель','models',function(x){return x.name||x.model;},function(x){return x.desc||x.tagline;},function(x){return x.cat;});
  add(_progReg&&_progReg.shelf,'Программа','programs',function(x){return x.title;},function(x){return (x.facts||[]).join(' ')||x.tagline;},function(x){return x.label;});
  add(_appReg&&_appReg.shelf,'Приложение','programs',function(x){return x.title||x.id;},function(x){return x.desc;},function(x){return x.cat;});
  add(_mcpReg&&(_mcpReg.items||_mcpReg.shelf),'MCP','services',function(x){return (x.id||'').split('/').pop();},function(x){return x.desc||x.tagline;},function(x){return x.cat;});
  var g=document.getElementById('grid'); if(!g)return;
  var html='<div class="sect"><h2>Поиск: «'+esc(query)+'»</h2></div>'+
    '<div class="sk_lead" style="grid-column:1/-1">Найдено: '+res.length+' по всем каталогам · <a href="#" onclick="setc(\'desktop\');return false" style="color:var(--a)">← закрыть</a></div>';
  if(res.length){
    html+='<div class="mshelf">'+res.slice(0,80).map(function(r){
      return '<div class="stile" style="--acc:var(--a)"><span class="st_chip">'+esc(r.type)+(r.cat?' · '+esc(r.cat):'')+'</span>'+
        '<div class="st_title">'+esc(r.nm)+'</div><div class="st_fact">'+esc((r.ds||'').slice(0,90))+'</div>'+
        '<div class="st_foot"><button class="st_btn" onclick="setc(\''+r.tab+'\')">Открыть в разделе →</button></div></div>';
    }).join('')+'</div>';
  } else html+='<div class="sk_lead" style="grid-column:1/-1">Ничего не нашлось. Попробуй другое слово, или вставь ссылку (GitHub/Hugging Face) — установим напрямую.</div>';
  g.innerHTML=html;
}
