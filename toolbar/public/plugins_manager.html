    ov.innerHTML='<div style="background:var(--s1);color:var(--tx);max-width:520px;width:100%;border:1px solid var(--bd);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);font-family:var(--sans)">'+
      '<div style="font-family:var(--serif);font-size:20px;margin-bottom:4px">Добавить инструмент</div>'+
      '<div style="color:var(--tx2);font-size:13px;line-height:1.5;margin-bottom:14px">Опиши, что нужно уметь — Строитель подберёт открытый инструмент, установит его и добавит в магазин. Проприетарные программы (Excel, Photoshop) не поддерживаются.</div>'+
      '<textarea id="cliadd_txt" rows="3" placeholder="напр.: конвертировать электронные книги в PDF · убрать фон с фото · сжать видео" style="width:100%;box-sizing:border-box;border:1px solid var(--bd2);border-radius:10px;padding:10px;font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--tx);resize:vertical"></textarea>'+
      '<div id="cliadd_msg" style="font-size:13px;color:var(--tx2);line-height:1.5;margin-top:10px;min-height:18px"></div>'+
      '<div id="cliadd_foot" style="display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px">'+
        '<button onclick="closeCliAdd()" style="border:1px solid var(--bd2);background:transparent;color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:var(--sans)">Закрыть</button>'+
        '<button id="cliadd_go" onclick="submitCliAdd()" style="border:0;background:var(--a);color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600;font-family:var(--sans)">Передать Строителю</button>'+
      '</div></div>';
    ov.onclick=function(e){if(e.target===ov)closeCliAdd();};
    document.body.appendChild(ov);
  }
  ov.style.display='flex';
  var m=document.getElementById('cliadd_msg'); if(m)m.textContent='';
  var rb=document.getElementById('cliadd_refresh'); if(rb)rb.remove();
  var go=document.getElementById('cliadd_go'); if(go){go.disabled=false;go.textContent='Передать Строителю';}
  var t=document.getElementById('cliadd_txt'); if(t){t.value='';t.focus();}
}
function closeCliAdd(){var ov=document.getElementById('cliadd_ov');if(ov)ov.style.display='none';}
function submitCliAdd(){
  var t=document.getElementById('cliadd_txt'), m=document.getElementById('cliadd_msg'), b=document.getElementById('cliadd_go');
  var v=((t&&t.value)||'').trim();
  if(!v){if(m)m.textContent='Опиши инструмент в двух словах.';return;}
  b.disabled=true; b.textContent='Передаю…';
  var prompt='Пользователь просит добавить CLI-инструмент в магазин Extella: «'+v+'». '+
    'Возьми книгу рецептов из KV cap_recipes (kv_get) как образцы и эксперт-фабрику wz_cli_capability_pack. '+
    'Подбери подходящий ОТКРЫТЫЙ инструмент, собери анкету spec (tool/bin/install/operations с argv-массивами — каждый токен отдельный элемент, без склеивания в строку), '+
    'вызови run_expert("wz_cli_capability_pack", {spec_json: <анкета>}). '+
    'Если инструмент проприетарный (Excel/Photoshop) или без открытого CLI — честно откажись и предложи альтернативу. После выпуска инструмент сам появится в разделе «Инструменты».';
  skRunAgent(prompt).then(function(){
    if(m)m.innerHTML='✓ Передал Строителю — он подбирает и собирает инструмент (минута-другая). Затем нажми «Обновить каталог».';
    b.textContent='Передано';
    if(!document.getElementById('cliadd_refresh')){
      var rb=document.createElement('button'); rb.id='cliadd_refresh'; rb.textContent='Обновить каталог';
      rb.style.cssText='border:1px solid var(--bd2);background:transparent;color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer;margin-right:auto;font-family:var(--sans)';
      rb.onclick=function(){_cliLoaded=false;_cliReg=null;closeCliAdd();if(cur==='cli')renderCLI();};
      var f=document.getElementById('cliadd_foot'); f.insertBefore(rb,f.firstChild);
    }
  }).catch(function(e){b.disabled=false;b.textContent='Ещё раз';if(m)m.textContent='Не удалось передать: '+((e&&e.message)||'нет ответа от Extella');});
}
// Обобщённая кнопка «+ Добавить» для Программ/Моделей/Навыков — передаёт Строителю
// (Qwen) типовую задачу; после он добавляет карточку в живой каталог соответствующего раздела.
var ADD_KINDS={
  programs:{title:'Добавить программу',sub:'Опиши, какая программа нужна — Строитель найдёт открытый вариант и добавит в магазин.',ph:'напр.: планировщик задач · трекер времени · генератор счетов',refresh:function(){_progReg=null;_progFetched=false;if(cur==='programs')renderPrograms();},prompt:function(v){return 'Пользователь просит добавить ПРОГРАММУ (плагин/приложение/MCP-сервер) в магазин Extella: «'+v+'». Найди подходящий ОТКРЫТЫЙ репозиторий и добавь карточку в живой каталог программ: kv_get "_mkt_programs" (global), добавь в .shelf объект {repoUrl,title,facts:[кратко по-русски],source:"github.com/<owner> · ★ N",acc:"#3A6EA5",label:"MCP-инструмент"}, kv_set global. Если открытого нет — честно откажись.';}},
  models:{title:'Добавить модель',sub:'Опиши, какая ИИ-модель нужна — Строитель подберёт работающую и добавит в магазин.',ph:'напр.: генерация музыки · распознавание речи · перевод',refresh:function(){_modReg=null;_modFetched=false;if(cur==='models')renderModels();},prompt:function(v){return 'Пользователь просит добавить ИИ-МОДЕЛЬ в магазин Extella: «'+v+'». Подбери РАБОТАЮЩЕЕ пространство HuggingFace (RUNNING) под задачу и добавь карточку: kv_get "_mkt_models" (global), добавь в .shelf {hfId,title,facts:[кратко по-русски],source:"huggingface.co/<owner> · ♥ N",acc:"#2E7D5B",label:"Работает"}, kv_set global.';}},
  skills:{title:'Добавить навык',sub:'Опиши поведение для ассистента — Строитель составит навык (правило) и добавит в каталог.',ph:'напр.: всегда предлагать сроки · проверять цифры дважды',refresh:function(){_skLoaded=false;_skCatReg=null;if(cur==='skills')renderSkillsShelf();},prompt:function(v){return 'Пользователь просит добавить НАВЫК (правило поведения) в магазин Extella: «'+v+'». Составь один навык: {id:"skill_<латиница>",cat:"Бизнес" или "Работа и продуктивность" или "Стиль и общение" или "Разработка",emoji,name:"<рус 2-3 слова>",desc:"<рус фраза>",rule:"[skill:Имя] <конкретное правило на русском>",howto:"<рус>"}. Добавь: kv_get "_mkt_skills_catalog" (global) {items:[...]}, dedup по id и name, append, kv_set global. Подтверди.';}}
};
function addTileHTML(kind,label){return '<div class="sect_hdr"><span class="sect_title">Нужного нет?</span><span class="sect_line"></span></div><div class="mshelf"><div class="stile" style="--acc:var(--a);border-style:dashed;cursor:pointer" onclick="openAddModal(\''+kind+'\')"><span class="st_chip">✦ Добавить</span><div class="st_title">+ '+esc(label)+'</div><div class="st_fact">Опиши задачу — Строитель найдёт и добавит сам, без разработчика.</div><div class="st_foot"><span style="font-size:11px;color:var(--tx3)">через Строителя</span></div></div></div>';}
function openAddModal(kind){
  var cfg=ADD_KINDS[kind]; if(!cfg)return;
  var ov=document.getElementById('add_ov');
  if(!ov){
    ov=document.createElement('div'); ov.id='add_ov';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    ov.innerHTML='<div style="background:var(--s1);color:var(--tx);max-width:520px;width:100%;border:1px solid var(--bd);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);font-family:var(--sans)">'+
      '<div id="add_title" style="font-family:var(--serif);font-size:20px;margin-bottom:4px"></div>'+
      '<div id="add_sub" style="color:var(--tx2);font-size:13px;line-height:1.5;margin-bottom:14px"></div>'+
      '<textarea id="add_txt" rows="3" style="width:100%;box-sizing:border-box;border:1px solid var(--bd2);border-radius:10px;padding:10px;font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--tx);resize:vertical"></textarea>'+
      '<div id="add_msg" style="font-size:13px;color:var(--tx2);line-height:1.5;margin-top:10px;min-height:18px"></div>'+
      '<div id="add_foot" style="display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px">'+
        '<button onclick="document.getElementById(\'add_ov\').style.display=\'none\'" style="border:1px solid var(--bd2);background:transparent;color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:var(--sans)">Закрыть</button>'+
        '<button id="add_go" onclick="submitAddModal()" style="border:0;background:var(--a);color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600;font-family:var(--sans)">Передать Строителю</button>'+
      '</div></div>';
    ov.onclick=function(e){if(e.target===ov)ov.style.display='none';};
    document.body.appendChild(ov);
  }
  ov._kind=kind;
  document.getElementById('add_title').textContent=cfg.title;
  document.getElementById('add_sub').textContent=cfg.sub;
  var rb=document.getElementById('add_refresh'); if(rb)rb.remove();
  var go=document.getElementById('add_go'); go.disabled=false; go.textContent='Передать Строителю';
  document.getElementById('add_msg').textContent='';
  var t=document.getElementById('add_txt'); t.value=''; t.placeholder=cfg.ph; ov.style.display='flex'; t.focus();
}
function submitAddModal(){
  var ov=document.getElementById('add_ov'); var cfg=ADD_KINDS[ov._kind];
  var t=document.getElementById('add_txt'), m=document.getElementById('add_msg'), b=document.getElementById('add_go');
  var v=((t&&t.value)||'').trim();
  if(!v){m.textContent='Опиши в двух словах.';return;}
  b.disabled=true; b.textContent='Передаю…';
  skRunAgent(cfg.prompt(v)).then(function(){
    m.innerHTML='✓ Передал Строителю — подберёт и добавит (минута-другая). Затем нажми «Обновить».';
    b.textContent='Передано';
    if(!document.getElementById('add_refresh')){
      var rb=document.createElement('button'); rb.id='add_refresh'; rb.textContent='Обновить';
      rb.style.cssText='border:1px solid var(--bd2);background:transparent;color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer;margin-right:auto;font-family:var(--sans)';
      rb.onclick=function(){cfg.refresh();ov.style.display='none';};
      var f=document.getElementById('add_foot'); f.insertBefore(rb,f.firstChild);
    }
  }).catch(function(e){b.disabled=false;b.textContent='Ещё раз';m.textContent='Не удалось передать: '+((e&&e.message)||'нет ответа');});
}
function cliCard(c){
  var ops=(c.ops||[]).map(function(o){return '<span style="display:inline-block;font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:99px;color:var(--text-secondary);margin:2px 4px 0 0">'+esc(o)+'</span>';}).join('');
  var foot=c.soon
    ? '<span class="cli_note" style="font-size:11px;color:var(--text-muted)">в работе</span><button class="st_btn" disabled style="opacity:.45;cursor:default">Скоро</button>'
    : cliInstalled(c.id)
      ? '<span class="sk_active">● установлено</span><span style="display:flex;gap:6px"><button class="st_btn" onclick="cliRun(\''+esc(c.id)+'\')">▶ Запустить</button><button class="sk_del" data-clirm="'+esc(c.id)+'">Удалить</button></span>'
      : '<span class="cli_note" style="font-size:11px;color:var(--text-muted)">локально · офлайн</span><button class="st_btn" data-cliinst="'+esc(c.id)+'">Установить</button>';
  return '<div class="stile" style="--acc:'+esc(CLI_ACC[c.cat]||'#C67E34')+'">'+
    '<span class="st_chip">'+esc(c.emoji)+' '+esc(c.cat)+'</span>'+
    '<div class="st_title">'+esc(c.name)+'</div>'+
    '<div class="st_fact">'+esc(c.desc)+'</div>'+
    (ops?'<div style="margin:4px 0 2px">'+ops+'</div>':'')+
    (c.howto?'<div class="sk_howto"><b>Как запустить:</b> '+esc(c.howto)+'</div>':'')+
    '<div class="st_foot" style="justify-content:space-between;align-items:center;gap:8px">'+foot+'</div></div>';
}
function installCLI(tool,btn){
  if(btn){btn.disabled=true;btn.textContent='Ставлю…';}
  skBridge('etb_run_expert','etb_expert_result',{name:'cap_'+tool+'_resolver',params:{confirm_install:'yes'}})
    .then(function(r){
      var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
      if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
      var st=out&&out.status;
      if(st==='already'||st==='installed'){
        cliMarkInstalled(tool);
        if(cur==='cli'){ renderCLI(); }         // перерисовать: карточка станет «установлено»
        else if(btn){ btn.textContent='Готово ✓'; btn.style.opacity='.7'; }
        return;
      }
      if(!btn)return;
      btn.disabled=false;btn.textContent='Повторить';btn.title=(out&&out.message)||'не удалось поставить';
    })
    .catch(function(e){if(btn){btn.disabled=false;btn.textContent='Ещё раз';btn.title=(e&&e.message)||'нет ответа';}});
}

function setMode(m){
  document.body.setAttribute('data-mode', m);
  var a=document.getElementById('mAll'), p=document.getElementById('mPro');
  if(a) a.classList.toggle('on', m==='all');
  if(p) p.classList.toggle('on', m==='pro');
  renderGrid();
}
function toggleTheme(){ document.documentElement.toggleAttribute('data-lm'); }

// ── Boot ──────────────────────────────────────────────────────────────────
setMode('all');
applyLang();
rtabs();
renderTopics();
doSearch();
_ensureCapInst();   // прогрев «Из интернета · Композитор» (KV _mkt_installed) — счётчик «Мои» честный сразу

// hero/collections. This pull handshake removes the open()-time push race where
