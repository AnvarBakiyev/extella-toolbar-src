function cliRunOp(batchExpert, btn){
  var dir=((document.getElementById('clirun_dir')||{}).value||'').trim();
  var msg=document.getElementById('clirun_msg');
  if(!dir){ if(msg)msg.innerHTML='⚠ Укажи папку с файлами.'; return; }
  if(btn)btn.disabled=true;
  if(msg)msg.innerHTML='⏳ Запущено на устройстве… обработка идёт, результат появится рядом с файлами. Может занять до пары минут.';
  skBridge('etb_run_expert','etb_expert_result',{name:batchExpert,params:{in_dir:dir}}, 180000).then(function(r){
    if(btn)btn.disabled=false;
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    if(!msg)return;
    if(out&&out.status==='success'){
      var saved=(out.total_saved_pct)?(' · сэкономлено '+out.total_saved_pct+'%'):'';
      msg.innerHTML='✓ Готово: обработано '+(out.ok||0)+' из '+(out.count||0)+(out.failed?(' · ошибок '+out.failed):'')+saved+
        (out.out_dir?('<br><span style="color:var(--tx3);font-size:11px">Результат в: '+esc(out.out_dir)+'</span>'):'');
    } else {
      msg.innerHTML='⚠ '+esc((out&&out.message)||'не удалось выполнить');
    }
  }).catch(function(e){
    if(btn)btn.disabled=false;
    if(!msg)return;
    if(e&&e.message==='_timeout_'){
      msg.innerHTML='▶ Задача запущена на устройстве. Обработка долгая, итог не успел прийти в это окно, но файлы уже готовятся: <b>проверь папку с результатом рядом с оригиналами</b> (папка …out).';
    } else {
      msg.innerHTML='⚠ '+esc((e&&e.message)||'нет ответа');
    }
  });
}

  skBridge('etb_run_expert','etb_expert_result',{name:'wz_pick_path',params:{kind:'folder'}},180000).then(function(r){
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    if(out&&out.status==='ok'&&out.path){ var inp=document.getElementById('kp_folder'); if(inp)inp.value=out.path; if(msg)msg.innerHTML='✓ Папка выбрана.'; }
    else if(msg)msg.innerHTML='Выбор отменён, можно вписать путь вручную.';
  }).catch(function(){ if(msg)msg.innerHTML='Впиши путь вручную.'; });
}
function _kpParse(r){ var out=r&&r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output; if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}} return out; }
function kpDoIngest(btn){
  var name=((document.getElementById('kp_name')||{}).value||'').trim().replace(/["\\]/g,'');
  var folder=((document.getElementById('kp_folder')||{}).value||'').trim();
  var msg=document.getElementById('kp_msg');
  if(!name){ if(msg)msg.innerHTML='⚠ Дай имя базе.'; return; }
  if(!folder){ if(msg)msg.innerHTML='⚠ Выбери папку с документами.'; return; }
  if(btn)btn.disabled=true;
  var ingest=function(){
    if(msg)msg.innerHTML='⏳ Собираю базу на устройстве… векторизация может занять пару минут.';
    skBridge('etb_run_expert','etb_expert_result',{name:'kp_ingest',params:{name:name,folder:folder}},300000).then(function(r){
      if(btn)btn.disabled=false;
      var out=_kpParse(r);
      if(out&&out.status==='success'){ kpAdd(name); if(msg)msg.innerHTML='✓ База «'+esc(name)+'» готова: '+out.chunks+' фрагментов из '+out.files+' файлов.'; setTimeout(function(){var o=document.getElementById('kp_ov');if(o)o.remove();renderKnowledge();},1400); }
      else if(msg){ var em=(out&&out.message)||(typeof out==='string'?out:'')||(r&&r.res&&(typeof r.res==='string'?r.res:JSON.stringify(r.res)))||'не удалось собрать'; msg.innerHTML='⚠ '+esc(String(em).slice(0,400)); }
    }).catch(function(e){ if(btn)btn.disabled=false; if(msg)msg.innerHTML=(e&&e.message==='_timeout_')?'▶ Сборка идёт на устройстве (долго). Загляни в раздел через минуту.':('⚠ '+esc((e&&e.message)||'нет ответа')); });
  };
  var ready=false; try{ready=localStorage.getItem('kp_engine_ready')==='1';}catch(_){}
  if(ready){ ingest(); return; }
  // Разовая установка движка знаний (Ollama + модель эмбеддингов), для новых пользователей.
  if(msg)msg.innerHTML='⚙️ Готовлю движок знаний: ставлю локальный эмбеддер (Ollama + nomic-embed-text). Разово, может занять пару минут…';
  skBridge('etb_run_expert','etb_expert_result',{name:'kp_resolver',params:{}},900000).then(function(r){
    var out=_kpParse(r);
    if(out&&out.status==='ok'){ try{localStorage.setItem('kp_engine_ready','1');}catch(_){}; ingest(); }
    else { if(btn)btn.disabled=false; if(msg)msg.innerHTML='⚠ Движок не готов: '+esc((out&&out.message)||(typeof out==='string'?out:'неизвестно')); }
  }).catch(function(e){ if(btn)btn.disabled=false; if(msg)msg.innerHTML=(e&&e.message==='_timeout_')?'⚙️ Движок ставится (качается модель, это долго). Через пару минут нажми «Создать базу» ещё раз.':('⚠ '+esc((e&&e.message)||'нет ответа')); });
}

function installCLI(tool,btn){
  if(btn){btn.disabled=true;btn.textContent='Ставлю…';}
  skBridge('etb_run_expert','etb_expert_result',{name:'cap_'+tool+'_resolver',params:{confirm_install:'yes'}})
    .then(function(r){
      var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
      if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
      var st=out&&out.status;
      if(st==='already'||st==='installed'){
        cliMarkInstalled(tool);
        if(cur==='cli'){ renderCLI(); }         // перерисовать: карточка станет «установлено»
        else if(btn){ btn.textContent='Готово ✓'; btn.style.opacity='.7'; }
        return;
      }
      if(!btn)return;
      btn.disabled=false;btn.textContent='Повторить';btn.title=(out&&out.message)||'не удалось поставить';
    })
    .catch(function(e){if(btn){btn.disabled=false;btn.textContent='Ещё раз';btn.title=(e&&e.message)||'нет ответа';}});
}

// Префетч живых каталогов на старте (параллельно, идемпотентно) → вкладки открываются
// мгновенно из кэша, без задержки KV-round-trip при первом клике.
try { _ensureProg(); } catch (e) {}
try { _ensureMod(); } catch (e) {}
try { _ensureAuto(); } catch (e) {}

// Tell the toolbar we're booted and listening, it (re)sends the cloud merch
// hero/collections. This pull handshake removes the open()-time push race where
// the payload could arrive before this document attached its message listener.
try { window.parent.postMessage({ type: 'etb_ready' }, '*'); } catch (e) {}
