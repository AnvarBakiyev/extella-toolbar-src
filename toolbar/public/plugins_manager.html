// Убрать осиротевший кубик Композитора (broken: программа под ним снесена).
function _mkbRemoveBlock(btn,block){
  var foot=btn.parentNode; if(!foot) return;
  if(!confirm((LANG==='en'?'Remove the block «':'Убрать блок «')+block+(LANG==='en'?'»? Its capability is gone; the block would fail if run.':'»? Способность под ним исчезла, при запуске он упадёт.'))) return;

function _mkbMake(btn,kind,ref,purpose){
  var foot=btn.parentNode; if(!foot) return;
  foot.innerHTML=INF(24)+' <span style="font-size:12px;color:var(--tx2)">'+(LANG==='en'?'Building a block… this can take a minute':'Собираю блок… это может занять минуту')+'</span>';
  // make_block синхронный: проектирование вызова + живой прогон, до минуты, но
  // соединение держится открытым. Клиентский таймаут с запасом (визард на этой
  // кнопке держит 600с) — иначе лоадер оборвётся раньше ответа на медленном блоке.
  _mkbFetch('/x/make_block',{kind:kind,ref:ref,purpose:purpose},600000).then(function(d){
    if(d&&d.status==='success'){
      var made=(d.made&&d.made.length)?d.made.join(', '):'';
      foot.innerHTML='<span style="font-size:12.5px;color:#2E7D5B;font-weight:600">✓ '+(LANG==='en'?'Now a Composer block':'Стало блоком Композитора')+'</span>';
      wsToast((LANG==='en'?'Block ready':'Блок готов')+(made?' · '+esc(made):''),'ok');
      setTimeout(_mkbLoad,800);   // перечитать картину: способность ушла в working, счётчик блоков вырос

      foot.innerHTML='<span style="font-size:12px;color:#c0392b">⚠ '+esc(m)+'</span>'+

    }
  }).catch(function(){
    foot.innerHTML='<span style="font-size:12px;color:var(--tx3)">'+(LANG==='en'?'Composer is busy — try again in a minute':'Композитор занят — загляни через минуту')+'</span>';
  });
}

      '<div class="rc_foot">' + btn + '</div>' +

  if (ghState.results.length > 0 && ghState.results.length < ghState.total) {
    html += '<div class="load_more"><button class="load_more_btn" onclick="loadMore()">Load more</button></div>';
  }

  g.innerHTML = html;
  syncFilterBar();
}

// Command bar: paste a link → straight into the install wizard.
// Empty field → open the wizard with a blank input.
function cmdInstall() {
  var inp = document.getElementById('cmd_url');
  var v = inp ? inp.value.trim() : '';
  if (!v) { notify('github_add'); return; }
  var isLink = /^https?:\/\//i.test(v) || /^[\w.-]+\.[a-z]{2,}\//i.test(v) || v.indexOf('github.com') >= 0 || v.indexOf('huggingface.co') >= 0;
  if (isLink) { notify('github_add_url', '', v); if (inp) inp.value = ''; return; }

// Сквозной поиск по всем каталогам (bundled: сервисы/CLI/навыки/модели; KV: программы/приложения/MCP).
function _gsearch(query){
  var q=(query||'').toLowerCase().trim(); if(!q)return;
  // подтянуть KV-каталоги, если ещё не загружены (результат улучшится при повторе)

  var res=[];

  var g=document.getElementById('grid'); if(!g)return;

// ── HuggingFace search ────────────────────────────────────────────────────
function onHFChange(immediate) {
  var qEl = document.getElementById('hf_q');
  var sortEl = document.getElementById('hf_sort');
  var sdkEl = document.getElementById('hf_sdk');
  var pipeEl = document.getElementById('hf_pipeline');
  if (qEl)    hfState.query    = qEl.value;
  if (sortEl) hfState.sort     = sortEl.value;
  if (sdkEl)  hfState.sdk      = sdkEl.style.display !== 'none' ? sdkEl.value : '';
  if (pipeEl) hfState.pipeline = pipeEl.style.display !== 'none' ? pipeEl.value : '';
  hfState.page = 0;

  cancelHFDebounce();
  if (immediate) { searchHF(); return; }
  if (hfState.query.length === 1) return; // avoid premature renders
  hfState.debTimer = setTimeout(searchHF, 600);
}

function cancelHFDebounce() {
  if (hfState.debTimer) { clearTimeout(hfState.debTimer); hfState.debTimer = null; }
}

function setHFKind(kind) {
  hfState.kind = kind;
  hfState.page = 0;
  hfState.results = [];
  // Toggle kind button classes
  var spBtn = document.getElementById('hf_kind_space');
  var mdBtn = document.getElementById('hf_kind_model');
  if (spBtn) spBtn.className = 'hf_kind_btn' + (kind === 'space' ? ' on' : '');
  if (mdBtn) mdBtn.className = 'hf_kind_btn' + (kind === 'model' ? ' on' : '');
  // Show/hide SDK vs pipeline selects
  var sdkSel  = document.getElementById('hf_sdk');
  var pipeSel = document.getElementById('hf_pipeline');
  if (sdkSel)  sdkSel.style.display  = kind === 'space' ? '' : 'none';
  if (pipeSel) pipeSel.style.display = kind === 'model' ? '' : 'none';
  searchHF();
}

function buildHFUrl(s) {
  var kind = s.kind === 'model' ? 'models' : 'spaces';
  var params = ['limit=' + HF_LIMIT, 'full=true'];
  if (s.query) params.push('search=' + encodeURIComponent(s.query));
  params.push('sort=' + encodeURIComponent(s.sort || 'downloads'));
  params.push('direction=-1');
  if (s.kind === 'space' && s.sdk) params.push('sdk=' + encodeURIComponent(s.sdk));
  if (s.kind === 'model' && s.pipeline) params.push('pipeline_tag=' + encodeURIComponent(s.pipeline));
  if (s.page > 0) params.push('p=' + s.page);
  return HF_API_BASE + '/' + kind + '?' + params.join('&');
}

function searchHF(append) {
  if (!append) hfState.results = [];
  var cKey = mkHFCacheKey(hfState);
  var cached = getHFCached(cKey);
  if (cached) {
    if (append) hfState.results = hfState.results.concat(cached.results);
    else hfState.results = cached.results;
    hfState.total = cached.total;
    hfState.loading = false;
    hfState.error = null;
    if (cur === 'models' && _modHF) renderHFDiscover();
    return;
  }

  hfState.loading = true;
  hfState.error = null;
  if (cur === 'models') renderHFDiscover();

  var url = buildHFUrl(hfState);
  fetch(url, { headers: { Accept: 'application/json' } })
    .then(function(r) {
      if (!r.ok) throw new Error('HF API error ' + r.status);
      // HF returns count in X-Total-Count header for some endpoints
      var total = parseInt(r.headers.get('X-Total-Count') || '0', 10) || 0;
      return r.json().then(function(data) { return { data: data, total: total }; });
    })
    .then(function(result) {
      var items = Array.isArray(result.data) ? result.data : [];
      hfState.total = result.total || items.length;
      setHFCached(cKey, items, hfState.total);
      if (append) hfState.results = hfState.results.concat(items);
      else hfState.results = items;
      hfState.loading = false;
      hfState.error = null;
    })
    .catch(function(e) {
      hfState.loading = false;
      hfState.error = (e && e.message) || 'error';
    })
    .then(function() {
      if (cur === 'models' && _modHF) {
        _renderHFKeepFocus(function() {
          renderHFDiscover();
          syncHFFilterBar();
        });
      }
    });
}

function loadMoreHF() {
  hfState.page++;
  searchHF(true);
}

// Saves focus/cursor of #hf_q, runs cb (which re-renders the DOM), then restores focus.
function _renderHFKeepFocus(cb) {
  var inp = document.getElementById('hf_q');
  var wasFocused = inp && document.activeElement === inp;
  var ss = inp ? inp.selectionStart : null;
  var se = inp ? inp.selectionEnd   : null;
  if (cb) cb();
  if (wasFocused) {
    var inp2 = document.getElementById('hf_q');
    if (inp2) {
      inp2.focus();
      try { inp2.setSelectionRange(ss, se); } catch(_) {}
    }
  }
}

function _hfSlug(s) {
  return String(s).toLowerCase()
    .replace(/[^a-z0-9_]/g, '_')
    .replace(/__+/g, '_')
    .replace(/^_|_$/g, '')
    .slice(0, 30);
}

function _hfIsInstalled(item) {
  var kind = hfState.kind;
  var id = item.id || item.modelId || '';
  // Must use same formula as contextHF() in install-prompt.js
  var slugId = id.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  var pluginId = 'hf_' + kind + '_' + _hfSlug(slugId);
  var inst = gi();
  if (inst.indexOf(pluginId) !== -1) return true;
  // Also check by source field (set by agent during install)
  var custom = getCustom();
  for (var i = 0; i < custom.length; i++) {
    if (custom[i].source === 'hf:' + kind + ':' + id) return true;
  }
  return false;
}

function renderHFDiscover() {
  var g = document.getElementById('grid');
  if (!g) return;

  // Must rescue before any g.innerHTML assignment to prevent destroying the filter bar
  _rescueHFFilterBar();

  var filterSlot = '<div id="hf_filter_slot"></div>';

  if (hfState.loading && !hfState.results.length) {
    var skels = '';
    for (var si = 0; si < 6; si++) skels += '<div class="skel"></div>';
    g.innerHTML = filterSlot + skels;
    syncHFFilterBar();
    return;
  }

  if (hfState.error) {
    g.innerHTML = filterSlot +
      '<div class="banner err">⚡ Could not reach HuggingFace. Check your connection and try again.</div>';
    syncHFFilterBar();
    return;
  }

  if (!hfState.results.length) {
    g.innerHTML = filterSlot + _emptyHTML('🤗', 'Ничего не нашлось.<br>Попробуй другие слова или сними фильтры.');
    syncHFFilterBar();
    return;
  }

  var html = filterSlot;
  if (hfState.total > 0) {
    html += '<div class="total_hint">' + fmtN(hfState.total) + ' ' +
      (hfState.kind === 'model' ? 'models' : 'spaces') + ' found</div>';
  }

  hfState.results.forEach(function(item, i) {
    html += renderHFCard(item, i);
  });

  if (hfState.results.length > 0 && hfState.results.length < hfState.total) {
    html += '<div class="load_more"><button class="load_more_btn" onclick="loadMoreHF()">Load more</button></div>';
  }

  g.innerHTML = html;
  syncHFFilterBar();
}

// Cards never show raw social-preview images: auto-generated ones are white
// text rectangles that duplicate the title and crop badly. Instead: a quiet
// surface, the item's accent as a thin top spine, avatar + name set in type.
var ACC_PALETTE = ['#C57E33','#2F6B66','#3D8078','#7C5CD6','#D65CA8','#5B8DEF','#DC6E3E'];
var LANG_COLORS = {JavaScript:'#b8a52a',TypeScript:'#3178c6',Python:'#3572A5',Go:'#00ADD8',
  Rust:'#B7683F',Ruby:'#701516',PHP:'#4F5D95',Java:'#b07219',C:'#555555','C++':'#f34b7d',
  'C#':'#178600',Swift:'#F05138',Kotlin:'#7F52FF',Shell:'#6E9E4F',HTML:'#e34c26',CSS:'#563d7c',
  Dockerfile:'#384d54','Jupyter Notebook':'#DA5B0B'};
function accFor(key, lang) {
  if (lang && LANG_COLORS[lang]) return LANG_COLORS[lang];
  var h = 0; key = String(key || '');
  for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return ACC_PALETTE[h % ACC_PALETTE.length];
}
function rcCover(opts) {

function renderHFCard(item, i) {
  var kind = hfState.kind;

  var name = id.includes('/') ? id.split('/')[1] : id;
  var desc = item.description || (item.cardData && item.cardData.description) || '';
  var downloads = fmtN(item.downloads || 0);
  var likes = fmtN(item.likes || 0);
  var sdk = item.sdk || (item.cardData && item.cardData.sdk) || '';

  var meta = [

  return '<div class="rcard' + (isInst ? ' inst' : '') +
    '" style="--acc:' + accFor(id) + ';animation-delay:' + Math.min(i * 12, 180) + 'ms">' +

    '<div class="rc_meta">' + pills + (pills && meta ? '<span class="rc_dot">·</span>' : '') + meta + '</div>' +
    '<div class="rc_foot">' + btn + '</div>' +

function installHF(id, kind, btn) {
  // Детерминированная установка gradio-Space (без ИИ-агента): прокси-эксперт создаётся ВСЕГДА, за секунды.
  // Не-space (модели без Space) и не-gradio — фолбэк на прежний агентный путь.
  function agentFallback() { if (btn) { btn.disabled = true; btn.textContent = 'Opening…'; } notify('hf_add_url', '', 'hf:' + kind + ':' + id); }
  if (kind !== 'space') { agentFallback(); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Ставлю…'; }
  skBridge('etb_run_expert', 'etb_expert_result', { name: 'hf_space_install', params: { space: id } }, 180000).then(function (r) {
    var out = r.res; if (out && typeof out === 'object' && (out.result || out.output)) out = out.result || out.output;
    if (typeof out === 'string') { try { out = JSON.parse(out); } catch (e) {} }
    if (out && out.status === 'success' && out.plugin_id) {
      if (btn) { btn.textContent = 'Готово ✓'; }
      notify('open', out.plugin_id);  // хост перечитает реестр и откроет свежий плагин
    } else if (out && out.status === 'not_gradio') {
      agentFallback();                 // веб-приложение (не gradio) — ставит агент
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '+ Install'; }
      alert('Не удалось установить: ' + ((out && out.message) || 'неизвестная ошибка'));
    }
  }).catch(function () { agentFallback(); });  // таймаут/сбой моста — на агента
}

// ── Установлено Композитором/поиском способностей (общий KV _mkt_installed, пишет wz_capability_install) ──
var _capInstReg = null, _capInstFetched = false;
var CAPINST_KIND = {model:'модель', mcp:'MCP-сервер', cli:'CLI', skill:'навык', service:'сервис', api:'API'};
var CAPINST_KIND_EN = {model:'model', mcp:'MCP server', cli:'CLI', skill:'skill', service:'service', api:'API'};
function _ensureCapInst() {
  if (_capInstFetched) return; _capInstFetched = true;
  skKvGet('_mkt_installed').then(function(r){ _capInstReg = (r && r.items) ? r.items : []; rtabs(); if (cur === 'mine') renderInstalled(); else if (cur === 'desktop') _deskRedraw(); })
    .catch(function(){ _capInstReg = _capInstReg || []; if (cur === 'mine') renderInstalled(); else if (cur === 'desktop') _deskRedraw(); });
}
function capInstCount(){ return (_capInstReg && _capInstReg.length) || 0; }
function capInstRefresh(){ _capInstReg = null; _capInstFetched = false; _ensureCapInst(); }
function _capInstDropRecord(kind, id){
  // запись из «Мои» (локальный реестр + общий KV)
  _capInstReg = (_capInstReg || []).filter(function(it){ return !(it.kind === kind && it.id === id); });
  rtabs(); if (cur === 'mine') renderInstalled();
  skKvGet('_mkt_installed').then(function(r){
    var cat = (r && r.items) ? r : {items: []};
    cat.items = (cat.items || []).filter(function(it){ return !(it.kind === kind && it.id === id); });
    return skKvSet('_mkt_installed', cat);
  }).catch(function(){ capInstRefresh(); });   // KV не записался — честно перечитываем (карточка вернётся)
}
function capInstRemove(kind, id, method){
  var en = (typeof LANG !== 'undefined' && LANG === 'en');
  var device = (kind === 'model' || kind === 'mcp' || method === 'brew' || method === 'ollama' || method === 'mcp_connect');
  var what = kind === 'model' ? (en ? 'The model will be DELETED from this device (frees space; re-downloadable).' : 'Модель будет УДАЛЕНА с устройства (освободит место; скачать можно заново).')
    : kind === 'mcp' ? (en ? 'The MCP server will be disconnected (removed from the device allowlist).' : 'Подключение будет отключено от агента и убрано с этого компьютера.')
    : method === 'brew' ? (en ? 'The tool will be uninstalled from this device (brew uninstall).' : 'Инструмент будет удалён с устройства (brew uninstall).')
    : (en ? 'The entry will be removed from My.' : 'Запись будет убрана из «Мои».');
  if (!confirm((en ? 'Remove "' : 'Удалить «') + id + (en ? '"?\n\n' : '»?\n\n') + what)) return;
  if (!device) { _capInstDropRecord(kind, id); return; }
  // сначала РЕАЛЬНО удаляем с устройства; запись трём только после успеха — без свалки и без вранья
  skBridge('etb_run_expert', 'etb_expert_result',
           { name: 'wz_capability_uninstall', params: { kind: kind, ref: id, method: method || '' } }, 180000)
    .then(function(r){
      var out = r.res; if (out && typeof out === 'object' && (out.result || out.output)) out = out.result || out.output;
      if (typeof out === 'string') { try { out = JSON.parse(out); } catch(e){} }
      if (out && out.device_removed) {
        _capInstDropRecord(kind, id);
        // MCP отключается вычёркиванием из аллоулиста устройства — перечитать правду,
        // иначе карточка так и останется «✓ подключён».
        if (kind === 'mcp') { _mcpConnFetched = false; _ensureMcpConn(); }
      }
      else { alert((en ? 'Not removed: ' : 'Не удалилось: ') + ((out && out.message) || 'error')); }
    })
    .catch(function(e){
      alert((en ? 'Not removed: ' : 'Не удалилось: ') + ((e && e.message === '_timeout_') ? (en ? 'timed out — check later' : 'долго выполняется — проверь позже') : ((e && e.message) || 'error')));
    });
}

// ══════════════════════════════════════════════════════════════════════════
//  РАБОЧИЙ СТОЛ (ИИ-ОС): Конструктор = «Мой компьютер», всё установленное = ярлыки.
//  Одна метафора — операционная система: рабочий стол, на нём программы, а
//  Конструктор объединяет их в процессы и запускает.
// ══════════════════════════════════════════════════════════════════════════
// ── Единые состояния для всех вкладок (стандарт витрины) ──────────────────
// Раньше загрузка была то «sk_lead», то «empty+⏳», пустота — по-своему у каждой.
// Теперь один вид: центрированная иконка + текст.
// Анимированная бесконечность — единый индикатор загрузки Extella (приём из Workspace).
var INF_PATH='M25,25 C25,11 43,11 50,25 C57,39 75,39 75,25 C75,11 57,11 50,25 C43,39 25,39 25,25 Z';
function INF(w){ w=w||56; return '<span class="inf" style="width:'+w+'px"><svg viewBox="0 0 100 50" width="'+w+'" height="'+(w/2)+'" aria-hidden="true">'+
  '<defs><linearGradient id="infg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C67A22"/><stop offset="1" stop-color="#E8B36A"/></linearGradient></defs>'+

function _dtEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// Правый клик по ярлыку → контекстное меню (Открыть/Кабинет/Запустить · Удалить),
// как в ОС. Управление живёт на столе — отдельные вкладки «Мои»/«Автоматизации» не нужны.
var _dtReg=[];
var _dtSys=[];   // ярлыки, спрятанные со стола как двойники системных плиток (их и открывают плитки)
// Открыть Конструктор. Делаем ровно то же, что рабочая иконка Конструктора на столе: находим его
// среди ярлыков и вызываем его же действие открытия — id установленного плагина
// может отличаться от 'extella_adoption_wizard' (тогда прямой notify приложение не узнаёт).
// ВАЖНО: искать надо И в _dtSys — дедуп двойников прячет Конструктор именно туда,
// и поиск только по _dtReg давал «Конструктор не установлен» на устройстве, где он стоит.
function _openWizard(){
  var w=null, pool=_dtSys.concat(_dtReg), i, it, s;
  // Сначала точный системный плагин, потом программные совпадения и только в
  // последнюю очередь — агент с похожим названием. Иначе «Конструктор» мог
  // открыть кабинет агента «Конструктор внедрения» вместо самой программы.
  for(i=0;i<pool.length;i++){it=pool[i];if(it.id==='extella_adoption_wizard'){w=it;break;}}
  if(!w)for(i=0;i<pool.length;i++){it=pool[i];s=((it.lbl||'')+' '+(it.raw||'')+' '+(it.id||'')).toLowerCase();
    if(it.kind!=='agent'&&/wizard|визард|конструктор|adoption|внедрен/.test(s)){w=it;break;}}
  if(!w)for(i=0;i<pool.length;i++){it=pool[i];s=((it.lbl||'')+' '+(it.raw||'')+' '+(it.id||'')).toLowerCase();
    if(/wizard|визард|конструктор|adoption|внедрен/.test(s)){w=it;break;}}
  if(w){
    if(w.kind==='agent') openAgentCabinet(w.id);
    else if(w.kind==='cli') cliRun(w.id);
    else notify('open', w.id);   // тот же id установленного плагина, что и у рабочей иконки
    return;
  }
  // Конструктора нет среди установленных — молчать нельзя: показываем, как поставить
  _wizardMissing();
}
function _wizardMissing(){
  var en=(LANG==='en');
  var mac='bash <(curl -fsSL https://raw.githubusercontent.com/AnvarBakiyev/extella-marketplace-pack/main/toolbar/install-all.sh)';
  var win='irm https://raw.githubusercontent.com/AnvarBakiyev/extella-marketplace-pack/main/toolbar/install-all.ps1 | iex';
  alert((en?'Wizard is not installed on this device.\n\nRun the installer (toolbar + Wizard):':'Конструктор не установлен на этом устройстве.\n\nЗапусти единый установщик (тулбар + Конструктор):')+
    '\n\nmacOS (Terminal):\n'+mac+'\n\nWindows (PowerShell):\n'+win);
}
function _dtCloseMenu(){ var m=document.getElementById('dt_menu'); if(m)m.remove(); }
function _dtCtx(e, i){
  e.preventDefault(); e.stopPropagation();
  var it=_dtReg[i]; if(!it) return false;
  _dtCloseMenu();
  var openLbl = 'Открыть';  // одно слово для всех типов (решение Эллы); действие остаётся типовым — агент откроется кабинетом, инструмент запуском
  var items=[{l:openLbl,a:'open'},{l:'Удалить',a:'remove',d:true}];
  var m=document.createElement('div'); m.id='dt_menu'; m.className='dt_menu';
  m.innerHTML=items.map(function(x){ return '<button class="dt_mi'+(x.d?' dt_mi_danger':'')+'" onclick="_dtDo('+i+',\''+x.a+'\')">'+x.l+'</button>'; }).join('');
  document.body.appendChild(m);
  m.style.left=Math.min(e.clientX, window.innerWidth-190)+'px';
  m.style.top=Math.min(e.clientY, window.innerHeight-110)+'px';
  setTimeout(function(){ document.addEventListener('click', _dtCloseMenu, {once:true}); document.addEventListener('contextmenu', _dtCloseMenu, {once:true}); },0);
  return false;
}
function _dtDo(i, act){
  _dtCloseMenu();
  var it=_dtReg[i]; if(!it) return;
  if(act==='open'){
    if(it.kind==='agent') openAgentCabinet(it.id);
    else if(it.kind==='program') notify('open', it.id);
    else if(it.kind==='cli') cliRun(it.id);
    else if(it.kind==='cap'){ if(it.url) window.open(it.url,'_blank'); else setc('mine'); }
    return;
  }
  if(act==='remove'){
    // Ярлык мог быть СКЛЕЕН дедупом из нескольких записей (карточка каталога +
    // файлы реестра устройства с почти одинаковыми именами — «Кадровые документы»
    // собирались из трёх). Удаление только выбранной записи оставляло двойников,
    // и ярлык «возвращался». Убираем ВСЕ источники склейки разом.
    var list=(it.dups&&it.dups.length)?it.dups:[it];
    var agentIds=list.filter(function(d){return d.kind==='agent';}).map(function(d){return d.id;});
    var hasModal=list.some(function(d){return d.kind==='app';});   // у приложений свой модал с подтверждением
    if(!hasModal){
      var msg='Удалить «'+it.lbl+'» с рабочего стола?';
      if(agentIds.length) msg+='\nКарточка автоматизации удалится из каталога целиком (эксперты и данные в Extella не трогаются).';
      if(list.length>1) msg+='\nЯрлык собран из '+list.length+' записей — уберу все.';
      if(!confirm(msg)) return;
    }
    list.forEach(function(d){
      if(d.kind==='agent'){
        _autoReg=(_autoReg||[]).filter(function(x){return _agId(x)!==d.id;});
        _agSaveState(d.id,{status:'removed', hidden:true});
      }
      else if(d.kind==='program'){ uninst(d.id); }
      else if(d.kind==='cli'){ cliUninstall(d.id); }
      else if(d.kind==='cap'){ capInstRemove(d.rmKind, d.id, d.method||''); }
      else if(d.kind==='app'){ appUninstall(d.id, d.raw||d.lbl); }
    });
    // Удаление со стола = настоящее (требование Анвара): агентские записи
    // вычищаются и из глобального каталога, одной перезаписью на все id.
    if(agentIds.length) _agCatalogPurge(agentIds);
    setTimeout(_deskRedraw,300);
  }
}

// «постоянно туда-сюда ходишь»). Снапшот последней удачной сборки рисует стол
// МГНОВЕННО, свежие данные доезжают фоном и перерисовывают (stale-while-revalidate).
var DESK_SNAP_KEY='etb_desk_snap_v1', _deskSnapNames={};
function _deskSnapSave(){
  try{
    var names={};
    if(_appInstalled){ Object.keys(_appInstalled).forEach(function(aid){
      if(aid.indexOf('/')<0)return;
      var t=aid.split('/').pop();
      if(_appReg&&_appReg.shelf){ var mm=_appReg.shelf.filter(function(a){return a.id===aid;})[0]; if(mm)t=mm.title||t; }
      names[aid]=t;

    var s=JSON.stringify({v:1, ts:Date.now(), autoReg:_autoReg||[], agState:_agState||{},
      capInstReg:_capInstReg||[], appInstalled:_appInstalled||{}, appNames:names});

function _deskSnapRestore(){

    if(_autoReg===null) _autoReg=snap.autoReg||[];
    _agState=Object.assign({}, snap.agState||{}, _agState);   // живые правки главнее снапшота

// ── AI Автоматизации (Process Packs) ──────────────────────────────────────
// Живые процессы-паки из KV-каталога _mkt_automations (его пишет wz_publish_pack при Publish).
var _autoReg = null, _autoFetched = false;
var _autoErr = false;  // KV не ответил: «не смог проверить» ≠ «автоматизаций нет»

    '<button class="st_btn" onclick="autoRefresh()">'+(en?'Try again':'Проверить ещё раз')+'</button></div>';
}
function _ensureAuto() {

    _autoReg = (r && r.items) ? r.items : [];

}
function autoRefresh() { _autoErr = false; _autoReg = null; _autoFetched = false; _ensureAuto(); }
// ══════════════════════════════════════════════════════════════════════════
//  АГЕНТ КАК УПРАВЛЯЕМЫЙ ОБЪЕКТ (кабинет агента)
//  Каждый собранный Конструктором агент = богатая карточка + полный кабинет.
//  Данные берём из манифеста каталога _mkt_automations (обогащается wz_publish_pack),
//  а изменяемое состояние (имя, статус, расписание, история запусков) — клиентский
//  слой в KV `agent_state:<id>`, чтобы не переписывать owned-Конструктором каталог.
// ══════════════════════════════════════════════════════════════════════════
var _AG_ACCENTS = ['#3A6EA5','#8F4E1E','#57A773','#8E4AA8','#C67E34','#2E7D5B','#D65CA8','#4E8FDB'];
var _agState = {};          // id -> {name?, status?, schedule?, runs?} (кэш KV)
function _agId(p){ return String(p.id || p.orchestrator || p.name || ''); }
function _agAcc(p){ var s=_agId(p),h=0; for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return p.accent || _AG_ACCENTS[h % _AG_ACCENTS.length]; }
function _agEmoji(p){ return p.emoji || '⚙️'; }
// Умения-чипы: из манифеста, иначе честный fallback из под-экспертов/описания.
function _agCaps(p){
  if (p.capabilities && p.capabilities.length) return p.capabilities;
  var ex = p.experts || p.stages || [];
  if (ex.length) return ex.slice(0,4).map(function(e){ return String(e).replace(/^wz_[0-9_a-f]*_?/,'').replace(/_/g,' ').trim() || 'шаг'; });
  return [];
}
function _agExperts(p){ return p.experts || p.stages || (p.orchestrator ? [p.orchestrator] : []); }
function _agTagline(p){ return p.tagline || p.description || ''; }
// имя без ведущего эмодзи (эмодзи показываем отдельно в обложке — без дубля)
function _agCleanName(p){ var n=String(_agName(p)||'').trim(); if(n && n.charCodeAt(0)>=0x2600){ n=n.replace(/^\S+\s*/,''); } return n||_agName(p); }
// hero-обложка: индивидуальный градиент из accent агента + мягкий эмодзи-водяной знак
function _agHeroStyle(acc){ return 'background:linear-gradient(135deg,'+acc+' 0%,color-mix(in srgb,'+acc+' 55%,var(--s2)) 55%,var(--s2) 100%)'; }
function _agStatus(p){ var st=_agState[_agId(p)]; return (st && st.status) || p.status || 'active'; }
function _agName(p){ var st=_agState[_agId(p)]; return (st && st.name) || p.name || p.id; }
function _agSchedule(p){ var st=_agState[_agId(p)]; return (st && st.schedule) || p.schedule || null; }
function _agRuns(p){ var st=_agState[_agId(p)]; return (st && st.runs) || []; }
function _statusBadge(s){
  var m={active:['● активен','#2f9e56'],paused:['⏸ на паузе','#C67E34'],frozen:['🔒 заморожен','#3A6EA5']};
  var v=m[s]||m.active;
  return '<span style="font:700 10px ui-monospace,Menlo,monospace;color:'+v[1]+';letter-spacing:.03em">'+v[0]+'</span>';
}
// KV-персистенс состояния агента (объединяем поверх манифеста).
function _agLoadState(id){ return skKvGet('agent_state:'+id).then(function(o){ _agState[id]=o||_agState[id]||{}; return _agState[id]; }).catch(function(){ _agState[id]=_agState[id]||{}; return _agState[id]; }); }
function _agSaveState(id, patch){
  var cur = _agState[id] || {};
  var next = {}; for(var k in cur) next[k]=cur[k]; for(var k2 in patch) next[k2]=patch[k2];
  _agState[id]=next;
  return skKvSet('agent_state:'+id, next).catch(function(){});
}
function _fmtTs(ts){
  try{ var d=new Date(ts); var p=function(n){return (n<10?'0':'')+n;};
    return p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return ''; }
}

// ── Запуск агента + запись в историю ──────────────────────────────────────
function autoRun(orch, btn){
  var p = (_autoReg||[]).filter(function(x){return (x.orchestrator||x.id)===orch;})[0] || {orchestrator:orch, id:orch};
  var id = _agId(p);
  var el = document.getElementById('auto_msg_' + orch);
  if (el) el.innerHTML = _t('runStarted');
  if (btn) btn.disabled = true;
  var startedTs = Date.now();
  skBridge('etb_run_expert', 'etb_expert_result', { name: orch, params: {} }, 180000).then(function(r){
    if (btn) btn.disabled = false;
    if (el) el.innerHTML = _t('runOk');
    _recRun(id, true, 'запуск вручную', startedTs);
  }).catch(function(e){
    if (btn) btn.disabled = false;
    var m = (e && e.message) || 'error';
    // HTTP 500/timeout ≠ провал (канон): работа могла продолжиться — помечаем как «идёт».
    var deferred = /500|timeout|defer/i.test(m);
    if (el) el.innerHTML = deferred ? INF(28)+' запущено — идёт в фоне' : ('⚠ ' + m);
    _recRun(id, deferred ? null : false, deferred ? 'в фоне' : m, startedTs);
  });
}
// История запусков — общий серверный KV `agent_runs:<id>` (то же место, куда пишет
// планировщик через эксперт wz_agent_runlog). Кабинет читает и ручные, и по расписанию.
function _agLoadRuns(id){
  return skKvGet('agent_runs:'+id).then(function(o){
    var runs = (o && o.runs) || [];
    _agState[id] = _agState[id] || {}; _agState[id].runs = runs;
    return runs;
  }).catch(function(){ _agState[id]=_agState[id]||{}; _agState[id].runs=_agState[id].runs||[]; return _agState[id].runs; });
}
function _recRun(id, ok, note, ts){
  skKvGet('agent_runs:'+id).then(function(o){
    var runs = (o && o.runs) || [];
    runs = [{ts: ts||Date.now(), ok: ok, note: note||''}].concat(runs).slice(0, 200);
    _agState[id] = _agState[id] || {}; _agState[id].runs = runs;
    return skKvSet('agent_runs:'+id, {runs: runs});
  }).then(function(){ if(_cabOpenId===id) _cabRender(); }).catch(function(){});
}

// ── Индивидуальная карточка агента: hero-обложка (личность) + управление ───
function autoCardHTML(p, i){
  var id=_agId(p), acc=_agAcc(p), name=esc(_agCleanName(p)), tag=esc(_agTagline(p)), em=_agEmoji(p);
  var caps=_agCaps(p), status=_agStatus(p), sch=_agSchedule(p);
  var chips=caps.slice(0,4).map(function(c){ return '<span style="display:inline-block;font-size:11px;color:var(--tx2);background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:2px 8px;margin:0 5px 5px 0">'+esc(c)+'</span>'; }).join('');
  var runs=_agRuns(p), lastRun = runs[0] ? ('последний запуск '+_fmtTs(runs[0].ts)) : 'ещё не запускался';
  var schTxt = sch ? ('⏰ '+esc(sch.human||sch.period||'по расписанию')) : lastRun;
  var disabled = (status==='frozen');
  return '<div class="stile agcard" style="--acc:'+esc(acc)+';padding:0;overflow:hidden;animation-delay:'+Math.min(i*12,120)+'ms">'+
    // hero-обложка — у каждого агента своя (градиент из его цвета + крупный эмодзи)
    '<div style="'+_agHeroStyle(esc(acc))+';padding:16px 16px 14px;position:relative;cursor:pointer" onclick="openAgentCabinet(\''+esc(id)+'\')">'+
      '<div style="position:absolute;right:10px;top:6px;font-size:52px;line-height:1;opacity:.22;pointer-events:none">'+em+'</div>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative">'+
        '<span style="font-size:26px;line-height:1">'+em+'</span>'+_statusBadge(status)+'</div>'+
      '<div style="font:700 16px/1.28 var(--sans);color:#fff;letter-spacing:-.01em;margin-top:8px;text-shadow:0 1px 4px rgba(0,0,0,.25);position:relative;max-width:88%">'+name+'</div>'+
      (tag?'<div style="font-size:12px;color:rgba(255,255,255,.9);margin-top:4px;line-height:1.4;text-shadow:0 1px 3px rgba(0,0,0,.25);position:relative;max-width:92%">'+tag+'</div>':'')+
    '</div>'+
    // тело — умения + управление
    '<div style="padding:12px 15px 13px">'+
      (chips?'<div style="margin-bottom:8px">'+chips+'</div>':'')+
      '<div class="isub" id="auto_msg_'+esc(p.orchestrator||id)+'" style="min-height:0;margin:0 0 6px;font-size:11.5px;color:var(--tx2)"></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'+
        '<span style="font-size:11px;color:var(--tx3)">'+schTxt+'</span>'+
        '<span style="display:flex;gap:6px">'+
          '<button class="st_btn" style="background:transparent;color:var(--tx2);border:1px solid var(--bd2);padding:6px 12px" onclick="openAgentCabinet(\''+esc(id)+'\')">⚙ Кабинет</button>'+
          (p.orchestrator&&!disabled?'<button class="st_btn" onclick="autoRun(\''+esc(p.orchestrator)+'\',this)">▶ Запустить</button>':'')+
        '</span>'+
      '</div>'+
    '</div></div>';
}

function renderAutomations() {
  var g = document.getElementById('grid'); if (!g) return;
  if (_autoReg === null) {
    _ensureAuto();
    g.innerHTML = _loadingHTML(_t('autoLoad'));
    rtabs(); return;
  }
  if (!_autoReg.length) {
    g.innerHTML = _autoErr ? _autoErrHTML() : _emptyHTML('⚙️', _t('autoEmpty'));
    rtabs(); return;
  }
  // Подтягиваем клиентское состояние всех агентов один раз, потом рисуем.
  var need = _autoReg.filter(function(p){ return !(_agId(p) in _agState); });
  if (need.length) {
    Promise.all(need.map(function(p){ return _agLoadState(_agId(p)); })).then(function(){ renderAutomations(); });
    g.innerHTML = _loadingHTML(_t('autoLoad'));

  var visible = _autoReg.filter(function(p){ var st=_agState[_agId(p)]; return !(st && st.hidden); });

    rtabs(); return;

  var html = '<div class="sect_hdr" style="grid-column:1/-1"><span class="sect_title">Мои агенты · собраны Конструктором</span><span class="sect_line"></span></div>'+
    '<div class="sk_lead" style="grid-column:1/-1;margin:-2px 0 6px">Каждый агент — управляемый объект: запуск, расписание, история, настройки. Открой «⚙ Кабинет».</div>'+
    '<div class="mshelf">' + visible.map(function(p, i){ return autoCardHTML(p, i); }).join('') + '</div>';
  g.innerHTML = html;
  rtabs();
}

// Вычистка записей из каталога _mkt_automations (глобальный ключ, пишет

// теряли бы друг друга. Перечитываем свежую копию перед записью.
function _agCatalogPurge(ids){
  var kill={}; (ids||[]).forEach(function(i){ kill[i]=1; });
  return skKvGet('_mkt_automations').then(function(r){
    if(!r || !r.items) return null;
    var left=r.items.filter(function(x){ return !kill[_agId(x)]; });
    if(left.length===r.items.length) return null;   // записей уже нет — не переписываем
    r.items=left;

function uninst(id) {
  // Snapshot manifest BEFORE clearing localStorage so parent can do full cleanup.
  // If we cleared first, ETB.registry.getById() in the parent would return null,
  // causing CSPL cleanup to be skipped and the device registry file to persist,
  // which makes the plugin reappear on next boot (syncFromDevice reads it back).
  var pluginData = (getCustom().filter(function(p) { return p.id === id; })[0]) || null;

  // Remove from installed IDs and custom list
  si(gi().filter(function(x){ return x !== id; }));
  var remaining = getCustom().filter(function(p){ return p.id !== id; });
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(remaining)); } catch(_) {}

  // Send manifest snapshot so parent has artifact paths even after localStorage is gone
  try {
    window.parent.postMessage({
      type: 'etb_plugin_action',
      action: 'uninstall',
      pluginId: id,
      url: '',
      pluginData: pluginData
    }, '*');
  } catch(_) {}

  renderGrid();
  rtabs();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// ── Listen for parent messages ────────────────────────────────────────────
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'etb_merch') {
    window._merch = e.data.data || null;
    if (cur === 'programs') renderPrograms();
  } else if (e.data.type === 'etb_reload_plugins') {
    renderGrid();
    rtabs();
  } else if (e.data.type === 'etb_install_result') {
    delete installingIds[e.data.pluginId];
    featuredError = e.data.ok ? '' : (e.data.message || 'unknown error');
    // Итог установки — всегда вслух: что получилось и где искать результат
    try {
      var _nm = (CURATED_PROGRAMS[e.data.pluginId] || {}).name || e.data.pluginId;
      if (e.data.ok) wsToast('✓ «' + esc(_nm) + '» установлена — ярлык на Рабочем столе', 'ok');
      else wsToast('✗ «' + esc(_nm) + '» не установилась: ' + esc((e.data.message || 'попробуй ещё раз').slice(0, 120)), 'err');
    } catch (_) {}
    renderGrid();
    rtabs();
  }
});

function skBridge(sendType,resultType,payload,timeoutMs){
  return new Promise(function(res,rej){
    var reqId=sendType+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    function onMsg(ev){ if(!ev.data||ev.data.type!==resultType||ev.data.reqId!==reqId)return;
      window.removeEventListener('message',onMsg); if(ev.data.ok)res(ev.data);else rej(new Error(ev.data.error||'error')); }
    window.addEventListener('message',onMsg);
    window.parent.postMessage(Object.assign({type:sendType,reqId:reqId},payload),'*');
    setTimeout(function(){window.removeEventListener('message',onMsg);rej(new Error('_timeout_'));},timeoutMs||20000);
  });
}
function skKvGet(k){return skBridge('etb_kv_get','etb_kv_result',{key:k}).then(function(r){var v=r.value;if(!v)return null;try{return typeof v==='string'?JSON.parse(v):v;}catch(e){return null;}});}
function skKvSet(k,o){return skBridge('etb_kv_set','etb_kv_result',{key:k,value:JSON.stringify(o)});}
// Каталоги >80 карточек не влезают в одну KV-ячейку (лимит ~28КБ), харвестер бьёт
// их на шарды _mkt_x, _mkt_x_2, _mkt_x_3 (мета shards:N в первом). Склеиваем обратно.
function _loadSharded(base,field){
  field=field||'shelf';
  return skKvGet(base).then(function(r){
    if(!r) return r;
    var n=r.shards||1;
    if(n<=1) return r;
    var reqs=[];
    for(var i=2;i<=n;i++) reqs.push(skKvGet(base+'_'+i).catch(function(){return null;}));
    return Promise.all(reqs).then(function(parts){
      var arr=(r[field]||[]).slice();
      parts.forEach(function(p){ if(p&&p[field]) arr=arr.concat(p[field]); });
      r[field]=arr; return r;
    });
  });
}
function skRuleAdd(rule,agents){return skBridge('etb_rule_add','etb_rule_result',{rule:rule,agents:agents});}
function skRuleRemove(refs){return skBridge('etb_rule_remove','etb_rule_result',{refs:refs});}

function skDoInstall(agents,label){
  var s=_skPick; if(!s)return; closeSkPick();

    _skReg.items=(_skReg.items||[]).filter(function(x){return x.id!==s.id;});

function cliRunOp(batchExpert, btn){
  var dir=((document.getElementById('clirun_dir')||{}).value||'').trim();
  var msg=document.getElementById('clirun_msg');
  if(!dir){ if(msg)msg.innerHTML='⚠ Укажи папку с файлами.'; return; }
  if(btn)btn.disabled=true;
  if(msg)msg.innerHTML=INF(28)+' Запущено на устройстве… обработка идёт, результат появится рядом с файлами. Может занять до пары минут.';
  skBridge('etb_run_expert','etb_expert_result',{name:batchExpert,params:{in_dir:dir}}, 180000).then(function(r){
    if(btn)btn.disabled=false;
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    if(!msg)return;
    if(out&&out.status==='success'){
      var saved=(out.total_saved_pct)?(' · сэкономлено '+out.total_saved_pct+'%'):'';
      msg.innerHTML='✓ Готово: обработано '+(out.ok||0)+' из '+(out.count||0)+(out.failed?(' · ошибок '+out.failed):'')+saved+
        (out.out_dir?('<br><span style="color:var(--tx3);font-size:11px">Результат в: '+esc(out.out_dir)+'</span>'):'');
    } else {
      msg.innerHTML='⚠ '+esc((out&&out.message)||'не удалось выполнить');
    }
  }).catch(function(e){
    if(btn)btn.disabled=false;
    if(!msg)return;
    if(e&&e.message==='_timeout_'){
      msg.innerHTML='▶ Задача запущена на устройстве. Обработка долгая, итог не успел прийти в это окно, но файлы уже готовятся: <b>проверь папку с результатом рядом с оригиналами</b> (папка …out).';
    } else {
      msg.innerHTML='⚠ '+esc((e&&e.message)||'нет ответа');
    }
  });
}
// Нативный выбор папки, открывает диалог macOS НА УСТРОЙСТВЕ (osascript), возвращает путь.
function cliPickFolder(){
  var msg=document.getElementById('clirun_msg');
  if(msg)msg.innerHTML='📁 Открываю выбор папки на твоём Mac…';
  skBridge('etb_run_expert','etb_expert_result',{name:'wz_pick_path',params:{kind:'folder'}}, 180000).then(function(r){
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    if(out&&out.status==='ok'&&out.path){
      var inp=document.getElementById('clirun_dir'); if(inp)inp.value=out.path;
      if(msg)msg.innerHTML='✓ Папка выбрана, жми операцию ниже.';
    } else if(out&&out.status==='cancel'){
      if(msg)msg.innerHTML='Выбор отменён.';
    } else {
      if(msg)msg.innerHTML='⚠ Не удалось открыть выбор. Впиши путь вручную в поле выше.';
    }
  }).catch(function(e){ if(msg)msg.innerHTML='⚠ '+((e&&e.message==='_timeout_')?'выбор не завершён, впиши путь вручную':'не удалось открыть выбор'); });
}

function agentFlash(roleId, btn){
  var aid=((document.getElementById('ag_aid')||{}).value||'').trim();
  var msg=document.getElementById('ag_msg');
  if(!aid||aid.indexOf('agent_')!==0){ if(msg)msg.innerHTML='⚠ Вставь корректный ID копии агента (начинается с <code>agent_</code>).'; return; }
  if(btn)btn.disabled=true;
  if(msg)msg.innerHTML=INF(28)+' Прошиваю роль и подключаю сервисы в агента… (до минуты)';
  skBridge('etb_run_expert','etb_expert_result',{name:'agent_flash_role',params:{agent_id:aid,role_id:roleId}}, 300000).then(function(r){
    if(btn)btn.disabled=false;
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    if(out&&out.status==='success'){
      var o=agGi(); o[roleId]=aid; agSi(o);
      var svc=(out.services?(' + '+out.services+' сервисов'):'');
      if(msg)msg.innerHTML='✓ Готово! Твой агент теперь — «'+esc(out.name||roleId)+'»'+svc+'. Открой его в чате Extella и дай задачу: он умеет запрашивать курсы, погоду, перевод и т.д.';
      setTimeout(function(){var ov=document.getElementById('ag_ov');if(ov)ov.remove();renderAgents();},2600);
    } else if(msg){ msg.innerHTML='⚠ '+esc((out&&out.message)||'не удалось прошить'); }
  }).catch(function(e){ if(btn)btn.disabled=false; if(msg)msg.innerHTML='⚠ '+esc((e&&e.message==='_timeout_')?'нет ответа от устройства, попробуй ещё раз':((e&&e.message)||'ошибка')); });
}

var MCPX_KEY='extella_mcp_connected';

// btn.disabled на новой копии сбрасывается → повтор клика слал новый mcp_connect
// (у Гульжан — серия дублей в логах). Держим состояние по id, не по кнопке.
var _mcpConnecting={};
function mcpConnectRun(id, btn){
  var c=(_mcpReg||[]).filter(function(x){return x.id===id;})[0];
  if(!c||!c.run)return;
  if(_mcpConnecting[id]){ return; }   // уже подключаю этот сервер — второй клик игнор
  _mcpConnecting[id]=1;

  // «<span class=inf>…» на карточке (баг у Гульжан).
  if(btn){btn.disabled=true;btn.innerHTML=INF(20)+' подключаю…';}
  skBridge('etb_run_expert','etb_expert_result',{name:'mcp_connect',params:{server_id:c.id,pkg_type:c.run.type,pkg:c.run.pkg,title:c.title||''}}, 300000).then(function(r){
    _mcpConnecting[id]=0;
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}

    }
  }).catch(function(e){ _mcpConnecting[id]=0; if(btn){btn.disabled=false;btn.innerHTML='Подключить';} alert('Не удалось подключить: '+((e&&e.message==='_timeout_')?'долгая установка (первый запуск качает пакет) — попробуй ещё раз':(e&&e.message)||'ошибка')); });
}

// Первый build — без name (предложение). Стабильный ws_id даёт повторная сборка с name (wsRebuild).
function wsDoBuild(btn,folderArg,nameArg){
  var folder=folderArg||((document.getElementById('ws_folder')||{}).value||'').trim();
  var msg=document.getElementById('ws_msg');
  if(!folder){ if(msg)msg.innerHTML='⚠ Выбери папку проекта.'; return; }
  if(btn)btn.disabled=true;
  if(msg)msg.innerHTML=INF(28)+' Читаю имена файлов и понимаю проект… (~30–45с)';
  var g=document.getElementById('grid'); if(g&&_wsView!=='cockpit'){ g.innerHTML=wsSkeleton(); }
  var params={folder:folder}; if(nameArg)params.name=nameArg;
  var startMs=Date.now();
  wsCall('build',params,180000).then(function(out){
    // Сразу вернулся готовый воркспейс (синхронно)
    if(out&&out.workspace){ if(btn)btn.disabled=false; wsBuildDone(out.workspace); return; }
    // build — ОТЛОЖЕННАЯ задача (движок возвращает task_id, мост не поллит).
    // Явную ошибку (не про deferred) показываем; иначе поллим синхронный list, пока не появится воркспейс по папке.
    var s=(typeof out==='string')?out:((out&&out.message)||'');
    if(s && !/defer|task_id|500|timeout/i.test(s) && !(out&&out.task_id)){
      if(btn)btn.disabled=false; if(msg)msg.innerHTML='⚠ '+esc(String(s).slice(0,300)); return;
    }
    wsBuildPoll(folder, startMs, msg, btn, 0);
  }).catch(function(e){
    // таймаут моста ≠ провал — сборка идёт, поллим список
    wsBuildPoll(folder, startMs, msg, btn, 0);
  });
}
// Готово: закрыть модалку, открыть кокпит.
function wsBuildDone(ws){
  var o=document.getElementById('ws_ov'); if(o)o.remove();
  _wsList=null; _wsCur=ws; _wsView='cockpit'; wsRenderWs(ws);
}
// Поллинг синхронного list, пока воркспейс по папке не появится (свежий, updated≥старта).
function wsBuildPoll(folder, startMs, msg, btn, tries){
  if(msg)msg.innerHTML=INF(28)+' Собираю воркспейс… компьютер понимает проект (~30–45с)';
  if(tries>24){ // ~75с
    if(btn)btn.disabled=false;
    if(msg)msg.innerHTML='▶ Сборка идёт дольше обычного. Загляни в список через минуту.';
    _wsList=null; if(cur==='workspace'&&_wsView!=='cockpit')renderWorkspace(); return;
  }
  var norm=folder.replace(/\/+$/,'');
  setTimeout(function(){
    wsCall('list',{},20000).then(function(out){
      var wss=(out&&out.workspaces)||[];
      var m=wss.filter(function(w){
        if((w.folder||'').replace(/\/+$/,'')!==norm) return false;
        var t=w.updated?new Date(w.updated).getTime():0;
        return t>=startMs-8000; // именно свежесобранный (а не старый по этой же папке)
      })[0];
      if(m){ if(btn)btn.disabled=false; var o=document.getElementById('ws_ov'); if(o)o.remove(); wsOpen(m.ws_id); return; }
      wsBuildPoll(folder, startMs, msg, btn, tries+1);
    }).catch(function(){ wsBuildPoll(folder, startMs, msg, btn, tries+1); });
  }, 3000);
}

function wsxAnswer(btn,key,scope,qid){

  if(box){ if(box.tagName==='INPUT')val=box.value.trim(); else val=[].slice.call(box.querySelectorAll('.wx-chip.on')).map(function(c){return c.textContent;}).join(', '); }
  if(!val){ wsToast('Выбери вариант или впиши ответ'); return; }

    else { if(btn)btn.disabled=false; wsToast('⚠ '+esc((out&&out.message)||'не удалось'),'err'); }

}
function wsxChat(form,wid){
  var inp=document.getElementById('wsx_chat'); var v=(inp&&inp.value||'').trim();

    // движок может ВЕРНУТЬ ВОПРОС (не знает факта) → он лёг в инбокс; перечитываем и ведём к «Обзору»
    if(out&&out.clarify){
      wsToast('Воркспейс уточняет: '+esc(out.question||out.need||'нужен ответ')+' — ответь в «Обзоре»','ok');

      return;
    }
    if(out&&(out.note||out.queued||out.kind)){
      wsToast('✓ '+esc(out.note||'готово')+(out.advanced?' · закрыл «'+esc(out.advanced)+'»':'')+(out.task_next?' · дальше: '+esc(out.task_next):''),'ok');

// «↻ Обновить»: локальный сборщик активности (Popen через эксперт-лаунчер) → перечитать get.
function wsRefreshCurated(ws_id){
  var b=document.getElementById('ws_refbtn'); if(b){ b.disabled=true; b.textContent='↻ Обновляю…'; }
  wsToast('Собираю свежую активность из git/файлов…');
  var before=(_wsCur&&_wsCur.contours&&_wsCur.contours[0]&&_wsCur.contours[0].refreshed)||'';
  skBridge('etb_run_expert','etb_expert_result',{name:'wz_ws_refresh',params:{ws_id:ws_id}},120000)
    .then(function(){ wsRefreshPoll(ws_id, before, 0); })
    .catch(function(){ wsRefreshPoll(ws_id, before, 0); });  // deferred/timeout — всё равно поллим get
}
function wsRefreshPoll(ws_id, before, tries){
  var b=document.getElementById('ws_refbtn');
  if(tries>16){ if(b){ b.disabled=false; b.textContent='↻ Обновить'; } wsToast('Обновление идёт дольше обычного — попробуй ещё раз через минуту.'); return; }
  setTimeout(function(){
    wsCall('get',{ws_id:ws_id},20000).then(function(out){
      var w=out&&out.workspace;
      var now=(w&&w.contours&&w.contours[0]&&w.contours[0].refreshed)||'';
      if(w&&now&&now!==before){ _wsCur=w; wsRenderCurated(w); wsToast('✓ Активность обновлена','ok'); return; }
      wsRefreshPoll(ws_id, before, tries+1);
    }).catch(function(){ wsRefreshPoll(ws_id, before, tries+1); });
  }, 3000);
}
function wsPlural(n){ n=n%100; if(n>=11&&n<=14)return'ов'; n=n%10; if(n===1)return''; if(n>=2&&n<=4)return'а'; return'ов'; }

function wsToast(msg,kind){
  // Пустое сообщение раньше рисовало чёрную полосу-плашку без текста (жалоба
  // Анвара). Нечего показать — прячем тост, а не пустую подложку.
  var s=(msg==null?'':String(msg)); if(!s.replace(/<[^>]*>/g,'').trim()){ var e=document.getElementById('ws_toast'); if(e)e.style.opacity='0'; return; }
  var t=document.getElementById('ws_toast'); if(!t){ t=document.createElement('div'); t.id='ws_toast'; document.body.appendChild(t); }
  t.className='ws_toast'+(kind?(' '+kind):''); t.innerHTML=s; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(function(){ t.style.opacity='0'; },3200);
}

var BUILDER_ID='agent_FLYxB0v1qIY2phB5beVP5';  // спец-сборщик (есть не у всех) — теперь только запасной
function skRunAgent(msg){
  // Портируемость: сначала агент СЕССИИ пользователя (есть у каждого),
  // BUILDER_ID — только как запасной, если сессионный недоступен

      if(!second) throw e;

    });
}

// ── Детерминированный Композитор ────────────────────────────────────────────
// «Опиши задачу» для программ и моделей выполняется БЕЗ агента: витрина сама
// ищет лучший живой источник (GitHub / работающий HF-спейс) и сама кладёт
// карточку на полку через мост KV. Мгновенно, без кредитов, воспроизводимо.
// Живой тест показал: агент НЕ пишет в KV (нет инструментов) — путь через
// него был пустышкой. Агент остаётся для навыков и как фолбэк.
// Канонические термины для частых задач (из матрицы спроса): надёжнее перевода.
var _B_CANON=[
  [/озвуч|текст.*голос|голос.*текст/i,'text to speech'],
  [/расшифров|распознаван.*реч|транскри/i,'speech to text'],
  [/удален.*фон|вырез.*фон|убрать фон/i,'background removal'],
  [/апскейл|увелич.*(фото|картин|изображ)|качество фото/i,'image upscaling'],
  [/генерац.*(картин|изображ)|картинк.*по (тексту|описанию)/i,'text to image'],
  [/скачат.*(видео|ютуб)|youtube/i,'youtube video downloader'],
  [/суммариз|краткое содержан|пересказ/i,'text summarization'],
  [/распознаван.*(текст|скан|документ)|\bocr\b/i,'ocr document'],
  [/сжат.*(pdf|пдф)/i,'pdf compression'],
  [/перевод|переводчик/i,'translation']
];
function _bCanonical(q){
  for(var i=0;i<_B_CANON.length;i++){ if(_B_CANON[i][0].test(q)) return _B_CANON[i][1]; }
  return null;
}
// Русский запрос → английский для поиска (бесплатный API, без ключей).
function _bTranslate(q){
  if(!/[а-яёА-ЯЁ]/.test(q)) return Promise.resolve(q);
  return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=ru|en')
    .then(function(r){return r.json();})
    .then(function(d){ var t=d&&d.responseData&&d.responseData.translatedText; return (t&&t.length<120)?t:q; })
    .catch(function(){ return q; });
}
function _bSimplify(q){
  return q.replace(/[-–—]/g,' ')
          .replace(/\b(of|the|a|an|in|on|with|for|by|to|from|your|my|via|using)\b/gi,' ')
          .replace(/\s+/g,' ').trim();
}
function _bTryQueries(q0, finder){
  var canon=_bCanonical(q0);
  if(canon) return finder(canon).catch(function(){ return _bTranslate(q0).then(finder); });
  return _bTranslate(q0).then(function(q){
    var tries=[q]; var sq=_bSimplify(q); if(sq && sq!==q) tries.push(sq);
    var chain=Promise.reject();
    tries.forEach(function(t){ chain=chain.catch(function(){ return finder(t); }); });
    return chain;
  });
}
function _bFindProgram(q0){ return _bTryQueries(q0, function(q){return _bFindProgramEn(q,q0);}); }
function _bFindProgramEn(q,originalQuery){
  // Без sort=stars: GitHub возвращает best match. Сортировка только по звёздам
  // поднимала популярные, но нерелевантные учебные репозитории.
  return fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(q)+'+stars:%3E50&per_page=10',
      {headers:{'Accept':'application/vnd.github+json'}})
    .then(function(r){return r.json();})
    .then(function(d){
      var it=((d&&d.items)||[]).filter(function(r){return !r.archived && !r.fork && r.description;})[0];
      if(!it) throw new Error('на GitHub не нашлось живого открытого инструмента');
      var stars=it.stargazers_count>=1000 ? (Math.round(it.stargazers_count/100)/10+'k') : String(it.stargazers_count);
      return { repoUrl: it.html_url, title: it.name,
        facts: [ 'Подходит для задачи: «'+String(originalQuery||q).slice(0,90)+'». Перед установкой Extella проверит репозиторий.' ],
        repoDescription: (it.description||'').slice(0,180), requestedByUser:true,
        source: 'github.com/'+it.owner.login+' · ★ '+stars, acc:'#2F6B66', label:'С GitHub' };
    });
}
function _bFindModel(q0){ return _bTryQueries(q0, _bFindModelEn); }
function _bFindModelEn(q){
  return fetch('https://huggingface.co/api/spaces?search='+encodeURIComponent(q)+'&limit=20&full=true')
    .then(function(r){return r.json();})
    .then(function(list){
      var top=(list||[]).sort(function(a,b){return (b.likes||0)-(a.likes||0);}).slice(0,8);
      var chain=Promise.reject();
      top.forEach(function(sp){
        chain=chain.catch(function(){
          return fetch('https://huggingface.co/api/spaces/'+sp.id).then(function(r){return r.json();}).then(function(d){
            if(((d&&d.runtime)||{}).stage!=='RUNNING') throw 0;
            return sp;
          });
        });
      });
      return chain.catch(function(){ throw new Error('живого работающего спейса под задачу не нашлось'); });
    })
    .then(function(sp){
      return { hfId: sp.id, title: (sp.id.split('/')[1]||sp.id).replace(/[-_]/g,' '),
        facts: [ 'Найдено по запросу: '+q ],
        source: 'huggingface.co/'+sp.id.split('/')[0]+' · ♥ '+(sp.likes||0), acc:'#2E7D5B', label:'Работает' };
    });
}
function _bAddToShelf(kvKey, entry, matchField){
  return skKvGet(kvKey).catch(function(){return null;}).then(function(cur){
    if(!cur || typeof cur!=='object') cur={v:1,shelf:[]};
    if(!cur.shelf) cur.shelf=[];
    var dupAt=-1; cur.shelf.some(function(x,i){if(x&&x[matchField]===entry[matchField]){dupAt=i;return true;}return false;});
    var dup=dupAt>=0;
    if(dup) cur.shelf[dupAt]=Object.assign({},cur.shelf[dupAt],entry);
    else cur.shelf.unshift(entry);
    return skKvSet(kvKey, cur).then(function(){return {entry:entry, dup:dup};});
  });
}
function _bDeterministic(kind, q){
  if(kind==='programs') return _bFindProgram(q).then(function(e){return _bAddToShelf('_mkt_programs',e,'repoUrl');});
  if(kind==='models')   return _bFindModel(q).then(function(e){return _bAddToShelf('_mkt_models',e,'hfId');});
  return Promise.reject(new Error('nodet'));
}

function _focusCatalogCard(key){
  if(!key)return;
  var tries=0, timer=setInterval(function(){
    tries++;
    var card=null;
    [].some.call(document.querySelectorAll('.stile[data-card-key]'),function(el){
      if(el.getAttribute('data-card-key')===key){card=el;return true;} return false;
    });
    if(card){
      clearInterval(timer); card.classList.add('catalog_added');
      try{card.scrollIntoView({block:'center',behavior:'smooth'});}catch(_){card.scrollIntoView();}
      if(typeof wsToast==='function')wsToast('Программа найдена. Нажми «Установить» на выделенной карточке.','ok');
      setTimeout(function(){card.classList.remove('catalog_added');},5000);
    }else if(tries>=32)clearInterval(timer);
  },250);
}

      rb.onclick=function(){cfg.refresh();ov.style.display='none';};

// Гард одной установки на инструмент: карточка перерисовывается, btn.disabled
// сбрасывается → повтор клика слал новый resolver (у Гульжан — ghostscript ×6
// в логах, brew запускался параллельно). Держим состояние по tool, не по кнопке.
var _cliInstalling={};
// Установка инструмента = ставим программу + сразу оборачиваем в блок Композитора
// + вносим в каталог, ОДНИМ вызовом /x/cap_install моста Конструктора (тот же путь,
// что app_wrap для приложений). Так пред-раскладывать 68 cap_-обёрток на каждый
// аккаунт больше не нужно — чистый аккаунт клиента, появляется только установленное.
function installCLI(tool,btn){
  if(_cliInstalling[tool]){ return; }   // уже ставлю этот инструмент — второй клик игнор
  _cliInstalling[tool]=1;
  if(btn){btn.disabled=true;btn.textContent='Ставлю…';}
  var catMap={}; (typeof cliCatalog==='function'?cliCatalog():[]).forEach(function(c){catMap[c.id]=c;});
  var c=catMap[tool]||{}; var title=c.name||tool, desc=c.desc||'';
  _mkbFetch('/x/cap_install',{kind:'cli',install_ref:tool,title:title,desc:desc},600000).then(function(out){
    _cliInstalling[tool]=0;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    var st=out&&out.status;
    if(st==='success'||st==='already'||st==='installed'){
      cliMarkInstalled(tool);
      if(cur==='cli'){ renderCLI(); }         // перерисовать: карточка станет «установлено»
      else if(btn){ btn.textContent='Готово ✓'; btn.style.opacity='.7'; }
      if(out&&out.expert) wsToast('Инструмент готов — стал блоком Композитора','ok');
      return;
    }
    if(!btn)return;
    if(st==='installing'){ btn.disabled=false; btn.textContent='Ещё ставится…'; btn.title=(out&&out.message)||''; return; }
    btn.disabled=false;btn.textContent='Повторить';btn.title=(out&&out.message)||'не удалось поставить';
  }).catch(function(e){
    _cliInstalling[tool]=0;
    // Мост Конструктора спит / Конструктор не установлен — честно, без сырого сбоя.
    if(btn){btn.disabled=false;btn.textContent='Ещё раз';btn.title='Конструктор недоступен — открой его на столе, он поднимет мост, и повтори';}
    wsToast('Не удалось поставить инструмент: открой Конструктор (он поднимет мост) и попробуй ещё раз','err');
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────
// Вернуть раздел, где человек был до того, как хост переинжектил тулбар.
// ВАЖНО: до setMode('all') — он вызывает первую отрисовку сетки.
(function(){
  try{
    var st=_navRestore();
    if(st){ cur=st.cur; _navY=st.y||0; }
    var sc=document.querySelector('.scr');
    if(!sc) return;
    sc.addEventListener('scroll', _navSaveScroll);
    if(!_navY) return;
    // Контент приезжает асинхронно, поэтому прокрутку возвращаем мягко:
    // пробуем, пока список не дорастёт, и сдаёмся через ~3с.
    var tries=0;
    var t=setInterval(function(){
      tries++;
      if(sc.scrollHeight > _navY + sc.clientHeight){ sc.scrollTop=_navY; clearInterval(t); }
      else if(tries>12) clearInterval(t);
    },250);
  }catch(_){}
})();

renderTopics();
doSearch();
_ensureCapInst();   // прогрев «Из интернета · Композитор» (KV _mkt_installed) — счётчик «Мои» честный сразу
// Префетч живых каталогов на старте (параллельно, идемпотентно) → вкладки открываются
// мгновенно из кэша, без задержки KV-round-trip при первом клике.
try { _ensureProg(); } catch (e) {}
try { _ensureMod(); } catch (e) {}
try { _ensureAuto(); } catch (e) {}
// Навыки и Инструменты грузили каталог только по клику (мелькали «песочные часы»,
// которых нет на других вкладках) — теперь тоже прогреваем на старте, для единообразия.
try { if(!_cliLoaded){ skKvGet('_mkt_cli_catalog').then(function(r){ _cliReg=(r&&r.items)?r.items:[]; _cliLoaded=true; if(cur==='cli')renderCLI(); }).catch(function(){ _cliReg=[]; _cliLoaded=true; }); } } catch (e) {}
try { if(!_skLoaded){ Promise.all([
    skKvGet('_mkt_skills').then(function(r){_skReg=(r&&r.items)?r:{v:1,items:[]};if(!_skReg.items)_skReg.items=[];}).catch(function(){_skReg={v:1,items:[]};}),
    _loadSharded('_mkt_skills_catalog','items').then(function(r){_skCatReg=(r&&r.items&&r.items.length)?r:null;}).catch(function(){_skCatReg=null;})
  ]).then(function(){_skLoaded=true;if(cur==='skills')renderSkillsShelf();}); } } catch (e) {}

// Tell the toolbar we're booted and listening, it (re)sends the cloud merch
// hero/collections. This pull handshake removes the open()-time push race where
// the payload could arrive before this document attached its message listener.
try { window.parent.postMessage({ type: 'etb_ready' }, '*'); } catch (e) {}
</script>
