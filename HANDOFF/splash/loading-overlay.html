<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity 200ms cubic-bezier(0.16,1,0.3,1)}
  body.hiding{opacity:0}
  video{width:150px;height:auto}
</style>
</head>
<body>
  <video autoplay loop muted playsinline src="./splash.mp4"></video>
  <script>
    window.loadingOverlay.onThemeChanged((theme) => {
      document.documentElement.setAttribute('data-theme', theme);
    });
    window.loadingOverlay.onHide(() => {
      document.body.classList.add('hiding');
    });
  </script>
</body>
</html>
