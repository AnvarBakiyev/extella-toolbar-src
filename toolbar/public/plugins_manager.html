<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extella Plugins</title>
<style>
:root{
  --a:#C67E34;--ar:198,126,52;--amber:#E8A85C;
  --bg:#0A0A0B;--s1:#161618;--s2:#161618;--s3:#1E1E21;--s4:#26262a;
  --bd:rgba(243,238,229,.09);--bd2:rgba(243,238,229,.18);
  --tx:#F3EEE5;--tx2:#C9C3B8;--tx3:#98938A;--r:14px;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --serif:"New York",ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
[data-lm]{
  --amber:#A96617;
  --bg:#F2F2F7;--s1:#FFFFFF;--s2:#FFFFFF;--s3:#F5F4F1;--s4:#ebeae6;
  --bd:rgba(20,20,18,.09);--bd2:rgba(20,20,18,.2);
  --tx:#141412;--tx2:#3E3B35;--tx3:#7A756B;
  --shadow:0 10px 30px rgba(20,20,18,.10)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── Header ─────────────────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 18px;
  background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--a);
  box-shadow:0 0 10px rgba(var(--ar),.5);flex-shrink:0}
.lnm{font-size:14px;font-weight:700;letter-spacing:-.02em}
.sp{flex:1}
.bclose{background:none;border:none;color:var(--tx2);cursor:pointer;
  font-size:16px;padding:4px 8px;border-radius:6px;transition:all .15s;flex-shrink:0}
.bclose:hover{color:var(--tx);background:var(--s3)}

/* ── Tabs ────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:1px;padding:6px 18px;background:var(--s1);
  border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;
  color:var(--tx2);background:transparent;border:none;white-space:nowrap;transition:all .15s;
  display:flex;align-items:center;gap:4px}
.tab:hover{color:var(--tx);background:var(--s3)}
.tab.on{color:var(--a);background:rgba(var(--ar),.1);font-weight:600}
.tab_skills{margin-left:6px;color:#fff;background:var(--a);font-weight:600}
.tab_skills:hover{color:#fff;background:var(--a);opacity:.9}
.tn{font-size:9.5px;opacity:.5}

/* ── Filter bar ──────────────────────────────────────────────────────── */
#filter_bar{background:var(--s1);border-bottom:1px solid var(--bd);
  padding:10px 18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.fb_row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb_srch{flex:1;min-width:160px;position:relative}
.fb_sinp{width:100%;background:var(--s3);border:1px solid var(--bd2);border-radius:9px;
  color:var(--tx);font-size:12px;padding:7px 32px 7px 11px;outline:none;
  transition:border-color .15s,box-shadow .15s;font-family:inherit}
.fb_sinp:focus{border-color:rgba(var(--ar),.4);box-shadow:0 0 0 3px rgba(var(--ar),.1)}
.fb_sinp::placeholder{color:var(--tx3)}
.fb_sico{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--tx3);pointer-events:none}
.fb_sel{background:var(--s3);border:1px solid var(--bd2);border-radius:8px;
  color:var(--tx);font-size:11.5px;padding:6px 9px;outline:none;cursor:pointer;
  font-family:inherit;transition:border-color .15s}
.fb_sel:focus{border-color:rgba(var(--ar),.4)}

/* ── Topic chips ─────────────────────────────────────────────────────── */
.fb_topics{display:flex;gap:5px;flex-wrap:wrap}
.tpchip{background:var(--s3);border:1px solid var(--bd2);border-radius:6px;
  color:var(--tx2);font-size:11px;font-weight:500;padding:4px 10px;cursor:pointer;
  transition:all .14s;white-space:nowrap}
.tpchip:hover{color:var(--tx)}
.tpchip.on{background:rgba(var(--ar),.12);color:var(--a);
  border-color:rgba(var(--ar),.3)!important;font-weight:600}

/* ── Scroll area ─────────────────────────────────────────────────────── */
.scr{flex:1;overflow-y:auto;padding:14px 18px 28px;
  scrollbar-width:thin;scrollbar-color:var(--s4) transparent}
.scr::-webkit-scrollbar{width:3px}
.scr::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

/* ── Command bar: the store's main entry — paste a link, get a plugin ── */
/* segmented toggle + theme button (from the storefront concept) */
.seg{display:flex;gap:2px;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:3px}
.seg button{border:none;background:transparent;color:var(--tx3);font:600 12.5px var(--sans);padding:6px 15px;border-radius:16px;cursor:pointer}
.seg button.on{background:rgba(var(--ar),.16);color:var(--amber)}
.iconbtn{border:1px solid var(--bd);background:var(--s2);color:var(--tx);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0}
.iconbtn:hover{border-color:var(--bd2)}

.cmdbar{display:flex;gap:10px;padding:18px 18px 6px;background:var(--s1);flex-shrink:0}
.cmdbar input{flex:1;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;
  padding:16px 18px;font:500 14.5px var(--sans);color:var(--tx);outline:none;min-width:0;box-shadow:var(--shadow)}
.cmdbar input::placeholder{color:var(--tx3)}
.cmdbar input:focus{border-color:rgba(var(--ar),.55)}
.cmdgo{border:none;border-radius:14px;background:var(--a);color:#fff;font:800 14px var(--sans);padding:0 26px;cursor:pointer;flex-shrink:0}
.cmdgo:hover{filter:brightness(1.1)}

/* ── Card: accent-tinted gradient fill + accent top spine ─────────────── */
.rcard{position:relative;border:1px solid var(--bd);border-radius:var(--r);
  background:linear-gradient(157deg,
    color-mix(in srgb, var(--acc,var(--a)) 6%, var(--s2)) 0%,
    var(--s2) 40%);
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  transition:border-color .14s,box-shadow .14s,transform .14s;animation:fiu .18s ease both}
.rcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:2;
  background:linear-gradient(90deg,var(--acc,var(--a)),color-mix(in srgb,var(--acc,var(--a)) 30%,transparent) 85%)}
/* composed cover: avatar + owner + name — quiet panel + spine (the concept's price-tag) */
.rcv{display:flex;align-items:center;gap:11px;margin:-14px -16px 0;padding:14px 16px 12px;
  background:var(--s3);border-bottom:1px solid var(--bd);position:relative}
.rcv_av{width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
.rcv_t{min-width:0}
.rcv_org{font:700 9.5px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--tx2);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcv_nm{font-size:15px;font-weight:750;color:var(--tx);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc_type{position:absolute;top:11px;right:10px;font:700 8.5px ui-monospace,Menlo,monospace;
  letter-spacing:.1em;text-transform:uppercase;color:var(--a);
  border:1px solid rgba(var(--ar),.4);border-radius:5px;padding:2px 6px}

/* ── Merch hero: the story slot, fed from the cloud (_mkt_merch) ──────── */
.mhero{grid-column:1/-1;position:relative;overflow:hidden;border:1px solid var(--bd);
  border-radius:var(--r);padding:24px 28px;
  background:linear-gradient(157deg,
    color-mix(in srgb, var(--acc,var(--a)) 12%, var(--s2)) 0%,
    var(--s2) 62%);
  display:flex;flex-direction:column;gap:9px;animation:fiu .18s ease both}
.mhero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--acc,var(--a)),color-mix(in srgb,var(--acc,var(--a)) 30%,transparent) 85%)}
.mh_promo{align-self:flex-start;font:700 9.5px ui-monospace,Menlo,monospace;letter-spacing:.12em;
  color:#fff;background:var(--a);border-radius:5px;padding:3px 9px;text-transform:uppercase}
.mh_src{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase}
.mh_title{font:600 24px/1.22 ui-serif,Georgia,serif;color:var(--tx);max-width:34ch;letter-spacing:0}
.mh_title i{font-style:italic;color:var(--a)}
.mh_facts{list-style:none;display:flex;flex-direction:column;gap:4px;margin:2px 0;padding:0}
.mh_facts li{font-size:13.5px;font-weight:500;color:var(--tx);opacity:.85;line-height:1.45;
  padding-left:20px;position:relative}
.mh_facts li::before{content:"→";position:absolute;left:0;color:var(--a);font-weight:700}
.mh_row{display:flex;align-items:center;gap:14px;margin-top:4px}

/* ── Hero carousel: rotating banners (heroes[]) ───────────────────────── */
.mhero-car{grid-column:1/-1;position:relative}
.mhero-car .mhslide{display:none}
.mhero-car .mhslide.on{display:block}
.mhdots{display:flex;gap:6px;justify-content:center;margin-top:11px}
.mhdot{width:7px;height:7px;padding:0;border:none;border-radius:50%;background:var(--bd2);
  cursor:pointer;transition:width .2s,background .2s}
.mhdot.on{background:var(--a);width:18px;border-radius:4px}

/* ── "Свежее и крутое": the living tile shelf (shelf[]) ───────────────── */
.mshelf{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.mshelf_capped .stile:nth-child(n+49){display:none}
.stile{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:8px;
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--acc,var(--a)) 4%,var(--s2)) 0%,var(--s2) 50%);
  transition:border-color .15s,box-shadow .15s,transform .15s;animation:fiu .18s ease both}
.stile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--acc,var(--a)),color-mix(in srgb,var(--acc,var(--a)) 25%,transparent) 90%)}
.stile:hover{border-color:var(--bd2);box-shadow:0 12px 32px rgba(0,0,0,.5);transform:translateY(-3px)}
[data-lm] .stile:hover{box-shadow:0 8px 24px rgba(0,0,0,.12)}
.st_chip{align-self:flex-start;font:700 9px ui-monospace,Menlo,monospace;letter-spacing:.08em;
  color:#fff;background:var(--acc,var(--a));border-radius:5px;padding:3px 8px;text-transform:uppercase}
.st_title{font:600 18px/1.32 ui-serif,Georgia,serif;color:var(--tx);letter-spacing:-.3px;margin-top:2px;text-wrap:balance}
.st_title i{font-style:italic;color:var(--acc,var(--a))}
.st_fact{font-size:13px;color:var(--tx2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st_src{font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;color:var(--tx3);
  text-transform:uppercase;margin-top:auto}
.st_foot{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st_btn{background:var(--acc,var(--a));color:#fff;border:none;border-radius:6px;
  font-size:12px;font-weight:600;padding:7px 15px;cursor:pointer;transition:all .15s;outline:none}
.st_btn:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 4px 12px rgba(var(--ar),.3)}
.st_btn:active{transform:translateY(0);box-shadow:0 2px 6px rgba(var(--ar),.2)}
.st_btn:focus{box-shadow:0 0 0 3px rgba(var(--ar),.2)}

/* ══ Bento hero (from the approved storefront concept) ══════════════════ */
.bento{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:206px;gap:14px}
.ccard{position:relative;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
.ccard:hover{transform:translateY(-3px);border-color:var(--bd2);box-shadow:var(--shadow)}
.ccard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:3;
  background:linear-gradient(90deg,var(--acc,var(--a)) 0%,color-mix(in srgb,var(--acc,var(--a)) 30%,transparent) 85%)}
.chero{grid-column:span 2;grid-row:span 2;
  background:radial-gradient(340px 200px at 85% 8%,color-mix(in srgb,var(--acc,#4E8FDB) 13%,transparent),transparent 70%),var(--s2)}
.splats{position:absolute;inset:0;pointer-events:none;opacity:.32;background:
  radial-gradient(4px 4px at 78% 16%,var(--acc,#4E8FDB) 50%,transparent 51%),
  radial-gradient(3px 3px at 86% 30%,#D65CA8 50%,transparent 51%),
  radial-gradient(5px 5px at 68% 22%,#E8A85C 50%,transparent 51%),
  radial-gradient(3px 3px at 90% 52%,#57A773 50%,transparent 51%),
  radial-gradient(4px 4px at 74% 40%,#5B8DEF 50%,transparent 51%),
  radial-gradient(2px 2px at 82% 62%,#E8A85C 50%,transparent 51%)}
.hbody{position:relative;margin-top:auto;padding:26px;display:flex;flex-direction:column;gap:10px}
.hsrc{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:var(--tx3);text-transform:uppercase}
.chero h3{font:600 27px/1.18 var(--serif);color:var(--tx);text-wrap:balance;max-width:24ch;letter-spacing:0}
.chero h3 i{font-style:italic;color:var(--amber)}
.cfacts{list-style:none;display:flex;flex-direction:column;gap:5px;margin:0;padding:0}
.cfacts li{font-size:14px;font-weight:500;color:var(--tx2);line-height:1.45;padding-left:22px;position:relative}
.cfacts li::before{content:"→";position:absolute;left:0;color:var(--amber);font-weight:700}
.hrow{display:flex;align-items:center;gap:14px;margin-top:8px}
.cbtn{border:none;border-radius:10px;background:var(--a);color:#fff;font:800 13.5px var(--sans);padding:11px 24px;cursor:pointer}
.cbtn:hover{filter:brightness(1.1)}
.cget{border:1.5px solid var(--a);border-radius:9px;background:transparent;color:var(--amber);font:700 12.5px var(--sans);padding:7px 16px;cursor:pointer}
.cget:hover{background:var(--a);color:#fff}
.cstat{font:12px ui-monospace,Menlo,monospace;color:var(--tx3);font-variant-numeric:tabular-nums}
.cpromo{position:absolute;top:12px;left:12px;font:700 9px ui-monospace,Menlo,monospace;letter-spacing:.12em;
  color:#fff;background:var(--a);border-radius:5px;padding:3px 8px;text-transform:uppercase;z-index:2}
.mini_body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.mini_h{font:600 17px/1.24 var(--serif);color:var(--tx);letter-spacing:0}
.mini_h i{font-style:italic;color:var(--amber)}
.mini_desc{font-size:13px;font-weight:500;color:var(--tx2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini_foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
@media(max-width:900px){.bento{grid-template-columns:1fr 1fr}.chero{grid-column:span 2}}

/* ── Skills shelf (Навыки as an in-store category) ─────────────────────── */
.sk_lead{grid-column:1/-1;font-size:13px;color:var(--tx2);line-height:1.5;margin:-2px 0 8px}
.sk_howto{font-size:11.5px;color:var(--tx);opacity:.9;background:rgba(var(--ar),.07);
  border:1px solid rgba(var(--ar),.15);border-radius:8px;padding:8px 10px;line-height:1.4}
.sk_howto b{color:var(--a)}
.sk_active{font:700 10px ui-monospace,Menlo,monospace;color:#2f9e56;letter-spacing:.04em}
.sk_del{background:transparent;color:var(--tx2);border:1px solid var(--bd2);border-radius:7px;
  font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer}
.sk_del:hover{color:#e0533d;border-color:#e0533d}
/* agent picker modal */
.apick{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.apick.on{display:flex}
.apick_box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:460px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.apick_h{padding:18px 20px 14px;font-size:16px;font-weight:700;border-bottom:1px solid var(--bd)}
.apick_h b{color:var(--a)}
.apick_list{padding:8px;overflow-y:auto}
.apick_row{padding:11px 13px;border-radius:10px;cursor:pointer;transition:background .12s}
.apick_row:hover{background:var(--s3)}
.ap_nm{font-size:14px;font-weight:600;color:var(--tx)}
.ap_sub{font-size:12px;color:var(--tx3);margin-top:2px}
.ap_sec{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:14px 13px 6px}
.ap_load{padding:14px 13px;font-size:13px;color:var(--tx3)}
.apick_foot{padding:10px 16px 14px;display:flex;justify-content:flex-end;border-top:1px solid var(--bd)}

/* ── Merch collections: editorial banner cards, cloud-managed ─────────── */
.mcoll{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--s2);padding:16px;display:flex;flex-direction:column;gap:8px;animation:fiu .18s ease both}
.mcoll::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--acc,var(--a)),color-mix(in srgb,var(--acc,var(--a)) 30%,transparent) 85%)}
.mc_eye{font:700 9.5px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--a);text-transform:uppercase}
.mc_title{font:600 19px/1.25 var(--serif);color:var(--tx)}
.mc_desc{font-size:12.5px;font-weight:500;color:var(--tx);opacity:.75;line-height:1.45}
.mc_items{display:flex;flex-direction:column;margin-top:2px}
.mci{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd)}
.mci_nm{flex:1;font-size:12.5px;font-weight:650;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mci_btn{border:1px solid rgba(var(--ar),.5);border-radius:7px;background:transparent;color:var(--a);
  font:700 11px -apple-system,sans-serif;padding:4px 12px;cursor:pointer;flex-shrink:0}
.mci_btn:hover{background:var(--a);color:#fff}
/* промо-ярлык на карточке каталога (слот из облачной выкладки) */
.rc_promochip{font:700 8.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#fff;
  background:var(--a);border-radius:4px;padding:2.5px 7px;text-transform:uppercase;flex-shrink:0}
.rcard:hover{border-color:var(--bd2);box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(-2px)}
[data-lm] .rcard:hover{box-shadow:0 8px 22px rgba(0,0,0,.12)}
.rcard.inst{border-color:rgba(var(--ar),.3)}
.rc_top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rc_repo{min-width:0}
.rc_owner{font-size:10.5px;color:var(--tx2);margin-bottom:2px}
.rc_name{font-size:13px;font-weight:700;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.rc_stars{display:flex;align-items:center;gap:3px;flex-shrink:0;
  font-size:11.5px;font-weight:700;color:#f59e0b;white-space:nowrap}
.rc_desc{font-size:13.5px;font-weight:500;color:var(--tx);opacity:.82;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc_meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:18px}
.rc_pill{background:rgba(var(--ar),.08);color:var(--a);border:1px solid rgba(var(--ar),.14);
  border-radius:4px;font-size:9.5px;font-weight:600;padding:2px 7px;white-space:nowrap}
.rc_dot{color:var(--tx3);font-size:10px}
.rc_info{font-size:10.5px;color:var(--tx2)}
.rc_foot{display:flex;align-items:center;justify-content:flex-end;margin-top:2px}
.rc_btn{background:var(--a);color:#000;border:none;border-radius:8px;
  font-size:11.5px;font-weight:800;padding:7px 18px;cursor:pointer;
  transition:opacity .12s,transform .1s;white-space:nowrap}
.rc_btn:hover{opacity:.85;transform:translateY(-1px)}
.rc_btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.rc_btn.done{background:rgba(var(--ar),.1);color:var(--a);
  border:1px solid rgba(var(--ar),.25);cursor:default}
.rc_btn.done:hover{opacity:1;transform:none}

/* ── Skeleton ────────────────────────────────────────────────────────── */
.skel{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);
  height:140px;overflow:hidden;position:relative}
.skel::after{content:'';position:absolute;inset:0;

  background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.04) 50%,transparent 100%);
  background-size:200% 100%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Banners ─────────────────────────────────────────────────────────── */

.total_hint{grid-column:1/-1;font-size:11px;color:var(--tx3);padding:2px 0 4px}

.load_more_btn{background:var(--s3);border:1px solid var(--bd2);border-radius:9px;

/* ── Installed plugin cards — vertical layout: title / desc / actions ─── */
.icard{position:relative;overflow:hidden;

.icard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:1;
  background:linear-gradient(90deg,var(--acc,var(--a)),color-mix(in srgb,var(--acc,var(--a)) 25%,transparent) 90%)}
.icard:hover{border-color:rgba(var(--ar),.3);box-shadow:0 10px 28px rgba(0,0,0,.42);transform:translateY(-2px)}
[data-lm] .icard:hover{box-shadow:0 8px 20px rgba(0,0,0,.1)}
.idot{grid-area:dot;width:8px;height:8px;border-radius:50%;background:var(--a);

.iinfo{grid-area:info;min-width:0}
.iname{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:-.01em;line-height:1.3;

.isub{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.5;font-weight:500;

.ibtn_open{background:rgba(var(--ar),.12);color:var(--a);border:1px solid rgba(var(--ar),.22);
  border-radius:7px;font-size:11.5px;font-weight:700;padding:6px 15px;cursor:pointer;
  transition:all .15s;white-space:nowrap;outline:none}
.ibtn_open:hover{background:rgba(var(--ar),.22);border-color:rgba(var(--ar),.32);box-shadow:0 2px 8px rgba(var(--ar),.15)}
.ibtn_open:active{transform:translateY(-1px);box-shadow:0 1px 4px rgba(var(--ar),.1)}
.ibtn_open:focus{box-shadow:0 0 0 3px rgba(var(--ar),.15)}
.ibtn_rm{background:transparent;border:1px solid var(--bd2);color:var(--tx2);

.ibtn_rm:hover{border-color:#f87171;color:#f87171;background:rgba(248,113,113,.06)}

/* ── Section headers (Featured / Other) ──────────────────────────────── */
.sect_hdr{grid-column:1/-1;display:flex;align-items:center;gap:8px;

/* ── Category chips (business aisles, concept .tchip pill) ───────────── */
.cat_tabs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 10px}
.cat_tab{background:transparent;border:1px solid var(--bd2);border-radius:20px;

@keyframes fiu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>
// ── Plugin data injected by build.js ──────────────────────────────────────
/* __BUILTIN_PLUGINS_DATA__ */
if (typeof BUILTIN_PLUGINS_DATA === 'undefined') { var BUILTIN_PLUGINS_DATA = []; }

// ── Constants ─────────────────────────────────────────────────────────────
var INSTALLED_KEY = 'etb_plugins_installed_v1';
var CUSTOM_KEY    = 'etb_plugins_custom_v1';
var CACHE_KEY     = 'etb_gh_cache_v1';
var CACHE_TTL     = 1800000; // 30 minutes
var CACHE_MAX     = 50;
var GH_API        = 'https://api.github.com/search/repositories';

var HF_CACHE_KEY  = 'etb_hf_cache_v1';
var HF_API_BASE   = 'https://huggingface.co/api';
var HF_LIMIT      = 24;

var GH_TOPICS = [
  {id:'machine-learning', l:'AI / ML'},
  {id:'deep-learning',    l:'Deep Learning'},
  {id:'web',              l:'Web'},
  {id:'database',         l:'Database'},
  {id:'cli',              l:'CLI'},
  {id:'devops',           l:'DevOps'},
  {id:'security',         l:'Security'},
  {id:'data-science',     l:'Data Science'},
  {id:'mobile',           l:'Mobile'},
  {id:'api',              l:'API'},
  {id:'testing',          l:'Testing'},
  {id:'game',             l:'Games'},
  {id:'frontend',         l:'Frontend'},
  {id:'backend',          l:'Backend'}
];

// ── UI state ──────────────────────────────────────────────────────────────
var cur = 'home';
var ghState = {
  query: '', topic: '', sort: 'stars',
  language: '', minStars: '100', updatedAfter: '',
  license: '', page: 1, results: [], total: 0,
  loading: false, error: null, debTimer: null
};

var hfState = {
  kind: 'space', query: '', sort: 'downloads',
  sdk: '', pipeline: '', page: 0,
  results: [], total: 0, loading: false,
  error: null, debTimer: null, inited: false
};

// ── Featured category filter state ────────────────────────────────────────
// Business aisles (from the storefront concept) — the shelves a non-technical
// buyer thinks in. Plugins are mapped onto them heuristically by bizCategory().
var CAT_TABS = [
  { id: 'all',        l: 'Всё' },
  { id: 'docs',       l: 'Документы' },
  { id: 'sales',      l: 'Продажи и клиенты' },
  { id: 'content',    l: 'Контент' },
  { id: 'data',       l: 'Данные и отчёты' },
  { id: 'automation', l: 'Автоматизация' }
];
var _featCat = 'all';
var _instCat = 'all';
var _featSearch = '';

var KNOWN_CATS = {};
CAT_TABS.forEach(function(ct) { KNOWN_CATS[ct.id] = true; });

// ── Other section collapsed state ─────────────────────────────────────────
var OTHER_COLLAPSED_KEY = 'etb_other_collapsed';
var _otherCollapsed = (function() {
  try {
    var saved = localStorage.getItem(OTHER_COLLAPSED_KEY);
    if (saved === null) return true; // collapsed by default on first visit
    return saved === '1';
  } catch(_) { return true; }
})();

// ── Theme ─────────────────────────────────────────────────────────────────
function _resolveHostTheme() {
  var t;
  try { t = localStorage.getItem('color-theme'); } catch (_) {}
  if (t === 'light' || t === 'dark') return t;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  } catch (_) {}
  return 'dark';
}
function ith(forced) {
  var t = forced || _resolveHostTheme();
  if (t === 'light') document.documentElement.setAttribute('data-lm','1');
  else document.documentElement.removeAttribute('data-lm');
}
ith();
window.addEventListener('storage', function(e) {
  if (e.key === 'color-theme' || e.key === 'ext_theme' || e.key === 'eth6') ith();
});
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'etb_theme') ith(e.data.theme);
});

// ── Cache helpers ─────────────────────────────────────────────────────────
function mkCacheKey(s) {
  return [
    s.query  || '_',
    s.topic  ? 't:'+s.topic    : '',
    s.language ? 'l:'+s.language : '',
    'st:'+s.minStars,
    s.updatedAfter ? 'u:'+s.updatedAfter : '',
    s.license ? 'li:'+s.license : '',
    'so:'+s.sort,
    'p:'+s.page
  ].filter(Boolean).join('|');
}

function getCached(key) {
  try {
    var store = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    var entry = store[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > CACHE_TTL) {
      delete store[key];
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(store)); } catch(_) {}
      return null;
    }
    return entry;
  } catch(_) { return null; }
}

function setCached(key, results, total) {
  try {
    var store = {};
    try { store = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(_) {}
    store[key] = { ts: Date.now(), results: results, total: total };
    var keys = Object.keys(store);
    if (keys.length > CACHE_MAX) {
      keys.sort(function(a,b){ return (store[a].ts||0) - (store[b].ts||0); });
      keys.slice(0, keys.length - (CACHE_MAX - 10)).forEach(function(k){ delete store[k]; });
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(store));
  } catch(_) {}
}

// ── HF cache helpers ──────────────────────────────────────────────────────
function mkHFCacheKey(s) {
  return [
    s.kind || 'space',
    s.query || '_',
    's:' + s.sort,
    s.sdk ? 'sdk:' + s.sdk : '',
    s.pipeline ? 'pip:' + s.pipeline : '',
    'p:' + s.page
  ].filter(Boolean).join('|');
}

function getHFCached(key) {
  try {
    var store = JSON.parse(localStorage.getItem(HF_CACHE_KEY) || '{}');
    var entry = store[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > CACHE_TTL) {
      delete store[key];
      try { localStorage.setItem(HF_CACHE_KEY, JSON.stringify(store)); } catch(_) {}
      return null;
    }
    return entry;
  } catch(_) { return null; }
}

function setHFCached(key, results, total) {
  try {
    var store = {};
    try { store = JSON.parse(localStorage.getItem(HF_CACHE_KEY) || '{}'); } catch(_) {}
    store[key] = { ts: Date.now(), results: results, total: total };
    var keys = Object.keys(store);
    if (keys.length > CACHE_MAX) {
      keys.sort(function(a,b){ return (store[a].ts||0) - (store[b].ts||0); });
      keys.slice(0, keys.length - (CACHE_MAX - 10)).forEach(function(k){ delete store[k]; });
    }
    localStorage.setItem(HF_CACHE_KEY, JSON.stringify(store));
  } catch(_) {}
}

// ── Date helpers ──────────────────────────────────────────────────────────
function updAfterFromKey(key) {
  if (!key) return '';
  var d = new Date();
  switch(key) {
    case '1mo':  d.setMonth(d.getMonth()-1);          break;
    case '3mo':  d.setMonth(d.getMonth()-3);          break;
    case '6mo':  d.setMonth(d.getMonth()-6);          break;
    case '1yr':  d.setFullYear(d.getFullYear()-1);    break;
    default:     return '';
  }
  return d.toISOString().slice(0,10);
}

function timeSince(ds) {
  try {
    var d = Math.floor((Date.now() - new Date(ds).getTime()) / 86400000);
    if (d < 1)   return 'today';
    if (d < 7)   return d+'d ago';
    if (d < 30)  return Math.floor(d/7)+'w ago';
    if (d < 365) return Math.floor(d/30)+'mo ago';
    return Math.floor(d/365)+'yr ago';
  } catch(_) { return ''; }
}

function fmtN(n) {
  n = n || 0;
  if (n >= 1000) return (n/1000).toFixed(1).replace('.0','')+'k';
  return String(n);
}

// ── GitHub search ─────────────────────────────────────────────────────────
function buildGHQuery(s) {
  var p = [];
  if (s.query) p.push(s.query);
  // Hard quality filters (always applied)
  p.push('archived:false');
  p.push('is:public');
  // User-configurable filters (with hard minimums)
  p.push('stars:>=' + (parseInt(s.minStars) || 10));
  p.push('pushed:>' + (s.updatedAfter || '2022-01-01'));
  if (s.language) p.push('language:' + s.language);
  if (s.topic)    p.push('topic:' + s.topic);
  if (s.license)  p.push('license:' + s.license);
  return p.join(' ');
}

function cancelDebounce() {
  if (ghState.debTimer) { clearTimeout(ghState.debTimer); ghState.debTimer = null; }
}

function doSearch() {
  ghState.query        = (document.getElementById('gh_q')       || {}).value || '';
  ghState.sort         = (document.getElementById('gh_sort')    || {}).value || 'stars';
  ghState.language     = (document.getElementById('gh_lang')    || {}).value || '';
  ghState.minStars     = (document.getElementById('gh_stars')   || {}).value || '100';
  ghState.license      = (document.getElementById('gh_license') || {}).value || '';
  var updKey           = (document.getElementById('gh_updated') || {}).value || '';
  ghState.updatedAfter = updAfterFromKey(updKey);
  // Skip API call if user typed only 1 character — too few to be useful and
  // the immediate re-render causes focus loss before they finish typing.
  if (ghState.query.length === 1) return;
  searchGitHub(false);
}

function onFChange(immediate) {
  cancelDebounce();
  ghState.debTimer = setTimeout(doSearch, immediate ? 0 : 800);
}

function searchGitHub(loadMore) {
  if (ghState.loading) return;
  cancelDebounce();

  if (!loadMore) {
    ghState.page    = 1;
    ghState.results = [];
    ghState.total   = 0;
    ghState.error   = null;
  }

  // Wrap renderGrid() so that #gh_q retains focus and cursor position after
  // each DOM rebuild. _rescueFilterBar + syncFilterBar move the filter_bar
  // element in the DOM which causes browsers to drop focus; we restore it here.
  function _renderKeepFocus() {
    var inp = document.getElementById('gh_q');
    var hadFocus = inp && document.activeElement === inp;
    var sel0 = hadFocus ? inp.selectionStart : null;
    var sel1 = hadFocus ? inp.selectionEnd   : null;
    renderGrid();
    if (hadFocus) {
      inp = document.getElementById('gh_q');
      if (inp) {
        inp.focus();
        if (sel0 !== null) { try { inp.setSelectionRange(sel0, sel1); } catch(_) {} }
      }
    }
  }

  var ckey   = mkCacheKey(ghState);
  var cached = getCached(ckey);
  if (cached) {
    if (loadMore) {
      ghState.results = ghState.results.concat(cached.results);
    } else {
      ghState.results = cached.results;
      ghState.total   = cached.total || 0;
    }
    _renderKeepFocus();
    return;
  }

  ghState.loading = true;
  _renderKeepFocus(); // show skeletons

  var q    = buildGHQuery(ghState);
  var url  = GH_API + '?q=' + encodeURIComponent(q) +
             '&sort=' + ghState.sort + '&order=desc&per_page=30&page=' + ghState.page;
  var hdrs = { 'Accept': 'application/vnd.github.v3+json' };
  try {
    var tok = localStorage.getItem('etb_github_token');
    if (tok) hdrs['Authorization'] = 'token ' + tok;
  } catch(_) {}

  fetch(url, { headers: hdrs })
    .then(function(r) {
      if (r.status === 403 || r.status === 429) {
        ghState.error = 'rate_limit';
        return null;
      }
      if (!r.ok) { ghState.error = 'network'; return null; }
      return r.json();
    })
    .then(function(data) {
      ghState.loading = false;
      if (!data) { _renderKeepFocus(); return; }
      var items = data.items || [];
      setCached(ckey, items, data.total_count || 0);
      if (loadMore) {
        ghState.results = ghState.results.concat(items);
      } else {
        ghState.results = items;
        ghState.total   = data.total_count || 0;
      }
      _renderKeepFocus();
    })
    .catch(function() {
      ghState.loading = false;
      ghState.error   = 'network';
      _renderKeepFocus();
    });
}

// ── Category helpers (shared by Featured + Installed) ─────────────────────
// Map a plugin onto a business aisle. Keyword-first (name/tagline/description/
// pills/category), then a fallback from the old tech category. Fuzzy on purpose
// — the goal is a shop a non-technical buyer can browse, not perfect taxonomy.
function normalizeCategory(p) {
  var hay = ((p.name || '') + ' ' + (p.tagline || '') + ' ' + (p.description || '') +
    ' ' + ((p.pills || []).join(' ')) + ' ' + (p.category || '')).toLowerCase();
  if (/\bpdf\b|docx|\bdoc\b|word|excel|xlsx|\bocr\b|\bfile\b|документ|скан|расшифров|транскрип/.test(hay)) return 'docs';
  if (/\bcrm\b|sales|lead|proposal|invoice|\bclient|customer|продаж|клиент|счёт-фактур|коммерческ|заявк/.test(hay)) return 'sales';
  if (/chart|\bdata\b|analytic|report|dashboard|\btable\b|график|отчёт|данн|аналит|метрик|калькул|расчёт/.test(hay)) return 'data';
  if (/writ|content|blog|social|\bpost\b|caption|\bseo\b|design|\bimage\b|контент|текст|соцсет|дизайн|перевод|письм|рассылк/.test(hay)) return 'content';
  if (/\bapi\b|webhook|automat|workflow|script|integrat|\bcli\b|devops|автоматиз|интеграц|скрипт|пайплайн/.test(hay)) return 'automation';
  var t = (p.category || 'other');
  if (t === 'utilities' || t === 'developer' || t === 'web') return 'automation';
  if (t === 'data' || t === 'calculators') return 'data';
  if (t === 'text' || t === 'ai-life' || t === 'ai-work') return 'content';
  return 'automation';
}

function buildCatCounts(plugins) {
  var counts = {};
  plugins.forEach(function(p) {
    var c = normalizeCategory(p);
    counts[c] = (counts[c] || 0) + 1;
  });
  return counts;
}

function buildCatTabs(countsMap, activeCat, setterName) {
  return '<div class="cat_tabs">' +
    CAT_TABS.filter(function(ct) {
      return ct.id === 'all' || countsMap[ct.id];
    }).map(function(ct) {
      return '<button class="cat_tab' + (activeCat === ct.id ? ' active' : '') +
        '" onclick="' + setterName + '(\'' + ct.id + '\')">' + esc(ct.l) + '</button>';
    }).join('') +
  '</div>';
}

function filterByCategory(plugins, catId) {
  if (catId === 'all') return plugins;
  return plugins.filter(function(p) { return normalizeCategory(p) === catId; });
}

function _rescueFilterBar() {
  var fb = document.getElementById('filter_bar');
  var stash = document.getElementById('filter_stash');
  if (fb && stash && fb.parentNode !== stash) stash.appendChild(fb);
}

function syncFilterBar() {
  var fb = document.getElementById('filter_bar');
  var stash = document.getElementById('filter_stash');
  var slot = document.getElementById('other_filter_slot');
  if (!fb || !stash) return;
  var show = cur === 'programs' && !_otherCollapsed;
  if (show && slot) {
    slot.appendChild(fb);
    fb.style.display = '';
  } else {
    stash.appendChild(fb);
    fb.style.display = 'none';
  }
}

function _rescueHFFilterBar() {
  var fb = document.getElementById('hf_filter_bar');
  var stash = document.getElementById('hf_filter_stash');
  if (fb && stash && fb.parentNode !== stash) stash.appendChild(fb);
}

  var fb = document.getElementById('hf_filter_bar');
  var stash = document.getElementById('hf_filter_stash');

function installLocalModel(model, btn){
  if(btn){btn.disabled=true;btn.textContent=_t('lmInstalling');}
  skBridge('etb_run_expert','etb_expert_result',{name:'cap_localmodel_install',params:{model:model}})
    .then(function(r){
      var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
      if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
      var st=out&&out.status;
      if(!btn)return;
      if(st==='already'||st==='installed'){btn.textContent=_t('lmDone');btn.style.opacity='.7';}
      else if(st==='pulling'){btn.disabled=false;btn.textContent=_t('lmPulling');btn.title=(out&&out.message)||'';}
      else {btn.disabled=false;btn.textContent=_t('lmRetry');btn.title=(out&&out.message)||'';}
    })
    .catch(function(e){ if(btn){btn.disabled=false;btn.textContent=_t('lmPulling');btn.title='';} });
}

function getFeatured() {
  var pro = document.body.getAttribute('data-mode') === 'pro';
  var all = BUILTIN_PLUGINS_DATA.filter(function(p) { return p.featured; });
  if (!pro) {
    all = all.filter(function(p) { return CURATED_PROGRAMS[p.id]; })
             .map(function(p) { var o = CURATED_PROGRAMS[p.id]; return Object.assign({}, p, { name:o.name, tagline:o.tagline, _biz:o.biz }); });
  }
  if (_featCat !== 'all') all = all.filter(function(p) { return normalizeCategory(p) === _featCat; });
  var q = _featSearch.trim().toLowerCase();
  if (q) {
    all = all.filter(function(p) {
      return (p.name    || '').toLowerCase().indexOf(q) !== -1 ||
             (p.tagline || '').toLowerCase().indexOf(q) !== -1 ||
             (p.description || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  return all;
}

      : '<button class="st_btn" onclick="installFeatured(\'' + esc(p.id) + '\',this)">+ Установить</button>';

// Catalogue — grouped by business aisle into coloured sections (same schema as
// Навыки). No filter chips: the aisles ARE the sections you scroll.
function renderFeaturedSection() {
  var featured = getFeatured();
  var promos = (window._merch && window._merch.promos) || [];
  if (promos.length) {
    featured = featured.slice().sort(function (a, b) {
      return (promos.indexOf(b.id) >= 0 ? 1 : 0) - (promos.indexOf(a.id) >= 0 ? 1 : 0);
    });
  }
  var _pro = document.body.getAttribute('data-mode') === 'pro';
  var html = '<div class="sect"><span class="eyebrow">' + (_pro ? 'Каталог' : 'Полезное для дела') + '</span><h2>' + (_pro ? 'Все программы <i>по полкам</i>' : 'Готовые помощники <i>для работы и жизни</i>') + '</h2></div>';
  if (!_pro) html += '<div class="sk_lead" style="grid-column:1/-1">Готовые помощники с человеческими описаниями — по категориям. Техно-утилиты и dev-инструменты — в «Для профи» вверху.</div>';
  if (featuredError) html += '<div class="banner err">⚠ Установка не удалась: ' + esc(featuredError) + '</div>';
  if (!featured.length) {
    html += '<div class="empty" style="grid-column:1/-1;padding:28px 20px"><div class="eico">🔍</div><p>Ничего не найдено.</p></div>';
    return html;
  }
  (_pro ? BIZ_ORDER : BIZ_ORDER_ALL).forEach(function (cat) {
    var items = featured.filter(function (p) { return (p._biz || normalizeCategory(p)) === cat; });
    if (!items.length) return;
    html += '<div class="sect_hdr"><span class="sect_title">' + esc(BIZ_LABEL[cat]) + '</span><span class="sect_line"></span></div>' +
      '<div class="mshelf">' + items.map(programCard).join('') + '</div>';
  });
  return html;
}

function _bentoHTML(heroes) {
  if (!heroes || !heroes.length) return '';
  var html = '<div class="bento">' + _heroBig(heroes[0]);
  heroes.slice(1, 3).forEach(function (h) { html += _heroMini(h); });
  return html + '</div>';
}
function _tileHTML(h, i, label) {
  var fact = (h.facts && h.facts[0]) ? '<div class="st_fact">' + esc(h.facts[0]) + '</div>' : '';
  return '<div class="stile" style="--acc:' + esc(h.acc || '#C67E34') + ';animation-delay:' + Math.min(i * 30, 240) + 'ms">' +
    '<span class="st_chip">' + esc(label || h.label || 'Свежак') + '</span>' +
    '<div class="st_title">' + esc(h.title || '') + (h.accent ? ' <i>' + esc(h.accent) + '</i>' : '') + '</div>' +
    fact + (h.source ? '<div class="st_src">' + esc(h.source) + '</div>' : '') +
    '<div class="st_foot">' + _cardBtn(h, 'st_btn') + '</div>' +
  '</div>';
}
// Категоризированный каталог по секциям (как Навыки): группирует карточки функцией
// catFn в разделы order/labels, рисует полностью. chip — единая подпись карточек.
function catalogByCatHTML(cards, catFn, order, labels, acc, eyebrow, title, lead, chip) {
  if (!cards || !cards.length) return '';
  var groups = {};
  cards.forEach(function (c) { var k = catFn(c); (groups[k] = groups[k] || []).push(c); });
  var html = '<div class="sect"><span class="eyebrow">' + esc(eyebrow) + '</span><h2>' + title + '</h2></div>';
  if (lead) html += '<div class="sk_lead" style="grid-column:1/-1">' + lead + '</div>';
  order.forEach(function (k) {
    var items = groups[k]; if (!items || !items.length) return;
    var tiles = items.map(function (c, i) { return _tileHTML(Object.assign({}, c, { acc: acc[k] || c.acc }), i, chip); }).join('');
    html += '<div class="sect_hdr"><span class="sect_title">' + esc(labels[k]) + '</span><span class="sect_line"></span></div>' +
      '<div class="mshelf">' + tiles + '</div>';
  });
  return html;
}
function _shelfHTML(shelf, eyebrow, title) {
  if (!shelf || !shelf.length) return '';
  var CAPV = 48;
  var capped = shelf.length > CAPV;
  var sid = 'sh_' + Math.random().toString(36).slice(2, 8);
  var tiles = shelf.map(function (h, i) { return _tileHTML(h, i); }).join('');
  var more = capped ? '<div class="showmore" style="grid-column:1/-1;text-align:center;margin:8px 0 4px">' +
      '<button onclick="var e=document.getElementById(\'' + sid + '\');if(e)e.classList.remove(\'mshelf_capped\');this.parentNode.style.display=\'none\'" ' +
      'style="border:1px solid var(--bd2);background:transparent;color:var(--tx2);border-radius:9px;padding:6px 18px;font-size:12px;cursor:pointer">Показать все ' + shelf.length + ' →</button></div>' : '';
  return '<div class="sect"><span class="eyebrow">' + esc(eyebrow) + '</span><h2>' + title + '</h2></div>' +
    '<div class="mshelf' + (capped ? ' mshelf_capped' : '') + '" id="' + sid + '">' + tiles + '</div>' + more;
}

// Show slide idx; toggles slide + dot. Called by dots and the auto-rotate
// timer. Reads the carousel fresh from the DOM so it survives grid re-renders.
function setHeroSlide(idx) {
  var car = document.getElementById('mhero_car');
  if (!car) return;
  var slides = car.querySelectorAll('.mhslide');
  var dots = car.querySelectorAll('.mhdot');
  if (!slides.length) return;
  idx = ((idx % slides.length) + slides.length) % slides.length;
  for (var i = 0; i < slides.length; i++) slides[i].classList.toggle('on', i === idx);
  for (var j = 0; j < dots.length; j++) dots[j].classList.toggle('on', j === idx);
  car.dataset.idx = idx;
}

function renderMerchShelf() {

  var tiles = m.shelf.map(function (h, i) {

// Collections: banner cards with up to 3 inline items each. Items reference
// featured plugins by id or external repos by URL — both install in place.
function renderMerchCollections() {
  var m = window._merch;
  if (!m || !m.collections || !m.collections.length) return '';
  var inst = gi();
  return m.collections.slice(0, 3).map(function (c, ci) {
    var items = (c.items || []).slice(0, 3).map(function (it) {
      var nm = '', act = '';
      if (it.id) {
        var p = null;
        for (var i = 0; i < BUILTIN_PLUGINS_DATA.length; i++) {
          if (BUILTIN_PLUGINS_DATA[i].id === it.id) { p = BUILTIN_PLUGINS_DATA[i]; break; }
        }
        if (!p) return '';
        nm = p.name;
        act = inst.indexOf(it.id) >= 0
          ? '<button class="mci_btn" onclick="notify(\'open\',\'' + esc(it.id) + '\')">Open</button>'
          : '<button class="mci_btn" onclick="installFeatured(\'' + esc(it.id) + '\',this)">+ Install</button>';
      } else if (it.repoUrl) {
        nm = it.name || it.repoUrl.split('/').slice(-1)[0];
        act = '<button class="mci_btn" onclick="installRepo(\'' + esc(it.repoUrl) + '\',this)">+ Install</button>';
      } else { return ''; }
      return '<div class="mci"><span class="mci_nm">' + esc(nm) + '</span>' + act + '</div>';
    }).join('');
    return '<div class="mcoll" style="--acc:' + esc(c.acc || '#C67E34') + ';animation-delay:' + (ci * 40) + 'ms">' +
      (c.eyebrow ? '<div class="mc_eye">' + esc(c.eyebrow) + '</div>' : '') +

      (c.desc ? '<div class="mc_desc">' + esc(c.desc) + '</div>' : '') +
      '<div class="mc_items">' + items + '</div>' +
    '</div>';
  }).join('');
}

// ── Функциональные категории каталогов (репо + модели) — как разделы Навыков ──
// Категорию проставляет Qwen в харвестере (поле cat) — надёжнее ключевых слов на
// коротких англ. названиях. Ниже — keyword-ФОЛБЭК (без кириллического \b: в JS он ASCII).
var REPO_ORDER=['agents','dev','data','web','search','comm','finance','media','other'];
var REPO_LABEL={agents:'Автоматизация и агенты',dev:'Разработка',data:'Данные и аналитика',web:'Браузер и веб',search:'Поиск и знания',comm:'Общение и работа',finance:'Финансы и бизнес',media:'Медиа и контент',other:'Другие инструменты'};
var REPO_ACC={agents:'#57A773',dev:'#8E4AA8',data:'#3A6EA5',web:'#C67E34',search:'#2E7D5B',comm:'#B5423E',finance:'#2E7D5B',media:'#DC3E3E',other:'#6B7280'};
function repoCat(c){
  if(c.cat&&REPO_LABEL[c.cat])return c.cat;   // категория от харвестера (Qwen)
  var s=((c.title||'')+' '+((c.facts||[])[0]||'')).toLowerCase();
  if(/финанс|financ|бухгалт|invoic|платёж|payment|банк|bank|трейд|trading|бирж|erp|crm/.test(s))return 'finance';
  if(/браузер|browser|скрейп|scrap|crawl|chrome|сайт|html|парс/.test(s))return 'web';
  if(/данн|база|databas|sql|таблиц|sheet|аналит|отчёт|метрик|dataset|вектор|граф|dashboard|дашборд/.test(s))return 'data';
  if(/код|разработ|program|git|github|docker|kubernetes|api|sdk|debug|дебаг|ide|devops|linter|компил|деплой|deploy/.test(s))return 'dev';
  if(/поиск|search|документаци|знан|rag|память|memory|контекст|context|индекс|embedding|wiki/.test(s))return 'search';
  if(/чат|chat|сообщ|slack|discord|telegram|whatsapp|почт|mail|email|календар|calendar|голос|voice|звонк|созвон/.test(s))return 'comm';
  if(/изображ|image|видео|video|картин|фото|дизайн|design|музык|music|аудио|audio|медиа|контент|генерац/.test(s))return 'media';
  if(/агент|agent|automat|автоматиз|workflow|процесс|оркестр|orchestr|пайплайн|n8n|assistant|ассистент|бот|инструмент|mcp|proxy|router|inspector|сервер/.test(s))return 'agents';
  return 'other';
}
var MODEL_ORDER=['imggen','imgedit','avatar','video','audio','text','code','threed','other'];
var MODEL_LABEL={imggen:'Генерация картинок',imgedit:'Редактирование фото',avatar:'Аватары и примерка',video:'Видео и анимация',audio:'Звук и музыка',text:'Текст и чат',code:'Код и приложения',threed:'3D',other:'Другое'};
var MODEL_ACC={imggen:'#8E4AA8',imgedit:'#C67E34',avatar:'#DC3E3E',video:'#B5423E',audio:'#2E7D5B',text:'#3A6EA5',code:'#57A773',threed:'#8E4AA8',other:'#6B7280'};
function modelCat(c){
  if(c.cat&&MODEL_LABEL[c.cat])return c.cat;
  var s=((c.title||'')+' '+((c.facts||[])[0]||'')).toLowerCase();
  if(/видео|video|анимац|animat|движени|motion|talking/.test(s))return 'video';

  if(/аватар|avatar|try-on|примерк|virtual try|лицо|лица|лице|face|портрет|selfie|headshot/.test(s))return 'avatar';
  if(/редактир|восстанов|улучш|deblur|denois|enhance|upscale|inpaint|реставрац|колоризац|remove|удал/.test(s))return 'imgedit';
  if(/звук|музык|music|аудио|audio|голос|voice|речь|speech|tts|песн|song|sound|whisper|диалог/.test(s))return 'audio';
  if(/код|code|coding|приложени|vibe|deepsite/.test(s))return 'code';

  return 'other';
}

  // inside #grid when Other is expanded; innerHTML replacement destroys it.
  _rescueFilterBar();

  var g = document.getElementById('grid');
  if (!g) return;

  var featuredHtml = _progSearchHTML() + programsSpotlight() + addTileHTML('programs','Добавить программу') + renderFeaturedSection() + progToolsHTML();

  // «Для всех» — curated only: no raw GitHub firehose.
  if (document.body.getAttribute('data-mode') !== 'pro') {
    g.innerHTML = featuredHtml;
    syncFilterBar();
    return;
  }

  var arrow = _otherCollapsed ? '▶' : '▼';
  var otherHdr = '<div class="sect_hdr">' +
    '<span class="sect_title">Other</span>' +
    '<button class="sect_toggle" onclick="_toggleOther()" title="' + (_otherCollapsed ? 'Expand' : 'Collapse') + ' GitHub results">' +
      arrow +
    '</button>' +
    '<span class="sect_line"></span></div>';

  if (_otherCollapsed) {
    g.innerHTML = featuredHtml + otherHdr;
    syncFilterBar();
    return;
  }

  var filterSlot = '<div id="other_filter_slot" class="other_filters"></div>';

  if (ghState.loading) {
    var sk = '';
    for (var i = 0; i < 6; i++) sk += '<div class="skel"></div>';
    g.innerHTML = featuredHtml + otherHdr + filterSlot + sk;
    syncFilterBar();
    return;
  }

  if (ghState.error) {
    var msg = ghState.error === 'rate_limit'
      ? '⏱ Rate limit reached. Wait a minute and try again.'
      : '⚡ Could not reach GitHub. Check your connection and try again.';
    g.innerHTML = featuredHtml + otherHdr + filterSlot +
      '<div class="banner ' + (ghState.error === 'rate_limit' ? 'warn' : 'err') + '">' +
      esc(msg) + '</div>';
    syncFilterBar();
    return;
  }

  if (!ghState.results.length) {
    g.innerHTML = featuredHtml + otherHdr + filterSlot +
      '<div class="empty"><div class="eico">🔍</div>' +
      '<p>No repositories found.<br>Try different keywords or filters.</p></div>';
    syncFilterBar();
    return;
  }

  var inst      = gi();
  var customMap = getCustom().reduce(function(m, p) {
    if (p.source) m[p.source] = true;
    return m;
  }, {});

  var html = featuredHtml + otherHdr + filterSlot;
  if (ghState.total > 0) {
    html += '<div class="total_hint">' + fmtN(ghState.total) + ' repositories found</div>';
  }

  ghState.results.forEach(function(r, i) {
    var isInst  = !!(customMap[r.html_url] || inst.indexOf('gh_' + r.full_name.replace('/', '_')) !== -1);
    var topics  = (r.topics || []).slice(0, 3);
    var pills   = topics.map(function(t){ return '<span class="rc_pill">' + esc(t) + '</span>'; }).join('');
    var lang    = r.language ? '<span class="rc_info">' + esc(r.language) + '</span>' : '';
    var lic     = r.license && r.license.spdx_id && r.license.spdx_id !== 'NOASSERTION'
      ? '<span class="rc_info">' + esc(r.license.spdx_id) + '</span>' : '';
    var upd     = r.pushed_at ? '<span class="rc_info">' + timeSince(r.pushed_at) + '</span>' : '';
    var dotSep  = pills ? '<span class="rc_dot">·</span>' : '';
    var metaFull = [lang, lic, upd].filter(Boolean).join('<span class="rc_dot">·</span>');

    var btn = isInst
      ? '<button class="rc_btn done" disabled>✓ Installed</button>'
      : '<button class="rc_btn" onclick="installRepo(\'' + esc(r.html_url) + '\',this)">+ Install</button>';

    var acc = accFor(r.full_name, r.language);
    var av = (r.owner && r.owner.avatar_url) ? r.owner.avatar_url + '&s=96' : '';
    html += '<div class="rcard' + (isInst ? ' inst' : '') +
      '" style="--acc:' + acc + ';animation-delay:' + Math.min(i * 12, 180) + 'ms">' +
      rcCover({ badge: 'Plugin', avatar: av, org: r.full_name.split('/')[0], name: r.name }) +
      (r.description ? '<div class="rc_desc">' + esc(r.description) + '</div>' : '') +
      '<div class="rc_meta"><span class="rc_stars">★ ' + fmtN(r.stargazers_count) + '</span>' +
        ((pills || metaFull) ? dotSep : '') + pills + (pills && metaFull ? dotSep : '') + metaFull + '</div>' +
      '<div class="rc_foot">' + btn + '</div>' +
    '</div>';
  });

  if (ghState.results.length > 0 && ghState.results.length < ghState.total) {
    html += '<div class="load_more"><button class="load_more_btn" onclick="loadMore()">Load more</button></div>';
  }

  g.innerHTML = html;
  syncFilterBar();
}

// ── HuggingFace search ────────────────────────────────────────────────────
function onHFChange(immediate) {
  var qEl = document.getElementById('hf_q');
  var sortEl = document.getElementById('hf_sort');
  var sdkEl = document.getElementById('hf_sdk');
  var pipeEl = document.getElementById('hf_pipeline');
  if (qEl)    hfState.query    = qEl.value;
  if (sortEl) hfState.sort     = sortEl.value;
  if (sdkEl)  hfState.sdk      = sdkEl.style.display !== 'none' ? sdkEl.value : '';
  if (pipeEl) hfState.pipeline = pipeEl.style.display !== 'none' ? pipeEl.value : '';
  hfState.page = 0;

  cancelHFDebounce();
  if (immediate) { searchHF(); return; }
  if (hfState.query.length === 1) return; // avoid premature renders
  hfState.debTimer = setTimeout(searchHF, 600);
}

function cancelHFDebounce() {
  if (hfState.debTimer) { clearTimeout(hfState.debTimer); hfState.debTimer = null; }
}

function setHFKind(kind) {
  hfState.kind = kind;
  hfState.page = 0;
  hfState.results = [];
  // Toggle kind button classes
  var spBtn = document.getElementById('hf_kind_space');
  var mdBtn = document.getElementById('hf_kind_model');
  if (spBtn) spBtn.className = 'hf_kind_btn' + (kind === 'space' ? ' on' : '');
  if (mdBtn) mdBtn.className = 'hf_kind_btn' + (kind === 'model' ? ' on' : '');
  // Show/hide SDK vs pipeline selects
  var sdkSel  = document.getElementById('hf_sdk');
  var pipeSel = document.getElementById('hf_pipeline');
  if (sdkSel)  sdkSel.style.display  = kind === 'space' ? '' : 'none';
  if (pipeSel) pipeSel.style.display = kind === 'model' ? '' : 'none';
  searchHF();
}

function buildHFUrl(s) {
  var kind = s.kind === 'model' ? 'models' : 'spaces';
  var params = ['limit=' + HF_LIMIT, 'full=true'];
  if (s.query) params.push('search=' + encodeURIComponent(s.query));
  params.push('sort=' + encodeURIComponent(s.sort || 'downloads'));
  params.push('direction=-1');
  if (s.kind === 'space' && s.sdk) params.push('sdk=' + encodeURIComponent(s.sdk));
  if (s.kind === 'model' && s.pipeline) params.push('pipeline_tag=' + encodeURIComponent(s.pipeline));
  if (s.page > 0) params.push('p=' + s.page);
  return HF_API_BASE + '/' + kind + '?' + params.join('&');
}

function searchHF(append) {
  if (!append) hfState.results = [];
  var cKey = mkHFCacheKey(hfState);
  var cached = getHFCached(cKey);
  if (cached) {
    if (append) hfState.results = hfState.results.concat(cached.results);
    else hfState.results = cached.results;
    hfState.total = cached.total;
    hfState.loading = false;
    hfState.error = null;
    if (cur === 'models' && document.body.getAttribute('data-mode') === 'pro') renderHFDiscover();
    return;
  }

  hfState.loading = true;
  hfState.error = null;
  if (cur === 'models') renderHFDiscover();

  var url = buildHFUrl(hfState);
  fetch(url, { headers: { Accept: 'application/json' } })
    .then(function(r) {
      if (!r.ok) throw new Error('HF API error ' + r.status);
      // HF returns count in X-Total-Count header for some endpoints
      var total = parseInt(r.headers.get('X-Total-Count') || '0', 10) || 0;
      return r.json().then(function(data) { return { data: data, total: total }; });
    })
    .then(function(result) {
      var items = Array.isArray(result.data) ? result.data : [];
      hfState.total = result.total || items.length;
      setHFCached(cKey, items, hfState.total);
      if (append) hfState.results = hfState.results.concat(items);
      else hfState.results = items;
      hfState.loading = false;
      hfState.error = null;
    })
    .catch(function(e) {
      hfState.loading = false;
      hfState.error = (e && e.message) || 'error';
    })
    .then(function() {
      if (cur === 'models' && document.body.getAttribute('data-mode') === 'pro') {
        _renderHFKeepFocus(function() {
          renderHFDiscover();
          syncHFFilterBar();
        });
      }
    });
}

function loadMoreHF() {
  hfState.page++;
  searchHF(true);
}

// Saves focus/cursor of #hf_q, runs cb (which re-renders the DOM), then restores focus.
function _renderHFKeepFocus(cb) {
  var inp = document.getElementById('hf_q');
  var wasFocused = inp && document.activeElement === inp;
  var ss = inp ? inp.selectionStart : null;
  var se = inp ? inp.selectionEnd   : null;
  if (cb) cb();
  if (wasFocused) {
    var inp2 = document.getElementById('hf_q');
    if (inp2) {
      inp2.focus();
      try { inp2.setSelectionRange(ss, se); } catch(_) {}
    }
  }
}

function _hfSlug(s) {
  return String(s).toLowerCase()
    .replace(/[^a-z0-9_]/g, '_')
    .replace(/__+/g, '_')
    .replace(/^_|_$/g, '')
    .slice(0, 30);
}

function _hfIsInstalled(item) {
  var kind = hfState.kind;
  var id = item.id || item.modelId || '';
  // Must use same formula as contextHF() in install-prompt.js
  var slugId = id.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  var pluginId = 'hf_' + kind + '_' + _hfSlug(slugId);
  var inst = gi();
  if (inst.indexOf(pluginId) !== -1) return true;
  // Also check by source field (set by agent during install)
  var custom = getCustom();
  for (var i = 0; i < custom.length; i++) {
    if (custom[i].source === 'hf:' + kind + ':' + id) return true;
  }
  return false;
}

function renderHFDiscover() {
  var g = document.getElementById('grid');
  if (!g) return;

  // Must rescue before any g.innerHTML assignment to prevent destroying the filter bar
  _rescueHFFilterBar();

  var filterSlot = '<div id="hf_filter_slot"></div>';

  if (hfState.loading && !hfState.results.length) {
    var skels = '';
    for (var si = 0; si < 6; si++) skels += '<div class="skel"></div>';
    g.innerHTML = filterSlot + skels;
    syncHFFilterBar();
    return;
  }

  if (hfState.error) {
    g.innerHTML = filterSlot +
      '<div class="banner err">⚡ Could not reach HuggingFace. Check your connection and try again.</div>';
    syncHFFilterBar();
    return;
  }

  if (!hfState.results.length) {
    g.innerHTML = filterSlot +
      '<div class="empty"><div class="eico">🤗</div>' +
      '<p>No results found.<br>Try different keywords or filters.</p></div>';
    syncHFFilterBar();
    return;
  }

  var html = filterSlot;
  if (hfState.total > 0) {
    html += '<div class="total_hint">' + fmtN(hfState.total) + ' ' +
      (hfState.kind === 'model' ? 'models' : 'spaces') + ' found</div>';
  }

  hfState.results.forEach(function(item, i) {
    html += renderHFCard(item, i);
  });

  if (hfState.results.length > 0 && hfState.results.length < hfState.total) {
    html += '<div class="load_more"><button class="load_more_btn" onclick="loadMoreHF()">Load more</button></div>';
  }

  g.innerHTML = html;
  syncHFFilterBar();
}

// ── Composed covers (approved design) ──────────────────────────────────
// Cards never show raw social-preview images: auto-generated ones are white
// text rectangles that duplicate the title and crop badly. Instead: a quiet
// surface, the item's accent as a thin top spine, avatar + name set in type.
var ACC_PALETTE = ['#C67E34','#4E8FDB','#57A773','#7C5CD6','#D65CA8','#5B8DEF','#DC6E3E'];
var LANG_COLORS = {JavaScript:'#b8a52a',TypeScript:'#3178c6',Python:'#3572A5',Go:'#00ADD8',
  Rust:'#B7683F',Ruby:'#701516',PHP:'#4F5D95',Java:'#b07219',C:'#555555','C++':'#f34b7d',
  'C#':'#178600',Swift:'#F05138',Kotlin:'#7F52FF',Shell:'#6E9E4F',HTML:'#e34c26',CSS:'#563d7c',
  Dockerfile:'#384d54','Jupyter Notebook':'#DA5B0B'};
function accFor(key, lang) {
  if (lang && LANG_COLORS[lang]) return LANG_COLORS[lang];
  var h = 0; key = String(key || '');
  for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return ACC_PALETTE[h % ACC_PALETTE.length];
}
function rcCover(opts) {
  return '<div class="rcv">' +
    (opts.badge ? '<span class="rc_type">' + esc(opts.badge) + '</span>' : '') +
    (opts.avatar ? '<img class="rcv_av" loading="lazy" alt="" src="' + esc(opts.avatar) + '" onerror="this.style.display=\'none\'"/>' : '') +
    '<div class="rcv_t">' +
      (opts.org ? '<div class="rcv_org">' + esc(opts.org) + '</div>' : '') +
      '<div class="rcv_nm">' + esc(opts.name || '') + '</div>' +
    '</div>' +
  '</div>';
}

function renderHFCard(item, i) {
  var kind = hfState.kind;
  var id = item.id || item.modelId || '';
  var author = id.includes('/') ? id.split('/')[0] : (item.author || '');
  var name = id.includes('/') ? id.split('/')[1] : id;
  var desc = item.description || (item.cardData && item.cardData.description) || '';
  var downloads = fmtN(item.downloads || 0);
  var likes = fmtN(item.likes || 0);
  var sdk = item.sdk || (item.cardData && item.cardData.sdk) || '';
  var pipelineTag = item.pipeline_tag || (item.cardData && item.cardData.pipeline_tag) || '';
  var isInst = _hfIsInstalled(item);
  var updStr = item.lastModified ? timeSince(item.lastModified) : '';

  var sdkPill = sdk ? '<span class="rc_pill">' + esc(sdk) + '</span>' : '';
  var pipePill = pipelineTag ? '<span class="rc_pill">' + esc(pipelineTag) + '</span>' : '';
  var pills = kind === 'space' ? sdkPill : pipePill;

  var meta = [
    '<span class="rc_info">♥ ' + likes + '</span>',
    downloads !== '0' ? '<span class="rc_info">↓ ' + downloads + '</span>' : '',
    updStr ? '<span class="rc_info">' + updStr + '</span>' : ''
  ].filter(Boolean).join('<span class="rc_dot">·</span>');

  var btn = isInst
    ? '<button class="rc_btn done" disabled>✓ Installed</button>'
    : '<button class="rc_btn" onclick="installHF(\'' + esc(id) + '\',\'' + esc(kind) + '\',this)">+ Install</button>';

  return '<div class="rcard' + (isInst ? ' inst' : '') +
    '" style="--acc:' + accFor(id) + ';animation-delay:' + Math.min(i * 12, 180) + 'ms">' +
    rcCover({ badge: kind === 'space' ? 'Space' : 'Model', org: author, name: name }) +
    (desc ? '<div class="rc_desc">' + esc(desc.slice(0, 150)) + '</div>' : '') +
    '<div class="rc_meta">' + pills + (pills && meta ? '<span class="rc_dot">·</span>' : '') + meta + '</div>' +
    '<div class="rc_foot">' + btn + '</div>' +
  '</div>';
}

function installHF(id, kind, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Opening…'; }
  notify('hf_add_url', '', 'hf:' + kind + ':' + id);
}

// ── Установлено Композитором/поиском способностей (общий KV _mkt_installed, пишет wz_capability_install) ──
var _capInstReg = null, _capInstFetched = false;
var CAPINST_KIND = {model:'модель', mcp:'MCP-сервер', cli:'CLI', skill:'навык', service:'сервис', api:'API'};
var CAPINST_KIND_EN = {model:'model', mcp:'MCP server', cli:'CLI', skill:'skill', service:'service', api:'API'};
function _ensureCapInst() {
  if (_capInstFetched) return; _capInstFetched = true;
  skKvGet('_mkt_installed').then(function(r){ _capInstReg = (r && r.items) ? r.items : []; rtabs(); if (cur === 'mine') renderInstalled(); })
    .catch(function(){ _capInstReg = _capInstReg || []; if (cur === 'mine') renderInstalled(); });
}
function capInstCount(){ return (_capInstReg && _capInstReg.length) || 0; }
function capInstRefresh(){ _capInstReg = null; _capInstFetched = false; _ensureCapInst(); }
function _capInstDropRecord(kind, id){
  // запись из «Мои» (локальный реестр + общий KV)
  _capInstReg = (_capInstReg || []).filter(function(it){ return !(it.kind === kind && it.id === id); });
  rtabs(); if (cur === 'mine') renderInstalled();
  skKvGet('_mkt_installed').then(function(r){
    var cat = (r && r.items) ? r : {items: []};
    cat.items = (cat.items || []).filter(function(it){ return !(it.kind === kind && it.id === id); });
    return skKvSet('_mkt_installed', cat);
  }).catch(function(){ capInstRefresh(); });   // KV не записался — честно перечитываем (карточка вернётся)
}
function capInstRemove(kind, id, method){
  var en = (typeof LANG !== 'undefined' && LANG === 'en');
  var device = (kind === 'model' || kind === 'mcp' || method === 'brew' || method === 'ollama' || method === 'mcp_connect');
  var what = kind === 'model' ? (en ? 'The model will be DELETED from this device (frees space; re-downloadable).' : 'Модель будет УДАЛЕНА с устройства (освободит место; скачать можно заново).')
    : kind === 'mcp' ? (en ? 'The MCP server will be disconnected (removed from the device allowlist).' : 'MCP-сервер будет отключён (вычищен из аллоулиста устройства).')
    : method === 'brew' ? (en ? 'The tool will be uninstalled from this device (brew uninstall).' : 'Инструмент будет удалён с устройства (brew uninstall).')
    : (en ? 'The entry will be removed from My.' : 'Запись будет убрана из «Мои».');
  if (!confirm((en ? 'Remove "' : 'Удалить «') + id + (en ? '"?\n\n' : '»?\n\n') + what)) return;
  if (!device) { _capInstDropRecord(kind, id); return; }
  // сначала РЕАЛЬНО удаляем с устройства; запись трём только после успеха — без свалки и без вранья
  skBridge('etb_run_expert', 'etb_expert_result',
           { name: 'wz_capability_uninstall', params: { kind: kind, ref: id, method: method || '' } }, 180000)
    .then(function(r){
      var out = r.res; if (out && typeof out === 'object' && (out.result || out.output)) out = out.result || out.output;
      if (typeof out === 'string') { try { out = JSON.parse(out); } catch(e){} }
      if (out && out.device_removed) { _capInstDropRecord(kind, id); }
      else { alert((en ? 'Not removed: ' : 'Не удалилось: ') + ((out && out.message) || 'error')); }
    })
    .catch(function(e){
      alert((en ? 'Not removed: ' : 'Не удалилось: ') + ((e && e.message === '_timeout_') ? (en ? 'timed out — check later' : 'долго выполняется — проверь позже') : ((e && e.message) || 'error')));
    });
}

function renderInstalled() {
  var g = document.getElementById('grid');
  if (!g) return;
  _ensureCapInst();

  // Подгрузить каталог CLI, если есть установленные, но каталог ещё не читан —

  if (cliGi().length && !_cliLoaded) {
    skKvGet('_mkt_cli_catalog').then(function(r){ _cliReg=(r&&r.items)?r.items:[]; _cliLoaded=true; if(cur==='mine')renderInstalled(); })
      .catch(function(){ _cliReg=_cliReg||[]; _cliLoaded=true; if(cur==='mine')renderInstalled(); });
  }

  var instIds = gi();
  var builtinInstalled = BUILTIN_PLUGINS_DATA.filter(function(p) {
    return instIds.indexOf(p.id) !== -1;
  });
  var all = builtinInstalled.concat(getCustom());

  // Установленные CLI-инструменты (капабилити) — работают через ассистента.
  var catMap = {}; (typeof cliCatalog === 'function' ? cliCatalog() : []).forEach(function(c){ catMap[c.id] = c; });
  var cliItems = cliGi().map(function(id){ return catMap[id] || {id:id, name:id, emoji:'🛠️', desc:'CLI-инструмент'}; });

    return;
  }

  var html = '';
  if (capItems.length) {

    html += '<div class="sect_hdr"><span class="sect_title">' + (en ? 'From the internet · Composer' : 'Из интернета · Композитор') + '</span><span class="sect_line"></span></div>';
    html += capItems.map(function(it, i){
      var kmap = en ? CAPINST_KIND_EN : CAPINST_KIND;

      var badge = it.status === 'installed'
        ? '<span style="color:#2a7a2a;font-size:11px;font-weight:600">● ' + (en ? 'installed' : 'установлено') + '</span>'
        : (it.status === 'installing'
          ? '<span style="color:#C67E34;font-size:11px;font-weight:600">◐ ' + (en ? 'installing…' : 'ставится…') + '</span>'

function uninst(id) {
  // Snapshot manifest BEFORE clearing localStorage so parent can do full cleanup.
  // If we cleared first, ETB.registry.getById() in the parent would return null,
  // causing CSPL cleanup to be skipped and the device registry file to persist,
  // which makes the plugin reappear on next boot (syncFromDevice reads it back).
  var pluginData = (getCustom().filter(function(p) { return p.id === id; })[0]) || null;

  // Remove from installed IDs and custom list
  si(gi().filter(function(x){ return x !== id; }));
  var remaining = getCustom().filter(function(p){ return p.id !== id; });
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(remaining)); } catch(_) {}

  // Send manifest snapshot so parent has artifact paths even after localStorage is gone
  try {
    window.parent.postMessage({
      type: 'etb_plugin_action',
      action: 'uninstall',
      pluginId: id,
      url: '',
      pluginData: pluginData
    }, '*');
  } catch(_) {}

  renderGrid();
  rtabs();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// ── Listen for parent messages ────────────────────────────────────────────
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'etb_merch') {

    featuredError = e.data.ok ? '' : (e.data.message || 'unknown error');
    renderGrid();
    rtabs();

});

function skBridge(sendType,resultType,payload,timeoutMs){
  return new Promise(function(res,rej){
    var reqId=sendType+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    function onMsg(ev){ if(!ev.data||ev.data.type!==resultType||ev.data.reqId!==reqId)return;
      window.removeEventListener('message',onMsg); if(ev.data.ok)res(ev.data);else rej(new Error(ev.data.error||'error')); }
    window.addEventListener('message',onMsg);
    window.parent.postMessage(Object.assign({type:sendType,reqId:reqId},payload),'*');
    setTimeout(function(){window.removeEventListener('message',onMsg);rej(new Error('_timeout_'));},timeoutMs||20000);
  });
}
function skKvGet(k){return skBridge('etb_kv_get','etb_kv_result',{key:k}).then(function(r){var v=r.value;if(!v)return null;try{return typeof v==='string'?JSON.parse(v):v;}catch(e){return null;}});}

// Каталоги >80 карточек не влезают в одну KV-ячейку (лимит ~28КБ) — харвестер бьёт
// их на шарды _mkt_x, _mkt_x_2, _mkt_x_3 (мета shards:N в первом). Склеиваем обратно.
function _loadSharded(base,field){
  field=field||'shelf';
  return skKvGet(base).then(function(r){
    if(!r) return r;
    var n=r.shards||1;
    if(n<=1) return r;
    var reqs=[];
    for(var i=2;i<=n;i++) reqs.push(skKvGet(base+'_'+i).catch(function(){return null;}));
    return Promise.all(reqs).then(function(parts){
      var arr=(r[field]||[]).slice();
      parts.forEach(function(p){ if(p&&p[field]) arr=arr.concat(p[field]); });
      r[field]=arr; return r;
    });
  });
}

function cliRunOp(batchExpert, btn){
  var dir=((document.getElementById('clirun_dir')||{}).value||'').trim();
  var msg=document.getElementById('clirun_msg');
  if(!dir){ if(msg)msg.innerHTML='⚠ Укажи папку с файлами.'; return; }
  if(btn)btn.disabled=true;
  if(msg)msg.innerHTML='⏳ Запущено на устройстве… обработка идёт, результат появится рядом с файлами. Может занять до пары минут.';
  skBridge('etb_run_expert','etb_expert_result',{name:batchExpert,params:{in_dir:dir}}, 180000).then(function(r){
    if(btn)btn.disabled=false;
    var out=r.res; if(out&&typeof out==='object'&&(out.result||out.output))out=out.result||out.output;
    if(typeof out==='string'){try{out=JSON.parse(out);}catch(e){}}
    if(!msg)return;
    if(out&&out.status==='success'){
      var saved=(out.total_saved_pct)?(' · сэкономлено '+out.total_saved_pct+'%'):'';
      msg.innerHTML='✓ Готово: обработано '+(out.ok||0)+' из '+(out.count||0)+(out.failed?(' · ошибок '+out.failed):'')+saved+
        (out.out_dir?('<br><span style="color:var(--tx3);font-size:11px">Результат в: '+esc(out.out_dir)+'</span>'):'');
    } else {
      msg.innerHTML='⚠ '+esc((out&&out.message)||'не удалось выполнить');
    }
  }).catch(function(e){
    if(btn)btn.disabled=false;
    if(!msg)return;
    if(e&&e.message==='_timeout_'){
      msg.innerHTML='▶ Задача запущена на устройстве. Обработка долгая — итог не успел прийти в это окно, но файлы уже готовятся: <b>проверь папку с результатом рядом с оригиналами</b> (папка …out).';
    } else {
      msg.innerHTML='⚠ '+esc((e&&e.message)||'нет ответа');
    }
  });
}
